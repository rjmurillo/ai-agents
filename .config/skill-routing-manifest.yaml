  security-detection: {role: front-door, owner: /autoplan}
  security-review: {role: front-door, owner: /autoplan}
  skillforge: {role: front-door, owner: /autoplan}
  software-engineering-library: {role: front-door, owner: /autoplan}
  world-model-diagnostic:
