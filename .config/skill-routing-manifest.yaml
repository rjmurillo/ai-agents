# Canonical skill routing role manifest (issue #5384).
#
# This is the ONE reviewed source of truth that assigns every canonical skill
# under `.claude/skills/<name>/` exactly one PRIMARY routing role. It is the
# small reviewed override the issue asks for: the skill list, the invocation
# graph (structural reachability), the derived `user_facing` flag, and the
# expected activation-scenario path are all computed from the canonical tree by
# `scripts/validation/skill_routing_manifest.py`. Do NOT duplicate this catalog
# into `src/copilot-cli/` or any mirror; the validator reads this file directly.
#
# How to classify a new skill: see docs/skill-routing-manifest.md.
#
# Roles (exactly one primary per skill):
#   front-door          directly selectable by /autoplan
#   lifecycle           selected by /spec, /plan, /build, /test, /ship, or /review
#   conditional-adjunct composed into another route only when a declared trigger matches
#   nested-helper       intentionally invoked only by another skill or agent
#   explicit-only       intentionally requires an explicit user request
#   deprecated          retained temporarily with a replacement/removal reference
#
# Required per-entry fields:
#   role   one of the roles above
#   owner  the canonical invoker: a slash command (/autoplan, /spec, /plan,
#          /build, /test, /ship, /review), the literal "user" for explicit-only,
#          or a skill/agent name for conditional-adjunct and nested-helper.
# Situational required fields:
#   trigger      required for conditional-adjunct (the predicate that composes it)
#   rationale    required for explicit-only (why auto-routing would be unsafe or noisy)
#   replacement  required for deprecated (replacement or removal issue reference)
# Optional:
#   note   free-form context (e.g. the dependent issue that wires the route)

skills:

  # ---- front-door: directly selectable by /autoplan --------------------------
  adr-generator: {role: front-door, owner: /autoplan}
  agent-harness-reference: {role: front-door, owner: /autoplan}
  ai-agents-portability-campaign: {role: front-door, owner: /autoplan}
  analyze: {role: front-door, owner: /autoplan}
  autoplan:
    role: front-door
    owner: /autoplan
    note: The router itself; the /autoplan front door.
  book-to-skill:
    role: front-door
    owner: /autoplan
    note: 'Route added by issue #5385.'
  business-strategy:
    role: front-door
    owner: /autoplan
    note: 'Route added by issue #5385.'
  buy-vs-build-framework: {role: front-door, owner: /autoplan}
  context-gather: {role: front-door, owner: /autoplan}
  github: {role: front-door, owner: /autoplan}
  memory-search: {role: front-door, owner: /autoplan}
  merge-resolver:
