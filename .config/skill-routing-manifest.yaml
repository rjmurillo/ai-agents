    owner: /autoplan
    note: 'Routed by /autoplan''s merge-conflict row as "Agent: merge-resolver".'
  pr-comment-responder: {role: front-door, owner: /autoplan}
  quality-grades: {role: front-door, owner: /autoplan}
  reflect: {role: front-door, owner: /autoplan}
  research-and-incorporate:
    role: front-door
    owner: /autoplan
