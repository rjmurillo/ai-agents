  # ---- explicit-only: requires an explicit user request ---------------------
  benchmark-models:
    role: explicit-only
    owner: user
    rationale: Benchmarks models against fixtures; it spends tokens and wall-clock time, so it must be requested explicitly rather than auto-routed.
  chaos-experiment:
    role: explicit-only
    owner: user
    rationale: Injects failures to test resilience; auto-routing is unsafe because it perturbs a running system.
  codebase-documenter:
    role: explicit-only
    owner: user
    rationale: Generates codebase documentation on demand; auto-routing would produce unrequested docs.
  codeql-scan:
    role: explicit-only
    owner: user
    rationale: Runs the CodeQL engine, which is expensive and CI/explicit-triggered, so it is not auto-routed on every change.
  encode-repo-serena:
    role: explicit-only
    owner: user
    rationale: One-time Serena index setup invoked via /context-hub-setup; auto-running it on unrelated requests would be slow and noisy.
  git-advanced-workflows:
    role: explicit-only
    owner: user
    rationale: Advanced, potentially destructive git operations (rebase, history rewrite); must be requested explicitly for safety.
  metrics:
    role: explicit-only
    owner: user
    rationale: Collects usage metrics from git history to build dashboards; running it on ordinary requests would be noisy and spend time on unrequested reporting.
  negotiation:
    role: explicit-only
    owner: user
    rationale: Deal-analysis skill for offers and counter-proposals; irrelevant to code work, so it must be requested explicitly.
  observability:
    role: explicit-only
    owner: user
    rationale: Queries agent JSONL event logs for debugging; auto-routing on unrelated requests would be noisy.
  planner:
    role: explicit-only
    owner: user
    rationale: Interactive multi-step planning and execution; the /plan lifecycle command is the automatic route, so this heavyweight skill is invoked only on explicit request to avoid double-routing.
  prompt-engineer:
    role: explicit-only
    owner: user
    rationale: Human-in-the-loop prompt optimization; auto-editing prompts without an explicit request would be unsafe.
  retrospective:
    role: explicit-only
    owner: user
    rationale: Invoked explicitly via /retro after a milestone or correction; auto-running retrospection on every task would be noisy.
  slashcommandcreator:
    role: explicit-only
    owner: user
    rationale: Creates new slash commands; auto-routing would manufacture command scaffolding nobody requested.
  windows-image-updater:
    role: explicit-only
    owner: user
    rationale: Mutates Windows CI image infrastructure; unsafe to auto-route because it changes shared build infra.
