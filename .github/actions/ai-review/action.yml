name: 'AI Review'
description: 'Invoke GitHub Copilot CLI for AI-powered code review with structured verdict output'

inputs:
  agent:
    description: 'Agent to invoke (security, qa, analyst, critic, roadmap, etc.)'
    required: true
  context-type:
    description: 'Context type: pr-diff, issue, session-log, spec-file'
    required: true
  context-path:
    description: 'Path to context file (for session-log, spec-file types)'
    required: false
    default: ''
  pr-number:
    description: 'PR number (for pr-diff context type)'
    required: false
    default: ''
  issue-number:
    description: 'Issue number (for issue context type)'
    required: false
    default: ''
  additional-context:
    description: 'Additional context to inject (text or JSON)'
    required: false
    default: ''
  prompt-file:
    description: 'Path to prompt template file (relative to repo root)'
    required: false
    default: ''
  timeout-minutes:
    description: 'Timeout in minutes for Copilot CLI invocation'
    required: false
    default: '5'
  max-diff-lines:
    description: 'Maximum diff lines before switching to summary mode'
    required: false
    default: '500'
  bot-pat:
    description: 'GitHub PAT for GitHub CLI operations (gh commands). Can be classic or fine-grained PAT with repo access.'
    required: true
  github-token:
    description: 'Runner-scoped GitHub token for GitHub API reads'
    required: false
    default: ''
  copilot-token:
    description: |
      Fine-grained PAT with "Copilot Requests" permission for Copilot CLI.
      Required for AI review functionality. See docs/copilot-cli-setup.md.
      If not provided, falls back to bot-pat (which may fail without Copilot permission).
    required: false
    default: ''
  copilot-model:
    description: |
      AI model to use. Default "auto" lets Copilot CLI pick an available model,
      which stays valid when a specific model name is retired (e.g. the
      claude-opus-4.5 retirement that broke required review checks). Pin an
      explicit name only when a job needs a specific model (e.g. "claude-sonnet-4.5",
      "claude-haiku-4.5", "claude-opus-4.6", "gpt-5.1", "gemini-3-pro-preview").
    required: false
    default: 'auto'
  enable-diagnostics:
    description: |
      Enable Copilot CLI diagnostic test before main invocation.
      WARNING: This runs a test prompt which costs money! Only enable for debugging.
      Default is false to minimize costs.
    required: false
    default: 'false'
  execute-script:
    description: |
      Optional script to run after analysis (Python or PowerShell).
      The script receives AI findings via environment variables:
      - AI_VERDICT: The parsed verdict (PASS, WARN, CRITICAL_FAIL, etc.)
      - AI_FINDINGS: Raw output from the AI model (JSON if prompt requested it)
      - AI_LABELS: Parsed labels (JSON array)
      - PR_NUMBER: The PR number being analyzed
      Use this for post-analysis mutations (acknowledge comments, apply fixes, etc.)
    required: false
    default: ''

outputs:
  verdict:
    description: 'Review verdict (PASS, WARN, CRITICAL_FAIL, REJECTED, NEEDS_REVIEW, etc.)'
    value: ${{ steps.parse.outputs.verdict }}
  labels:
    description: 'Labels to apply (JSON array)'
    value: ${{ steps.parse.outputs.labels }}
  milestone:
    description: 'Milestone to assign'
    value: ${{ steps.parse.outputs.milestone }}
  findings:
    description: 'Detailed findings (raw output from model)'
    value: ${{ steps.invoke.outputs.raw_output }}
  exit-code:
    description: 'Exit code (0=pass, 1=fail)'
    value: ${{ steps.parse.outputs.exit_code }}
  # Retry/infrastructure failure tracking (Issue #328)
  # Falls back to 'true' when context build fails (e.g., missing BOT_PAT for first-time contributor PRs)
  infrastructure-failure:
    description: 'Whether failure was infrastructure-related (true/false)'
    value: ${{ steps.invoke.outputs.infrastructure_failure || steps.infra_gate.outputs.infrastructure_failure || 'false' }}
  retry-count:
    description: 'Number of retry attempts made (0 = no retries)'
    value: ${{ steps.invoke.outputs.retry_count || steps.infra_gate.outputs.retry_count }}
  # Debug outputs for AI agents and humans
  full-prompt:
    description: 'Complete prompt sent to the model (for debugging)'
    value: ${{ steps.invoke.outputs.full_prompt }}
  agent-definition:
    description: 'Agent definition used (for debugging)'
    value: ${{ steps.agent.outputs.agent_definition }}
  prompt-template:
    description: 'Prompt template used (for debugging)'
    value: ${{ steps.prompt.outputs.prompt_template }}
  context-built:
    description: 'Context built from PR/issue (for debugging)'
    value: ${{ steps.context.outputs.context_built }}
  context-mode:
    description: 'Context mode used (full or summary)'
    value: ${{ steps.context.outputs.context_mode }}
  copilot-exit-code:
    description: 'Raw exit code from Copilot CLI'
    value: ${{ steps.invoke.outputs.copilot_exit_code }}
  copilot-version:
    description: 'Copilot CLI version used'
    value: ${{ steps.install.outputs.copilot_version }}
  # Enhanced diagnostic outputs
  copilot-diagnostic:
    description: 'Copilot CLI diagnostic information (health check results)'
    value: ${{ steps.diagnose.outputs.diagnostic }}
  copilot-health:
    description: 'Copilot CLI health status (healthy, degraded, failed)'
    value: ${{ steps.diagnose.outputs.health_status }}
  copilot-stderr:
    description: 'Stderr output from Copilot CLI (if any)'
    value: ${{ steps.invoke.outputs.stderr_output }}
  auth-status:
    description: 'GitHub authentication status details'
    value: ${{ steps.diagnose.outputs.auth_status }}

runs:
  using: 'composite'
  steps:
    - name: Establish AI review action deadline
      id: deadline
      shell: bash
      env:
        INHERITED_DEADLINE_EPOCH: ${{ env.AI_REVIEW_ACTION_DEADLINE_EPOCH }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/establish_ai_review_deadline.py"

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 'lts/*'

    - name: Cache npm packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-copilot-cli-v1
        restore-keys: |
          ${{ runner.os }}-copilot-cli-

    - name: Install GitHub Copilot CLI
      id: install
      shell: bash
      run: |
        export COPILOT_VERSION="1.0.63"
        python3 "$GITHUB_WORKSPACE/scripts/ci/install_copilot_cli.py"

    # Issue #4607: BOT_PAT was configured per ADR-026 Decision 5 but resolved
    # to the human account, so CI shared one API budget with every agent
    # session and no run log could show it. This step runs unconditionally
    # (unlike the enable-diagnostics steps below) so every run log reports
    # which identity bot-pat resolves to. Non-blocking: a MISMATCH warns
    # loudly instead of turning every review red before the owner rotates
    # the secret. Set IDENTITY_STRICT=true here once the secret is rotated
    # to make the identity a hard gate.
    - name: Report bot-pat identity
      id: bot_identity
      shell: bash
      env:
        IDENTITY_TOKEN: ${{ inputs.bot-pat }}
        EXPECTED_BOT_ID: '250269933'
        EXPECTED_BOT_LOGIN: 'rjmurillo-bot'
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/check_bot_identity.py"

    - name: Verify GitHub authentication
      if: inputs.enable-diagnostics == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token || inputs.bot-pat }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/verify_github_auth.py"

    - name: Diagnose Copilot CLI
      id: diagnose
      if: inputs.enable-diagnostics == 'true'
      shell: bash
      env:
        # Use dedicated Copilot token if provided, otherwise fall back to bot-pat
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token || inputs.bot-pat }}
        GH_TOKEN: ${{ inputs.github-token || github.token || inputs.bot-pat }}
        COPILOT_AGENT: ${{ inputs.agent }}
        COPILOT_MODEL: ${{ inputs.copilot-model }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/diagnose_copilot_cli.py"

    - name: Build context
      id: context
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token || inputs.bot-pat }}
        CONTEXT_TYPE: ${{ inputs.context-type }}
        PR_NUMBER: ${{ inputs.pr-number }}
        ISSUE_NUMBER: ${{ inputs.issue-number }}
        CONTEXT_PATH: ${{ inputs.context-path }}
        MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        AI_REVIEW_ACTION_DEADLINE_EPOCH: ${{ steps.deadline.outputs.deadline_epoch }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/build_ai_review_context.py"

    - name: Load prompt template
      id: prompt
      shell: bash
      env:
        PROMPT_FILE: ${{ inputs.prompt-file }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/load_ai_review_prompt.py"

    - name: Check context infrastructure gate
      id: infra_gate
      shell: bash
      env:
        CONTEXT_INFRA_FAILURE: ${{ steps.context.outputs.context_infra_failure }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/check_ai_review_infra_gate.py"

    - name: Invoke Copilot CLI (with retry for infrastructure failures)
      id: invoke
      # Skip the Copilot invocation when the Build context step reported an
      # infrastructure failure. The gate step owns the skip decision and wrote
      # the DID_NOT_RUN verdict file the parse step reads (ADR-006, issue #2967).
      if: steps.infra_gate.outputs.skip != 'true'
      shell: bash
      env:
        # Use dedicated Copilot token if provided, otherwise fall back to bot-pat
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token || inputs.bot-pat }}
        GH_TOKEN: ${{ inputs.github-token || github.token || inputs.bot-pat }}
        AI_REVIEW_OUTPUT_FILE: ${{ steps.infra_gate.outputs.output_file }}
        ADDITIONAL_CONTEXT: ${{ inputs.additional-context }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        COPILOT_AGENT: ${{ inputs.agent }}
        COPILOT_MODEL: ${{ inputs.copilot-model }}
        AI_REVIEW_ACTION_DEADLINE_EPOCH: ${{ steps.deadline.outputs.deadline_epoch }}
        # Computed context mode (full|summary|partial) from the Build context step.
        # The internal "error" mode skips invocation before prompt assembly.
        # Injected into the prompt so the reviewer model sees how much of the
        # diff it actually received and can refuse PASS when it is not full
        # (AI-REVIEW-MODEL-POLICY.md "CONTEXT_MODE Header (REQUIRED)", issue #1981).
        CONTEXT_MODE: ${{ steps.context.outputs.context_mode }}
        CONTEXT_FILE: ${{ steps.context.outputs.context_file }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/invoke_copilot_cli.py"

    - name: Parse output
      id: parse
      shell: bash
      env:
        AI_REVIEW_OUTPUT_FILE: ${{ steps.infra_gate.outputs.output_file }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/parse_ai_review_output.py"

    - name: Execute post-analysis script
      if: inputs.execute-script != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.bot-pat }}
        AI_VERDICT: ${{ steps.parse.outputs.verdict }}
        AI_FINDINGS: ${{ steps.invoke.outputs.raw_output }}
        AI_LABELS: ${{ steps.parse.outputs.labels }}
        PR_NUMBER: ${{ inputs.pr-number }}
        EXECUTE_SCRIPT: ${{ inputs.execute-script }}
      run: python3 "$GITHUB_WORKSPACE/scripts/ci/execute_ai_review_post_script.py"
