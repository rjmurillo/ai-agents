name: 'Upload Validator Evidence'
description: 'Write the calling job result as typed evidence and upload it (ADR-113, issue 5636).'

# Call this as the last step of a validator job, with `if: always()`, after a
# checkout that includes scripts/validation and this action. The logic lives in
# scripts/validation/emit_validator_evidence.py. It writes nothing for a pull
# request run or a feature branch push, so the upload step is skipped there.
#
# The artifact name is the validator name, as the ADR requires. `overwrite`
# lets a re-run of the same workflow run replace its earlier file.
#
# Retention is 7 days, the standard tier in ADR-015. Evidence older than the
# window is missing, which the gate reads as a finding, so a candidate older
# than a week needs its validator workflows re-run on the same SHA first.

inputs:
  validator:
    description: 'Validator name from .agents/governance/promotion-applicability.json'
    required: true
  job-status:
    description: 'The calling job status: pass ${{ job.status }}'
    required: true
  ran:
    description: "'true' when the job did its validation work, 'false' when it short-circuited"
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Write validator evidence
      id: emit
      shell: bash
      env:
        VALIDATOR: ${{ inputs.validator }}
        JOB_STATUS: ${{ inputs.job-status }}
        RAN: ${{ inputs.ran }}
        REVISION: ${{ github.sha }}
        EVENT_NAME: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        JOB_ID: ${{ github.job }}
        EVIDENCE_DIR: ${{ runner.temp }}/validator-evidence
        # The emitter needs no token. A caller workflow may set GH_TOKEN for
        # its own steps, and this blank keeps it out of this process.
        GH_TOKEN: ''
      run: >-
        python3 scripts/validation/emit_validator_evidence.py
        --validator "$VALIDATOR"
        --job-status "$JOB_STATUS"
        --ran "$RAN"
        --revision "$REVISION"
        --event "$EVENT_NAME"
        --ref "$REF"
        --default-branch "$DEFAULT_BRANCH"
        --job-id "$JOB_ID"
        --output-dir "$EVIDENCE_DIR"
        --github-output "$GITHUB_OUTPUT"

    - name: Upload validator evidence
      if: steps.emit.outputs.emitted == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.validator }}
        path: ${{ runner.temp }}/validator-evidence/${{ inputs.validator }}.json
        if-no-files-found: error
        overwrite: true
        retention-days: 7
