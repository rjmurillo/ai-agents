name: 'Check Agent Infrastructure'
description: 'Validate infrastructure prerequisites before invoking AI agents'

# Lightweight, zero-cost health checks that run by default.
# Distinct from ai-review's enable-diagnostics (which runs test prompts).
# See: https://github.com/rjmurillo/ai-agents/issues/153

inputs:
  bot-pat:
    description: 'GitHub PAT for authentication checks'
    required: true
  github-token:
    description: 'Runner-scoped GitHub token for GitHub API reads'
    required: false
    default: ''
  copilot-token:
    description: 'Copilot token to validate (falls back to bot-pat)'
    required: false
    default: ''

outputs:
  github-cli-available:
    description: 'Whether GitHub CLI is installed and functional'
    value: ${{ steps.check.outputs.github-cli-available }}
  copilot-available:
    description: 'Whether the Copilot CLI binary is present (binary only, says nothing about auth)'
    value: ${{ steps.check.outputs.copilot-available }}
  copilot-auth-status:
    description: 'Copilot credential state: valid, absent, rejected, unverified'
    value: ${{ steps.check.outputs.copilot-auth-status }}
  auth-valid:
    description: 'Whether GitHub accepted COPILOT_GITHUB_TOKEN (issue #4778: not the runner token)'
    value: ${{ steps.check.outputs.auth-valid }}
  reviews-enabled:
    description: 'Single gate: true when agent review jobs should invoke the model'
    value: ${{ steps.check.outputs.reviews-enabled }}
  overall-status:
    description: 'Overall infrastructure status: ready, degraded, unavailable'
    value: ${{ steps.check.outputs.overall-status }}
  summary:
    description: 'Human-readable summary of check results'
    value: ${{ steps.check.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Check Agent Infrastructure
      id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token || github.token || inputs.bot-pat }}
        COPILOT_GITHUB_TOKEN: ${{ inputs.copilot-token || inputs.bot-pat }}
      run: |
        python3 "${GITHUB_ACTION_PATH}/../../../scripts/ci/check_agent_infrastructure.py"
