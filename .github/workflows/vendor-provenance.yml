# Vendor Provenance Gate (Trusted Base-Branch Validator)
#
# Security architecture:
# - Uses pull_request_target: workflow YAML executes from BASE branch (main)
# - Validator script is from base branch checkout only
# - Candidate data fetched via git (no actions/checkout for PR head)
# - NO candidate code is ever executed
# - persist-credentials: false on the single checkout
#
# Once merged and configured as a required status check, this gate prevents
# any PR from merging tampered vendor content regardless of what that PR
# modifies in its own workflow or validator copies.

name: Vendor Provenance

permissions:
  contents: read

on:
  pull_request_target:
    branches: [main, fix/vendor-provenance-bootstrap]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'
      - '.claude/hooks/PreToolUse/_markdownlint_verifier.py'
      - '.claude/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - '.claude/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'build/scripts/generate_hooks_events.py'
  push:
    branches: [main]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'
      - 'scripts/ci/validate_vendor_provenance.py'

jobs:
  provenance:
    name: Validate Vendor Provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      # Checkout base branch (trusted code only)
      - name: Checkout trusted code (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref || github.ref_name }}
          persist-credentials: false

      # Fetch candidate commit and extract data via git (no checkout action)
      - name: Fetch candidate data via git
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fine-grained PAT for cross-fork PR head fetches (rate limits, private forks).
          # Falls back to implicit GITHUB_TOKEN when unset.
          GH_FETCH_TOKEN: ${{ secrets.VENDOR_PROVENANCE_PAT || github.token }}
        run: |
          git -c "http.extraHeader=Authorization: token ${GH_FETCH_TOKEN}"             fetch --depth=1 origin "$PR_SHA"
          mkdir -p /tmp/candidate
          git archive "$PR_SHA" | tar -x -C /tmp/candidate

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      # Run trusted validator (from base branch) against candidate data
      - name: Validate vendor provenance (trusted gate)
        run: |
          python3 scripts/ci/validate_vendor_provenance.py \
            --candidate-root /tmp/candidate \
            --vendor-rel .claude/hooks/PreToolUse/_vendor/markdownlint \
            --verifier-rel .claude/hooks/PreToolUse/_markdownlint_verifier.py \
            --mirror-rel src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py \
            --config-rel .claude/hooks/PreToolUse/markdownlint-safe-config.yaml \
            --cli2-config-rel .claude/hooks/PreToolUse/markdownlint-cli2.yaml \
            --copilot-config-rel src/copilot-cli/hooks/PreToolUse/markdownlint-safe-config.yaml \
            --copilot-cli2-config-rel src/copilot-cli/hooks/PreToolUse/markdownlint-cli2.yaml
