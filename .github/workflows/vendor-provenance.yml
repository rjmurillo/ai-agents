# Vendor Provenance Gate (Trusted Base-Branch Validator)
#
# Security architecture:
# - pull_request_target: workflow YAML executes from BASE branch
# - NO actions/checkout: trusted code materialized from immutable event SHA
#   via git read-tree + checkout-index (ignores .gitattributes export-ignore)
# - Validator script runs from base commit only; candidate via separate tree
# - NO candidate code is ever executed
# - All refs are immutable event SHAs; no branch names used
# - Changed-path transport is NUL-delimited (handles tabs/newlines safely)
# - Git and pipeline failures fail closed (set -euo pipefail)
#
# Once merged and configured as a required status check, this gate prevents
# any PR from merging tampered hook or vendor content regardless of what
# that PR modifies in its own workflow or validator copies.

name: Vendor Provenance

concurrency:
  group: vendor-provenance-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  statuses: write

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

jobs:
  provenance:
    name: Validate Vendor Provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      statuses: write

    env:
      PR_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
      PR_SENDER: ${{ github.event.sender.login }}
      PR_ACTION: ${{ github.event_name == 'merge_group' && 'merge_group' || github.event.action }}

    steps:
      - name: Fetch trusted base and claim head generation
        if: github.event_name == 'pull_request_target'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_FETCH_TOKEN: ${{ secrets.VENDOR_PROVENANCE_PAT || github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Start from an empty workspace. `-f` ignores unmatched globs, while
          # permission and filesystem failures still stop under `set -e`.
          # The patterns cover normal files, short dotfiles, and longer
          # dotfiles without matching `.` or `..`. Fetch both immutable event
          # SHAs before loading the base-owned validator into runner temp.
          # The generation claim runs before any candidate tree materializes.
          # A newer run ID blocks every later head-state write from this run.
          rm -rf -- * .[!.]* ..?*
          git init --quiet
          git remote add origin "https://github.com/${{ github.repository }}.git"
          timeout 120s git -c "http.extraHeader=Authorization: token ${GH_FETCH_TOKEN}" \
            fetch origin "$BASE_SHA" "$PR_SHA"
          git show "$BASE_SHA:scripts/ci/validate_vendor_provenance.py" \
            > "$RUNNER_TEMP/validate_vendor_provenance.py"
          python3 "$RUNNER_TEMP/validate_vendor_provenance.py" \
            --claim-head-generation "${{ github.repository }}" "$PR_SHA"

      - name: Materialize trusted base (immutable SHA)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Populate workspace with trusted base code (read-tree ignores
          # candidate .gitattributes export-ignore directives)
          git read-tree "$BASE_SHA"
          git checkout-index -a -f --prefix="$GITHUB_WORKSPACE/"

      - name: Create in-progress check run
        # Runs as early as the trusted-base checkout allows (this workflow
        # has no actions/checkout step; the script only exists once the
        # base tree above has been materialized). On `edited`/`reopened`,
        # PR_SHA is unchanged, so without this step a prior run's
        # completed "Validate Vendor Provenance" check-run for that same
        # SHA remains the latest status for the whole re-validation
        # window. Creating an in_progress run here immediately shadows
        # any such stale success. Bounded retries absorb transient API
        # failures. If creation still fails, the job fails and the final
        # publisher refuses to create a second competing check-run row.
        if: always() && !cancelled() && github.event_name == 'pull_request_target'
        id: create_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CHECK_RUN_ID=$(python3 scripts/ci/validate_vendor_provenance.py \
            --start-head-gates "${{ github.repository }}" "$PR_SHA")
          echo "check_run_id=$CHECK_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Materialize candidate and comparison trees
        run: |
          set -euo pipefail
          # Candidate tree via read-tree (immune to export-ignore)
          mkdir -p /tmp/candidate
          GIT_INDEX_FILE=/tmp/idx-pr git read-tree "$PR_SHA"
          GIT_INDEX_FILE=/tmp/idx-pr git checkout-index -a --prefix=/tmp/candidate/
          # Base tree for deletion detection
          mkdir -p /tmp/base
          GIT_INDEX_FILE=/tmp/idx-base git read-tree "$BASE_SHA"
          GIT_INDEX_FILE=/tmp/idx-base git checkout-index -a --prefix=/tmp/base/

      - name: Reject gitlinks in candidate tree
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_vendor_provenance.py \
            --reject-gitlinks "$PR_SHA"

      - name: Check relevance (NUL-safe)
        id: relevance
        run: |
          set -euo pipefail
          # Require merge-base success; fail closed on git errors
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$PR_SHA")
          # NUL-delimited diff-tree piped to Python stdin; no shell expansion
          DOMINATED=$(git diff-tree -r --name-only --diff-filter=ACDMRT -z \
            "$MERGE_BASE" "$PR_SHA" \
            | python3 scripts/ci/validate_vendor_provenance.py --check-relevance-stdin)
          echo "dominated=$DOMINATED" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.14.6'

      - name: Set up uv
        if: steps.relevance.outputs.dominated == 'true'
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: '0.12.0'

      - name: Setup Node.js
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Validate vendor provenance (trusted gate)
        if: steps.relevance.outputs.dominated == 'true'
        run: |
          set -euo pipefail
          uv run --frozen python scripts/ci/validate_vendor_provenance.py \
            --candidate-root /tmp/candidate \
            --base-root /tmp/base \
            --pr-sha "$PR_SHA" \
            --pull-request-author "$PR_AUTHOR" \
            --pull-request-sender "$PR_SENDER" \
            --pull-request-action "$PR_ACTION"

      - name: No-op for unrelated PRs
        if: steps.relevance.outputs.dominated != 'true'
        run: echo "No hook/vendor files changed. Provenance check not required."

      - name: Publish check run on PR head SHA
        if: always() && !cancelled() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RUN_ID: ${{ steps.create_check.outputs.check_run_id }}
        run: |
          set -euo pipefail
          CONCLUSION=${{ job.status == 'success' && 'success' || 'failure' }}
          python3 scripts/ci/validate_vendor_provenance.py \
            --finish-head-gates "${{ github.repository }}" "$PR_SHA" "$CONCLUSION" \
            --check-run-id "$CHECK_RUN_ID"
