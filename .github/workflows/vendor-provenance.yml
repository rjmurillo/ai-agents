# Vendor Provenance Gate (Trusted Base-Branch Validator)
#
# Security architecture:
# - pull_request_target: workflow YAML executes from BASE branch
# - NO actions/checkout: trusted code materialized from immutable event SHA
#   via git read-tree + checkout-index (ignores .gitattributes export-ignore)
# - Validator script runs from base commit only; candidate via separate tree
# - NO candidate code is ever executed
# - All refs are immutable event SHAs; no branch names used
# - Changed-path transport is NUL-delimited (handles tabs/newlines safely)
# - Git and pipeline failures fail closed (set -euo pipefail)
#
# Once merged and configured as a required status check, this gate prevents
# any PR from merging tampered hook or vendor content regardless of what
# that PR modifies in its own workflow or validator copies.

name: Vendor Provenance

permissions:
  contents: read

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

jobs:
  provenance:
    name: Validate Vendor Provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    env:
      PR_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      PR_SENDER: ${{ github.event.sender.login }}

    steps:
      - name: Materialize trusted base (immutable SHA)
        env:
          GH_FETCH_TOKEN: ${{ secrets.VENDOR_PROVENANCE_PAT || github.token }}
        run: |
          set -euo pipefail
          # Start from an empty workspace with a bare git repo
          cd "$GITHUB_WORKSPACE"
          rm -rf ./* ./.??* 2>/dev/null || true
          git init --quiet
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git -c "http.extraHeader=Authorization: token ${GH_FETCH_TOKEN}" \
            fetch --depth=50 origin "$BASE_SHA" "$PR_SHA"
          # Populate workspace with trusted base code (read-tree ignores
          # candidate .gitattributes export-ignore directives)
          git read-tree "$BASE_SHA"
          git checkout-index -a -f

      - name: Materialize candidate and comparison trees
        run: |
          set -euo pipefail
          # Candidate tree via read-tree (immune to export-ignore)
          mkdir -p /tmp/candidate
          GIT_INDEX_FILE=/tmp/idx-pr git read-tree "$PR_SHA"
          GIT_INDEX_FILE=/tmp/idx-pr git checkout-index -a --prefix=/tmp/candidate/
          # Base tree for deletion detection
          mkdir -p /tmp/base
          GIT_INDEX_FILE=/tmp/idx-base git read-tree "$BASE_SHA"
          GIT_INDEX_FILE=/tmp/idx-base git checkout-index -a --prefix=/tmp/base/

      - name: Check relevance (NUL-safe)
        id: relevance
        run: |
          set -euo pipefail
          # Require merge-base success; fail closed on git errors
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$PR_SHA")
          # NUL-delimited diff-tree piped to Python stdin; no shell expansion
          DOMINATED=$(git diff-tree -r --name-only --diff-filter=ACDMRT -z \
            "$MERGE_BASE" "$PR_SHA" \
            | python3 scripts/ci/validate_vendor_provenance.py --check-relevance-stdin)
          echo "dominated=$DOMINATED" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup uv
        if: steps.relevance.outputs.dominated == 'true'
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      - name: Setup Node.js
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Validate vendor provenance (trusted gate)
        if: steps.relevance.outputs.dominated == 'true'
        run: |
          set -euo pipefail
          uv run --frozen python scripts/ci/validate_vendor_provenance.py \
            --candidate-root /tmp/candidate \
            --base-root /tmp/base \
            --pull-request-author "$PR_AUTHOR" \
            --pull-request-sender "$PR_SENDER"

      - name: No-op for unrelated PRs
        if: steps.relevance.outputs.dominated != 'true'
        run: echo "No hook/vendor files changed. Provenance check not required."
