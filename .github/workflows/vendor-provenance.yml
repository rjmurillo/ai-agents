# Vendor Provenance Gate
#
# Reconstructs the vendored markdownlint-cli2 tree from its package-lock.json
# using npm ci with registry integrity verification, then compares
# byte-for-byte against the committed vendor tree. Security model:
# - npm ci verifies package tarballs against lockfile integrity hashes
# - Reconstruction produces canonical content independent of PR changes
# - If attacker tampers vendor JS, manifest, or pin, npm ci reconstruction
#   will not match (lockfile integrity is registry-signed)
# - Branch protection requires this check to pass before merge
#
# Trigger: any change to vendor tree, lockfile, manifest, verifier, config,
# generator, or mirror paths.

name: Vendor Provenance

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'
      - '.claude/hooks/PreToolUse/_markdownlint_verifier.py'
      - '.claude/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - '.claude/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'build/scripts/generate_hooks_events.py'
  push:
    branches: [main]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'

jobs:
  provenance:
    name: Validate Vendor Provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Network-dependent steps require npm registry access.
      # Skipped under act (local runner) where registry is unreliable.
      - name: Setup Node.js
        if: ${{ !env.ACT }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Save committed vendor hashes
        run: |
          find .claude/hooks/PreToolUse/_vendor/markdownlint/node_modules -type f \
            -exec sha256sum {} \; | sort > /tmp/committed-hashes.txt

      - name: Reconstruct vendor from lockfile (integrity-verified)
        if: ${{ !env.ACT }}
        run: |
          cd .claude/hooks/PreToolUse/_vendor/markdownlint
          rm -rf node_modules
          npm ci --ignore-scripts --audit=false
        env:
          npm_config_fund: 'false'

      - name: Compare reconstruction against committed tree
        if: ${{ !env.ACT }}
        run: |
          find .claude/hooks/PreToolUse/_vendor/markdownlint/node_modules -type f \
            -exec sha256sum {} \; | sort > /tmp/reconstructed-hashes.txt
          if ! diff /tmp/committed-hashes.txt /tmp/reconstructed-hashes.txt; then
            echo "FAIL: Vendor tree does not match lockfile reconstruction"
            exit 1
          fi
          echo "PASS: Vendor tree matches lockfile reconstruction"

      - name: Validate manifest digest pinned in verifier
        run: |
          python3 scripts/ci/validate_vendor_provenance.py \
            --vendor-dir .claude/hooks/PreToolUse/_vendor/markdownlint \
            --verifier .claude/hooks/PreToolUse/_markdownlint_verifier.py \
            --mirror src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py
