# Vendor Provenance Gate (Trusted Base-Branch Validator)
#
# Security architecture:
# - pull_request_target: workflow YAML executes from BASE branch (main)
# - Validator script runs from base branch only; candidate data via read-tree
# - NO candidate code is ever executed
# - persist-credentials: false on checkout
# - Always emits the required check; unrelated PRs get a success no-op
#
# Once merged and configured as a required status check, this gate prevents
# any PR from merging tampered hook or vendor content regardless of what
# that PR modifies in its own workflow or validator copies.

name: Vendor Provenance

permissions:
  contents: read

on:
  pull_request_target:
    branches: [main]

jobs:
  provenance:
    name: Vendor Provenance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout trusted code (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Materialize candidate and base trees
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_FETCH_TOKEN: ${{ secrets.VENDOR_PROVENANCE_PAT || github.token }}
        run: |
          # Fetch candidate commit (immutable event SHA, not moving branch ref)
          git -c "http.extraHeader=Authorization: token ${GH_FETCH_TOKEN}" \
            fetch --depth=50 origin "$PR_SHA" "$BASE_SHA"
          # Materialize via read-tree + checkout-index (ignores .gitattributes
          # export-ignore, unlike git archive which lets candidates hide files
          # from validation while they remain in the merged tree)
          mkdir -p /tmp/candidate
          GIT_INDEX_FILE=/tmp/idx-pr git read-tree "$PR_SHA"
          GIT_INDEX_FILE=/tmp/idx-pr git checkout-index -a --prefix=/tmp/candidate/
          # Base tree for deletion detection
          mkdir -p /tmp/base
          GIT_INDEX_FILE=/tmp/idx-base git read-tree "$BASE_SHA"
          GIT_INDEX_FILE=/tmp/idx-base git checkout-index -a --prefix=/tmp/base/

      - name: Check relevance
        id: relevance
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Require merge-base success; fail closed on git errors
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$PR_SHA")
          if [ $? -ne 0 ]; then
            echo "ERROR: merge-base failed (insufficient history)" >&2
            exit 1
          fi
          # NUL-delimited diff to handle tab/newline/quote in paths safely
          DOMINATED=$(git diff-tree -r --name-only -z --diff-filter=ACDMRT "$MERGE_BASE" "$PR_SHA" \
            | python3 scripts/ci/validate_vendor_provenance.py --check-relevance-stdin)
          if [ $? -ne 0 ]; then
            echo "ERROR: relevance check failed" >&2
            exit 1
          fi
          echo "dominated=$DOMINATED" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Setup Node.js
        if: steps.relevance.outputs.dominated == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Validate vendor provenance (trusted gate)
        if: steps.relevance.outputs.dominated == 'true'
        run: |
          python3 scripts/ci/validate_vendor_provenance.py \
            --candidate-root /tmp/candidate \
            --base-root /tmp/base

      - name: No-op for unrelated PRs
        if: steps.relevance.outputs.dominated != 'true'
        run: echo "No hook/vendor files changed. Provenance check not required."
