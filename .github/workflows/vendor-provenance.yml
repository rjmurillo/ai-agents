# Vendor Provenance Gate (Trusted Base-Branch Validator)
#
# Security architecture:
# - Uses pull_request_target: workflow YAML executes from BASE branch (main)
# - Validator script is from base branch checkout only
# - Candidate data fetched via git (no actions/checkout for PR head)
# - NO candidate code is ever executed
# - persist-credentials: false on the single checkout
#
# Rollout: GitHub reports a job's `name:` as the check-run context, not the
# workflow `name:`. Requiring the workflow name would wait forever because it
# is never emitted. Configure branch protection with exactly this context:
#
# Required status check context: Validate Vendor Provenance
#
# The line above is pinned to the job `name:` below by
# tests/ci/test_validate_vendor_provenance.py::TestWorkflowContract, so the
# instruction cannot drift from the emitted context.
#
# Once configured, this gate prevents any PR from merging tampered vendor
# content regardless of what that PR modifies in its own workflow or
# validator copies.

name: Vendor Provenance

permissions:
  contents: read

on:
  pull_request_target:
    branches: [main, fix/vendor-provenance-bootstrap]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'
      - '.claude/hooks/PreToolUse/_markdownlint_verifier.py'
      - '.claude/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - '.claude/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-safe-config.yaml'
      - 'src/copilot-cli/hooks/PreToolUse/markdownlint-cli2.yaml'
      - 'build/scripts/generate_hooks_events.py'
  push:
    branches: [main]
    paths:
      - '.claude/hooks/PreToolUse/_vendor/**'
      - 'scripts/ci/validate_vendor_provenance.py'

jobs:
  provenance:
    name: Validate Vendor Provenance
    runs-on: ubuntu-26.04-arm
    environment: vendor-provenance
    timeout-minutes: 10

    steps:
      # Checkout base branch (trusted code only)
      - name: Checkout trusted code (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.base_ref || github.ref_name }}
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Fetch the candidate commit via git (no checkout action). Git smart
      # HTTP accepts the token as a Basic password under the x-access-token
      # user, the same header actions/checkout writes. The REST API form
      # "Authorization: token" is rejected and git falls back to a prompt
      # (issue 5593). The header travels in GIT_CONFIG_* env vars scoped to
      # the one git command, so it stays out of argv and .git/config. This
      # step holds the token; the materialize step below does not.
      - name: Fetch candidate commit via git
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Fine-grained PAT for cross-fork PR head fetches (rate limits, private forks).
          # Falls back to implicit GITHUB_TOKEN when unset.
          GH_FETCH_TOKEN: ${{ secrets.VENDOR_PROVENANCE_PAT || github.token }}
          # Names the source without its value. Same truthiness test as the
          # fallback above: an unset secret evaluates to an empty string.
          TOKEN_SOURCE: ${{ secrets.VENDOR_PROVENANCE_PAT != '' && 'VENDOR_PROVENANCE_PAT' || 'github.token' }}
        run: |
          echo "fetch token source: $TOKEN_SOURCE"
          test -n "$GH_FETCH_TOKEN" || { echo "::error::GH_FETCH_TOKEN is empty: neither VENDOR_PROVENANCE_PAT nor github.token gave a value."; exit 1; }
          FETCH_BASIC="$(printf 'x-access-token:%s' "$GH_FETCH_TOKEN" | base64 -w0)"
          echo "::add-mask::$FETCH_BASIC"
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $FETCH_BASIC" git fetch --depth=1 origin "$PR_SHA" || { echo "::error::git fetch failed using $TOKEN_SOURCE. Likely causes: token expired or revoked, token lacks contents:read on this repository, wrong Authorization scheme, or a network fault."; exit 1; }

      # Extract candidate data from the fetched commit (no candidate code runs)
      - name: Materialize candidate tree
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          CANDIDATE_ROOT="$RUNNER_TEMP/candidate"
          uv run --frozen python - "$PR_SHA" "$CANDIDATE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          from scripts.ci.merge_tree_materialization import materialize_tree

          if not materialize_tree(Path.cwd(), sys.argv[1], Path(sys.argv[2])):
              raise SystemExit(1)
          PY

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      # Run trusted validator (from base branch) against candidate data
      - name: Validate vendor provenance (trusted gate)
        run: |
          CANDIDATE_ROOT="$RUNNER_TEMP/candidate"
          uv run --frozen python scripts/ci/validate_vendor_provenance.py \
            --candidate-root "$CANDIDATE_ROOT" \
            --vendor-rel .claude/hooks/PreToolUse/_vendor/markdownlint \
            --verifier-rel .claude/hooks/PreToolUse/_markdownlint_verifier.py \
            --mirror-rel src/copilot-cli/hooks/PreToolUse/_markdownlint_verifier.py \
            --config-rel .claude/hooks/PreToolUse/markdownlint-safe-config.yaml \
            --cli2-config-rel .claude/hooks/PreToolUse/markdownlint-cli2.yaml \
            --copilot-config-rel src/copilot-cli/hooks/PreToolUse/markdownlint-safe-config.yaml \
            --copilot-cli2-config-rel src/copilot-cli/hooks/PreToolUse/markdownlint-cli2.yaml
