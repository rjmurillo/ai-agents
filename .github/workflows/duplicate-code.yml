# Duplicate Code Detection
#
# Fails when a pull request adds Python copy/paste duplication beyond the
# shrink-only baseline (.jscpd-baseline.json). Config: .jscpd.json.
# Local run: uv run python scripts/validation/check_duplicate_code.py
# Docs: docs/duplicate-code-detection.md

name: Duplicate Code Detection

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  duplicate-code:
    name: Python duplication ratchet
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - name: Install locked duplication detector
        run: npm ci --ignore-scripts

      - name: Check Python duplication against the baseline
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: uv run --no-project python scripts/validation/check_duplicate_code.py --base-ref "origin/$BASE_REF"
