name: "Velocity Accelerator"

# Detect development acceleration opportunities from repository events
# ADR-006: Thin workflow, business logic in scripts/velocity_accelerator.py

on:
  pull_request:
    types: [closed]
  issues:
    types: [opened, labeled]
  push:
    paths:
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  # Dedupe across event types for the same subject (issue or PR), not per
  # event_name. Keying on github.event_name let an issues:opened run and a
  # later issues:labeled run for the same issue land in different groups and
  # execute concurrently (issue #2490). Type-prefix the subject so an issue and
  # a PR that happen to share a number do not collide; fall back to the SHA for
  # push and manual runs.
  group: velocity-accelerator-${{ github.event.issue.number && format('issue-{0}', github.event.issue.number) || github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.BOT_PAT }}

jobs:
  detect-opportunities:
    name: Detect Velocity Opportunities
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    # Skip bot-generated events
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'

    outputs:
      opportunities: ${{ steps.detect.outputs.opportunities }}
      count: ${{ steps.detect.outputs.count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Detect opportunities
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python scripts/ci/detect_velocity_opportunities.py

  post-summary:
    name: Post Velocity Summary
    needs: detect-opportunities
    if: needs.detect-opportunities.outputs.count > 0
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Generate and post summary comment
        if: github.event_name == 'pull_request' || github.event_name == 'issues'
        env:
          OPPORTUNITIES_JSON: ${{ needs.detect-opportunities.outputs.opportunities }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python scripts/ci/post_velocity_summary.py

      - name: Log summary to workflow
        env:
          OPPORTUNITIES_COUNT: ${{ needs.detect-opportunities.outputs.count }}
        run: |
          echo "::notice::Velocity Accelerator detected $OPPORTUNITIES_COUNT opportunities"
