name: Workflow Coalescing Metrics

on:
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday 9 AM UTC
  workflow_dispatch:
    inputs:
      since:
        description: 'Days to analyze'
        required: false
        default: 30
        type: number

permissions:
  actions: read    # To query workflow runs

jobs:
  collect-metrics:
    name: Collect Coalescing Metrics
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect metrics
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          SINCE_DAYS: ${{ inputs.since || '30' }}
        run: |
          python3 .github/scripts/measure_workflow_coalescing.py \
            --since "$SINCE_DAYS" \
            --output markdown \
            --output-path .agents/metrics/workflow-coalescing.md

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coalescing-metrics
          path: .agents/metrics/workflow-coalescing.md
          retention-days: 7
