# Citation Verification
#
# Runs citation schema verification on memory files modified in PRs.
# Uses the memory_enhancement CLI verify-all command to detect stale citations.
#
# Exit codes: 0 = pass, 1 = stale citations (fail), 2 = error
#
# This workflow reports on ALL PRs, verifying when memory or verifier code
# changed and reporting a skip otherwise. It is not in the required-context set
# pinned at scripts/ci/ruleset_required_contexts.py; the always-report shape is
# for a readable PR check list, not to satisfy a required check.
#
# Denominator warning: verify-all currently inspects 0 citations, because no
# memory has ever carried the [cite:type](target) syntax this gate reads. A pass
# here is not evidence that citations are valid. See
# .serena/memories/decision-a-gate-with-no-inputs-passes-forever.md

name: Citation Verification

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-paths:
    name: Detect changes
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    outputs:
      should-verify: ${{ steps.determine.outputs.should-verify }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check path filters
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            memories:
              - '.serena/memories/**'
            code:
              # python3 -m memory_enhancement resolves to the repository-root
              # package, so watching only the scripts/ copy misses edits to the
              # code this workflow actually executes.
              - 'memory_enhancement/**'
              - 'scripts/memory_enhancement/**'

      - name: Determine if verification should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: memories,code
          OUTPUT_NAME: should-verify
        run: python3 scripts/workflows/determine_should_run_from_filters.py

  verify-citations:
    name: Verify citations
    needs: check-paths
    if: needs.check-paths.outputs.should-verify == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Verify all citations
        run: |
          python3 -m memory_enhancement --repo-root . --memories-dir .serena/memories verify-all

  skip-verification:
    name: Skip verification (no changes)
    needs: check-paths
    if: needs.check-paths.outputs.should-verify != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 1
    steps:
      - name: Checkout code
        # Required for dorny/paths-filter pattern consistency
        # See: .serena/memories/ci-infrastructure-dorny-paths-filter-checkout.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip message
        run: |
          echo "No memory or code changes detected - skipping citation verification"
