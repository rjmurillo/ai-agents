# npm Publish
#
# Publishes @rjmurillo/ai-agents to npm with OIDC provenance on tag push.
# Trigger: push a tag matching v* (e.g., v0.1.0).
#
# Prerequisites:
#   1. Link @rjmurillo/ai-agents scope to this GitHub repo in npm UI (one-time).
#   2. npm 2FA enabled on the publishing account.
#   3. See RELEASING.md for full auth setup and rollback procedures.

name: npm Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run npm publish --dry-run only'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package metadata
        run: python3 scripts/ci/verify_npm_package_metadata.py --package-dir packages/ai-agents-cli

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/ai-agents-cli
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_VERSION="${TAG_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version match: $TAG_VERSION"

      - name: Measure pack size
        run: python3 scripts/ci/measure_npm_pack_size.py --package-dir packages/ai-agents-cli

  publish:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: packages/ai-agents-cli
        run: npm ci

      - name: Build
        working-directory: packages/ai-agents-cli
        run: npm run build --if-present

      - name: Publish (dry-run)
        # yamllint disable-line rule:line-length
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry-run == 'true'
        working-directory: packages/ai-agents-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        # yamllint disable-line rule:line-length
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry-run == 'false')
        working-directory: packages/ai-agents-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: Verify published package
        # yamllint disable-line rule:line-length
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' &&
          github.event.inputs.dry-run == 'false')
        run: python3 scripts/ci/verify_npm_published.py --package-dir packages/ai-agents-cli
