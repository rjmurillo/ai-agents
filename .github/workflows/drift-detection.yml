# Weekly Agent Drift Detection
#
# Detects drift between Claude agents and shared templates.
# Runs weekly on Monday at 9 AM UTC and can be triggered manually.
# Creates a GitHub issue when drift is detected.
#
# Local developers and AI agents can run the same detection using:
#   python3 build/scripts/detect_agent_drift.py

name: Agent Drift Detection

on:
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual triggering

jobs:
  detect-drift:
    name: Detect Agent Drift
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Run drift detection
        id: drift
        run: python3 scripts/ci/drift_run_detection.py

      # K2 (REQ-008-09): record a generator-regression kill-criteria event
      # when template drift is detected. The emitter owns the JSONL schema;
      # this step is a single logic-free CLI call (ADR-006).
      - name: Emit K2 kill-criteria event
        id: emit-k2
        if: steps.drift.outputs.drift_detected == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/metrics/kill_criteria.py \
            --kind K2 \
            --detail "agent drift detected run=$RUN_ID"
        continue-on-error: true

      # Weekly drift telemetry rollup (REQ-008-09). The summarizer reads the
      # JSONL written this run and tallies trailing-30-day kill-criteria counts.
      # A single logic-free CLI call (ADR-006); the report exits 1 when a
      # criterion has fired, so continue-on-error keeps the job green while the
      # alert still lands in the step summary. The events file is per-run only
      # (git-ignored), so this rollup reflects this run, not full history; a
      # cross-run weekly total would need artifact aggregation (out of scope).
      # Runs unconditionally (always()): a zero-drift week still emits an
      # all-zero rollup, which confirms the report ran and records the all-clear
      # in the job summary instead of leaving it blank.
      - name: Summarize kill-criteria drift telemetry
        if: always()
        run: |
          python3 scripts/metrics/kill_criteria.py report >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      # The events file is git-ignored, so upload it as an artifact to make
      # the K2 count survive the ephemeral runner.
      - name: Upload kill-criteria events
        if: steps.drift.outputs.drift_detected == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-events-${{ github.run_id }}
          path: .agents/metrics/drift-events.jsonl
          if-no-files-found: ignore
        continue-on-error: true

      - name: Collect drift details
        id: details
        if: steps.drift.outputs.drift_detected == 'true'
        run: python3 scripts/ci/drift_collect_details.py

      - name: Check for existing drift issue
        id: check-issue
        if: steps.drift.outputs.drift_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check for open drift issues
          EXISTING="$(gh issue list --label "drift-detected" --state open --json number --jq 'length')"
          echo "existing_issues=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Create drift alert issue
        if: steps.drift.outputs.drift_detected == 'true' && steps.check-issue.outputs.existing_issues == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/drift_create_alert_issue.py

      - name: Update existing drift issue
        if: steps.drift.outputs.drift_detected == 'true' && steps.check-issue.outputs.existing_issues != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the existing issue number
          ISSUE_NUMBER="$(gh issue list --label "drift-detected" --state open --json number --jq '.[0].number')"

          # Add a comment to the existing issue
          cat << EOF > "${RUNNER_TEMP:-.}/comment-body.md"
          ## Updated Drift Detection - $(date -u +"%Y-%m-%d %H:%M UTC")

          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### Current Status

          $(cat "${RUNNER_TEMP:-.}/drift-details.md")

          ---
          *This comment was automatically added by the weekly drift detection workflow.*
          EOF

          gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP:-.}/comment-body.md"

      - name: Fail when drift was detected
        if: steps.drift.outputs.drift_detected == 'true'
        run: |
          echo "::error::agent drift detected"
          exit 1

      - name: Summary
        if: always()
        env:
          DRIFT_DETECTED: ${{ steps.drift.outputs.drift_detected }}
        run: python3 scripts/ci/drift_write_summary.py
