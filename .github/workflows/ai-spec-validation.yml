name: Spec-to-Implementation Validation

# AI-powered requirements traceability using GitHub Copilot CLI

# Verifies that PR changes implement requirements from linked specs

# Warns if requirements are not covered by the implementation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    # No path filter - workflow runs on ALL PRs to satisfy required check
    # Path filtering done at job level using dorny/paths-filter

  merge_group:
    branches: [main]

  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate'
        required: true
        type: number
      enable_debouncing:
        description: 'Enable debouncing delay to reduce race conditions (adds 10s latency)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

# Concurrency control: Attempts to cancel in-progress runs when new runs start

# NOTE: GitHub Actions does NOT guarantee run coalescing - race conditions can occur

# where multiple runs start before cancellation takes effect. This is best-effort

# See ADR-026 (../.agents/architecture/ADR-026-pr-automation-concurrency-and-safety.md)

# for architectural decision on workflow-level concurrency control

# Mitigation: Path filtering, timeouts, and PR-specific temp files reduce impact

concurrency:
  group: spec-validation-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.BOT_PAT }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  # Optional debouncing job - runs only when enable_debouncing=true
  debounce:
    name: Debounce Workflow
    if: (github.event_name == 'workflow_dispatch' && inputs.enable_debouncing == true) || (github.event_name == 'pull_request' && vars.ENABLE_DEBOUNCE == 'true')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      
      - name: Apply debouncing delay
        uses: ./.github/actions/workflow-debounce
        with:
          delay-seconds: '10'
          workflow-name: 'Spec-to-Implementation Validation'
          concurrency-group: ${{ github.event.pull_request.number || inputs.pr_number }}

  check-paths:
    name: Check Changed Paths
    runs-on: ubuntu-24.04-arm
    needs: debounce
    if: github.event_name != 'merge_group' && always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    outputs:
      has-code-changes: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@61f87a10cd2c304679af17bb73ef192addf33c1c
        with:
          filters: |
            code:
              - 'src/**'
              - 'templates/**'
              - 'scripts/**'
              - 'build/**'
              - '.claude/skills/**'

  validate-spec:
    name: Validate Spec Coverage
    needs: check-paths
    # always() required: transitive dependency on debounce (which may be SKIPPED)
    # would otherwise cause this job to be skipped even when check-paths succeeds
    if: github.event_name != 'merge_group' && always() && needs.check-paths.result == 'success'
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    # Budget: ceil(sum(3 * step timeout + 1.5) + 5) for 3, 3.
    timeout-minutes: 26

    steps:
      - name: Check if validation needed
        id: should-run
        env:
          HAS_CODE_CHANGES: ${{ needs.check-paths.outputs.has-code-changes }}
        run: |
          if [ "$HAS_CODE_CHANGES" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped - no code changes detected"
          fi

      - name: Checkout repository
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      - name: Extract Spec References
        if: steps.should-run.outputs.skip != 'true'
        id: spec-ref
        env:
          PR_TITLE_INPUT: ${{ github.event.pull_request.title }}
          PR_BODY_INPUT: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/spec_extract_refs.py

      - name: Load Spec Content
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        id: load-spec
        env:
          SPEC_REFS: ${{ steps.spec-ref.outputs.spec_refs }}
          ISSUE_REFS: ${{ steps.spec-ref.outputs.issue_refs }}
        run: python3 scripts/ci/spec_load_content.py

      - name: Prepare Spec Context
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        id: prepare-context
        env:
          SPEC_FILE: ${{ steps.load-spec.outputs.spec_file }}
          INCREMENTAL_SCOPE: ${{ steps.spec-ref.outputs.incremental_scope }}
          # Issue #5366: the body carries the acceptance-criteria list the
          # reviewer is graded against. Passed through env, never interpolated
          # into a run block, because it is author-controlled (CWE-78).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/spec_prepare_context.py

      - name: 🔗 Requirements Traceability Check (Analyst Agent)
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        id: trace
        continue-on-error: true
        uses: ./.github/actions/ai-review
        with:
          agent: analyst
          context-type: pr-diff
          pr-number: ${{ env.PR_NUMBER }}
          additional-context: ${{ steps.prepare-context.outputs.spec_context }}
          prompt-file: .github/prompts/spec-trace-requirements.md
          timeout-minutes: 3
          bot-pat: ${{ secrets.BOT_PAT }}
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: ✅ Completeness Check (Critic Agent)
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        id: completeness
        continue-on-error: true
        uses: ./.github/actions/ai-review
        with:
          agent: critic
          context-type: pr-diff
          pr-number: ${{ env.PR_NUMBER }}
          additional-context: ${{ steps.prepare-context.outputs.spec_context }}
          prompt-file: .github/prompts/spec-check-completeness.md
          timeout-minutes: 3
          bot-pat: ${{ secrets.BOT_PAT }}
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      # Issue #2108 / #1855: enforce the closed-loop rule (no PASS on LLM
      # verdicts alone) by adding the deterministic acceptance-criteria
      # extractor as an external signal alongside the analyst (trace) and
      # critic (completeness) verdicts, fed to
      # scripts/external_signals/gate_aggregator.py. This is observable
      # (continue-on-error) and reported in the job summary; it does not yet
      # replace the authoritative gate in check_spec_failures.py. Swapping the
      # final gate is deferred to a canary (see PR #2361 and the PR
      # description).
      - name: External-signal gate (observe)
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        id: external-gate
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          TRACE_VERDICT: ${{ steps.trace.outputs.verdict }}
          COMPLETENESS_VERDICT: ${{ steps.completeness.outputs.verdict }}
        run: python3 scripts/ci/spec_external_signal_wrapper.py

      - name: Generate Validation Report
        if: steps.should-run.outputs.skip != 'true'
        id: report
        env:
          HAS_SPECS: ${{ steps.spec-ref.outputs.has_specs }}
          SPEC_REFS: ${{ steps.spec-ref.outputs.spec_refs }}
          ISSUE_REFS: ${{ steps.spec-ref.outputs.issue_refs }}
          TRACE_VERDICT: ${{ steps.trace.outputs.verdict }}
          TRACE_FINDINGS: ${{ steps.trace.outputs.findings }}
          COMPLETENESS_VERDICT: ${{ steps.completeness.outputs.verdict }}
          COMPLETENESS_FINDINGS: ${{ steps.completeness.outputs.findings }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/generate_spec_report.py

      - name: Post PR Comment
        if: steps.should-run.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ env.PR_NUMBER }}
          REPORT_FILE: ${{ steps.report.outputs.report_file }}
        run: |
          python3 .github/scripts/run_with_retry.py -- \
            python3 .github/scripts/post_issue_comment.py \
            --issue "$PR_NUMBER" \
            --body-file "$REPORT_FILE" \
            --marker "AI-SPEC-VALIDATION" \
            --update-if-exists

      - name: Set Job Summary
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh -NoProfile -Command "& '{0}'"
        env:
          REPORT_FILE: ${{ steps.report.outputs.report_file }}
        run: |
          Get-Content $env:REPORT_FILE | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Check for Failures
        if: steps.should-run.outputs.skip != 'true' && steps.spec-ref.outputs.has_specs == 'true'
        env:
          TRACE_VERDICT: ${{ steps.trace.outputs.verdict }}
          COMPLETENESS_VERDICT: ${{ steps.completeness.outputs.verdict }}
          TRACE_INFRA_FAILURE: ${{ steps.trace.outputs['infrastructure-failure'] }}
          COMPLETENESS_INFRA_FAILURE: ${{ steps.completeness.outputs['infrastructure-failure'] }}
          TRACE_FINDINGS: ${{ steps.trace.outputs.findings }}
          COMPLETENESS_FINDINGS: ${{ steps.completeness.outputs.findings }}
        run: python3 .github/scripts/check_spec_failures.py
