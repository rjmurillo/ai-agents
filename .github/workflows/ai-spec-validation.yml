name: Spec-to-Implementation Validation

# Deterministic spec coverage check (issue #6182). The verdict comes from the
# linked-spec flag and the acceptance-criteria checkboxes in the PR body. No
# model call, no secret, no environment. The model review runs separately in
# ai-spec-review.yml.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    # No path filter. The validate-spec job decides its own scope in its
    # "Decide scope" step (scripts/ci/spec_coverage_scope.py).

  # merge_group is not a trigger: validate-spec reads a pull request body, and a
  # queue run has none. The `if:` below keeps its merge_group term as a guard.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to validate'
        required: true
        type: number
      enable_debouncing:
        description: 'Enable debouncing delay to reduce race conditions (adds 10s latency)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

# Concurrency control (ADR-026, ../.project-toolkit/architecture/ADR-026-pr-automation-concurrency-and-safety.md):
# a new run for the same PR cancels the one in progress. This is best effort.
# GitHub Actions does not guarantee run coalescing, so two runs can start before
# the cancellation lands. The scope decision inside the job, the timeout, and
# PR-specific temp files limit the impact.
concurrency:
  group: spec-validation-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

env:
  # Workflow-level env must not carry a secret (semgrep gha-workflow-env-secret).
  # The runner token reads the PR and its linked issues on this public repository.
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  # Optional debouncing job - runs only when enable_debouncing=true
  debounce:
    name: Debounce Workflow
    if: (github.event_name == 'workflow_dispatch' && inputs.enable_debouncing == true) || (github.event_name == 'pull_request' && vars.ENABLE_DEBOUNCE == 'true')
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      
      - name: Apply debouncing delay
        uses: ./.github/actions/workflow-debounce
        with:
          delay-seconds: '10'
          workflow-name: 'Spec-to-Implementation Validation'
          concurrency-group: ${{ github.event.pull_request.number || inputs.pr_number }}

  validate-spec:
    name: Validate Spec Coverage
    needs: debounce
    # always() required: debounce may be SKIPPED, which would otherwise skip
    # this job too. The `needs.debounce.result` term is ordering only, not a
    # scope decision. ADR-101 requirement 1: whether spec validation applies is
    # decided by this job's own "Decide scope" step below, not by a sibling
    # job's output. `github.event_name != 'merge_group'` stays: a queue run has
    # no pull request body to read.
    if: github.event_name != 'merge_group' && always() && (needs.debounce.result == 'success' || needs.debounce.result == 'skipped')
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          fetch-depth: 0

      # The scripts that grade the spec run from the trusted base, never from
      # the pull request tree, so a same-repo PR cannot edit them
      # (issue #6506, review-gates-14). The workflow file itself still comes from
      # the merge commit on pull_request, so this blocks script edits, not
      # workflow edits. The merge checkout above stays the working directory,
      # so git diff and the spec files are still the PR's.
      - name: Checkout trusted base scripts
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: trusted-base
          sparse-checkout: |
            scripts/ci
            scripts/external_signals
            .github/scripts
          persist-credentials: false

      # Both SHAs come from the event payload, never a branch name: on
      # pull_request the checkout is the synthetic refs/pull/N/merge commit, so
      # an implicit HEAD would credit this pull request with base-branch files.
      - name: Decide scope
        id: should-run
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 trusted-base/scripts/ci/spec_coverage_scope.py

      - name: Extract Spec References
        if: steps.should-run.outputs.skip != 'true'
        id: spec-ref
        env:
          PR_TITLE_INPUT: ${{ github.event.pull_request.title }}
          PR_BODY_INPUT: ${{ github.event.pull_request.body }}
        run: python3 trusted-base/scripts/ci/spec_extract_refs.py

      # The PR body is author-controlled. It reaches the script through env,
      # never interpolated into a run block (CWE-78).
      - name: Decide spec coverage verdict
        if: steps.should-run.outputs.skip != 'true'
        env:
          HAS_SPECS: ${{ steps.spec-ref.outputs.has_specs }}
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 trusted-base/scripts/ci/spec_coverage_verdict.py
