# Memory Health Reporting
#
# Runs batch health checks on Serena memories for PRs.
# Detects stale citations, generates a health report, and posts a PR comment.
# Supports exemption mechanism (memories with exempt: true in frontmatter).
#
# Exit codes: 0 = all healthy/exempt, 1 = stale citations (warning), 2 = error
#
# IMPORTANT: This workflow runs on ALL PRs to satisfy required status checks,
# but skips actual health checks when no relevant files are changed.
#
# Related: citation-verify.yml (per-citation verification), memory-validation.yml (legacy)

name: Memory Health

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-paths:
    name: Detect changes
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      should-run-memory-health: ${{ steps.determine.outputs.should-run-memory-health }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check path filters
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            memories:
              - '.serena/memories/**'
            code:
              - 'scripts/memory_enhancement/**'
              - 'scripts/**/*.py'
              - 'pyproject.toml'

      - name: Determine if memory health should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: memories,code
          OUTPUT_NAME: should-run-memory-health
        run: python3 scripts/workflows/determine_should_run_from_filters.py

  health-check:
    name: Memory health check
    needs: check-paths
    if: needs.check-paths.outputs.should-run-memory-health == 'true'
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Run health check (JSON)
        continue-on-error: true
        run: |
          uv run --frozen python3 -m memory_enhancement --repo-root . health --json > health-report.json

      - name: Run health check (Markdown)
        continue-on-error: true
        run: |
          uv run --frozen python3 -m memory_enhancement --repo-root . health --markdown > health-report.md

      - name: Upload health reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-health-reports
          path: |
            health-report.json
            health-report.md
          retention-days: 7

      - name: Parse health results
        id: parse
        run: |
          uv run --frozen python3 scripts/ci/parse_memory_health_results.py \
            --results health-report.json

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEALTH_HAS_ISSUES: ${{ steps.parse.outputs.has_issues }}
          HEALTH_SCORE: ${{ steps.parse.outputs.health_score }}
          HEALTH_TOTAL: ${{ steps.parse.outputs.total_memories }}
          HEALTH_STALE_MEMORIES: ${{ steps.parse.outputs.stale_memories }}
          HEALTH_TOTAL_CITATIONS: ${{ steps.parse.outputs.total_citations }}
          HEALTH_VALID_CITATIONS: ${{ steps.parse.outputs.valid_citations }}
          HEALTH_STALE_CITATIONS: ${{ steps.parse.outputs.stale_citations }}
          HEALTH_BROKEN_CITATIONS: ${{ steps.parse.outputs.broken_citations }}
          HEALTH_UNVERIFIED_CITATIONS: ${{ steps.parse.outputs.unverified_citations }}
        with:
          script: |
            const fs = require('fs');
            let report = 'Health check completed but no report generated.';
            try {
              report = fs.readFileSync('health-report.md', 'utf8');
            } catch (e) {
              console.log('No markdown report file found');
            }

            const hasIssues = process.env.HEALTH_HAS_ISSUES === 'true';
            const status = hasIssues ? 'Warning' : 'Pass';

            const message = [
              '<!-- MEMORY-HEALTH -->',
              `## ${status}: Memory Health`,
              '',
              report,
              '',
              '---',
              '<details>',
              '<summary>Health Check Details</summary>',
              '',
              `- **Health score**: ${process.env.HEALTH_SCORE}`,
              `- **Total memories**: ${process.env.HEALTH_TOTAL}`,
              `- **Stale memories**: ${process.env.HEALTH_STALE_MEMORIES}`,
              `- **Total citations**: ${process.env.HEALTH_TOTAL_CITATIONS}`,
              `- **Valid citations**: ${process.env.HEALTH_VALID_CITATIONS}`,
              `- **Stale citations**: ${process.env.HEALTH_STALE_CITATIONS}`,
              `- **Broken citations**: ${process.env.HEALTH_BROKEN_CITATIONS}`,
              `- **Unverified citations**: ${process.env.HEALTH_UNVERIFIED_CITATIONS}`,
              '',
              '</details>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- MEMORY-HEALTH -->')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }

      - name: Set job status
        if: steps.parse.outputs.has_issues == 'true'
        env:
          STALE_MEMORIES: ${{ steps.parse.outputs.stale_memories }}
          BROKEN_CITATIONS: ${{ steps.parse.outputs.broken_citations }}
          STALE_CITATIONS: ${{ steps.parse.outputs.stale_citations }}
        run: |
          echo "::warning::Memory health issues: \
          $STALE_MEMORIES stale memories, \
          $BROKEN_CITATIONS broken citations, \
          $STALE_CITATIONS stale citations"

  skip-health-check:
    name: Skip health check (no changes)
    needs: check-paths
    if: needs.check-paths.outputs.should-run-memory-health != 'true'
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 1
    steps:
      - name: Checkout code
        # Required for dorny/paths-filter pattern consistency
        # See: .serena/memories/ci-infrastructure-dorny-paths-filter-checkout.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Skip message
        run: |
          echo "No memory or code changes detected - skipping health check"
