# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Semantic PR Title Check"

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: "semantic-pr-check-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Confirm pull request title gate passed before queue entry
        if: github.event_name == 'merge_group'
        run: echo "The PR title gate already passed before this merge group was created."

      - name: Skip for bot actors
        if: github.event_name != 'merge_group' && (github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.actor == 'renovate[bot]')
        env:
          GH_ACTOR: ${{ github.actor }}
        run: echo "Skipped - bot actor ($GH_ACTOR)"

      - name: Check out classifier
        id: checkout
        if: github.event_name != 'merge_group' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && github.actor != 'renovate[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: semantic
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        if: github.event_name != 'merge_group' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && github.actor != 'renovate[bot]'
        continue-on-error: true
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Classify outcome (ignore Unicorn HTML flake, block real failures)
        if: github.event_name != 'merge_group' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && github.actor != 'renovate[bot]'
        env:
          OUTCOME: ${{ steps.semantic.outcome }}
          ERROR_MESSAGE: ${{ steps.semantic.outputs.error_message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 scripts/ci/classify_semantic_title_result.py \
            --outcome "$OUTCOME" \
            --error-message "$ERROR_MESSAGE" \
            --pr-title "$PR_TITLE"

      # ADR-113 decision 2: persist this job's typed result for the promotion
      # gate. A merge group run only echoes that the pull request gate passed,
      # so it records SKIP, not PASS: the title was not validated at this commit.
      - name: Check out the evidence emitter
        if: always() && steps.checkout.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/validation
            .github/actions/upload-validator-evidence

      - name: Upload promotion evidence
        if: always()
        uses: ./.github/actions/upload-validator-evidence
        with:
          validator: validate_pr_title
          job-status: ${{ job.status }}
          ran: ${{ github.event_name != 'merge_group' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && github.actor != 'renovate[bot]' }}
