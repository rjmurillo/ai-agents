# yaml-language-server: $schema=<https://json.schemastore.org/github-workflow.json>

name: Auto-Assign Reviewer

# Automatically adds rjmurillo-bot as a reviewer on all PRs

# This enables the bot to receive review requests and respond to PR comments

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

# Concurrency control: Attempts to cancel in-progress runs when new runs start

# NOTE: GitHub Actions does NOT guarantee run coalescing - race conditions can occur

# where multiple runs start before cancellation takes effect. This is best-effort

# See ADR-026 (../.agents/architecture/ADR-026-pr-automation-concurrency-and-safety.md)

# for architectural decision on workflow-level concurrency control

# Mitigation: Path filtering, timeouts, and PR-specific temp files reduce impact

concurrency:
  group: auto-reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  assign-reviewer:
    name: Add Bot Reviewer
    runs-on: ubuntu-24.04-arm
    # Worst case: checkout, plus three 30s gh calls, plus the 15s and 30s
    # backoff rungs, is 135s of script before checkout. The old 2 minute cap
    # would kill the retry this job now depends on. Issue #4335.
    timeout-minutes: 6

    # Skip if the PR author is the bot itself (avoid self-review)
    if: github.event.pull_request.user.login != 'rjmurillo-bot'

    steps:
      # pull_request_target checks out the base ref, never fork code.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Issue #4607 / ADR-026 Decision 5: report which account BOT_PAT
      # resolves to before the first API call so a mis-issued secret is
      # visible in the run log. Non-blocking until the secret is rotated.
      - name: Report BOT_PAT identity
        env:
          IDENTITY_TOKEN: ${{ secrets.BOT_PAT }}
          EXPECTED_BOT_ID: '250269933'
          EXPECTED_BOT_LOGIN: 'rjmurillo-bot'
        run: python3 scripts/ci/check_bot_identity.py

      # Losing a race against a rate limit is not a reason to red a build, and
      # this job is not one of the required checks on main. That tolerance is
      # scoped to exit 3 by --tolerate-external rather than granted to the whole
      # step: `continue-on-error: true` would also swallow exit 4, so an expired
      # or revoked BOT_PAT would read as a green job forever with a missing bot
      # review as the only symptom. Issue #4335.
      - name: Add rjmurillo-bot as reviewer
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT }}
          TARGET_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/assign_bot_reviewer.py \
            --repo "$TARGET_REPO" \
            --pull-request "$PR_NUMBER" \
            --reviewer rjmurillo-bot \
            --tolerate-external
