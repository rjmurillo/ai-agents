---
name: Memory Validation

on:
  pull_request:
    # NOTE: No paths filter here - use dorny/paths-filter internally
    # This ensures skip-validation job runs to satisfy required checks
    # See: .serena/memories/ci-infrastructure-dorny-paths-filter-checkout.md
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check-paths:
    name: Detect changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    outputs:
      should-run-validation: ${{ steps.determine.outputs.should-run-validation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check path filters
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        with:
          filters: |
            memories:
              - '.serena/memories/**'
            code:
              - 'scripts/memory_enhancement/**'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Determine if validation should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: memories,code
          FORCE_RUN_EVENTS: merge_group
          OUTPUT_NAME: should-run-validation
        run: python3 scripts/workflows/determine_should_run_from_filters.py

  validate-memories:
    name: Validate memory citations
    needs: check-paths
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Check if validation needed
        id: should-run
        env:
          SHOULD_VALIDATE: ${{ needs.check-paths.outputs.should-run-validation }}
        run: |
          if [ "$SHOULD_VALIDATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipped - no memory or code changes detected"
          fi

      - name: Checkout code
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup code environment
        if: steps.should-run.outputs.skip != 'true'
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Validate memory tier hierarchy (ADR-017)
        if: steps.should-run.outputs.skip != 'true'
        id: tier-validation
        run: uv run --frozen python scripts/validate_memory_tier.py

      - name: Validate memory index consistency (ADR-017)
        if: steps.should-run.outputs.skip != 'true'
        id: index-validation
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
        run: uv run --frozen python scripts/validation/memory_index.py --path .serena/memories --base-ref "$BASE_REF" --ci --format console --orphan-policy ratchet

      - name: Enforce memory index count ratchet
        if: steps.should-run.outputs.skip != 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: uv run --frozen python3 scripts/ci/memory_index_count_ratchet.py --base-ref "origin/$BASE_BRANCH"

      - name: Verify all memories
        if: steps.should-run.outputs.skip != 'true'
        id: verify
        run: |
          # Issue #2808: GitHub runs steps with `bash -eo pipefail`, so a
          # verify-all crash aborted the step before `$?` was captured, and the
          # parse step below then defaulted to a green Pass. Capture the code
          # explicitly so the parse step can distinguish crash from clean.
          set +e
          python -m memory_enhancement verify-all --json > memory-validation-results.json
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::verify-all exited $rc; results may be incomplete"
          fi
          # rc=1 means invalid-citation findings, which are non-blocking (see the
          # health-report gate below). Do NOT exit on rc: doing so blocks the report
          # and PR comment. An empty file signals a real crash, so keep the guard.
          test -s memory-validation-results.json

      - name: Generate health report
        if: steps.should-run.outputs.skip != 'true'
        run: |
          # Best-effort human-readable report. verify-all returns rc=1 for
          # non-blocking invalid-citation findings (see the verify step above);
          # that must not block the downstream parse/comment steps. A real crash
          # is already caught by the verify step's empty-JSON guard, so tolerate a
          # non-zero rc here rather than red-failing the whole job.
          python -m memory_enhancement verify-all > memory-health-report.md || true

      - name: Upload validation results
        if: always() && steps.should-run.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-validation-results
          path: |
            memory-validation-results.json
            memory-health-report.md
          retention-days: 7

      - name: Parse validation results
        if: steps.should-run.outputs.skip != 'true'
        id: parse
        run: |
          # Issue #2808: a missing or empty results file means verify-all
          # crashed. The counting and that error branch live in a tested
          # script (ADR-006: no logic in YAML) so a broken run cannot post the
          # green Pass banner.
          python3 scripts/ci/parse_memory_validation_results.py \
            --input memory-validation-results.json

      - name: Post PR comment
        if: steps.should-run.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('memory-health-report.md', 'utf8');
            const hasStale = '${{ steps.parse.outputs.has_stale }}' === 'true';

            const status = hasStale ? '⚠️  Warning' : '✅ Pass';
            const message = `<!-- MEMORY-VALIDATION -->
            ## ${status}: Memory Validation

            ${report}

            ---
            <details>
            <summary>📊 Validation Details</summary>

            - **Total memories checked**: ${{ steps.parse.outputs.total }}
            - **Valid**: ${{ steps.parse.outputs.valid }}
            - **Stale**: ${{ steps.parse.outputs.stale }}

            </details>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('<!-- MEMORY-VALIDATION -->')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }

      - name: Set job status
        if: steps.should-run.outputs.skip != 'true' && steps.parse.outputs.has_stale == 'true'
        run: |
          echo "::warning::Found ${{ steps.parse.outputs.stale }} memories with stale citations"
          # Currently non-blocking - change to 'exit 1' to make blocking
