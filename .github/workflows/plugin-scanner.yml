# Plugin Scanner
#
# Runs the HOL AI plugin scanner over the whole repository and fails below a
# normalized score of 80. The hashgraph-online/awesome-ai-plugins listing gate
# is 75 (SCANNER_GUIDE.md, lowered from 80 on 2026-10-27). This gate stays at
# 80 on purpose: a red run here gives 5 points of warning before a listing
# would be blocked.
#
# The action pin may run ahead of that catalog's validate-contribution.yml.
# Last checked 2026-11-09: the catalog pins c96833de (v1.2.806, scanner 3.57.0)
# and this workflow pins v1.2.815 (scanner 3.58.0), by owner decision on #6982.
# While the pins differ, the score here comes from a newer scanner than the
# catalog's and can differ from it. fail_on_severity is none, as in the catalog:
# severities are advisory, the score is the gate. The action verifies the
# scanner wheel's SHA-256 and PyPI provenance before installing it.
# Repository-owned scanner config is not trusted (trust_repository_policy
# defaults to false).
#
# Bump the action SHA, build/plugin-scanner (to scanner-version.txt at that
# commit), and the pins in tests/validation/test_check_plugin_scanner_score.py
# together. That test fails when the workflow or lock disagrees with its
# literals. It cannot read upstream, so checking scanner-version.txt and
# scanner-sha256.txt at the new commit is a manual step.
#
# Margin: the local twin scored 82 under scanner 3.58.0 on 2026-11-09. Refresh
# this line on each bump. The twin prints the current score and every check
# that lost points, on a pass too.
#
# No path filter: the score reads the whole tree, so any file can move it
# (.claude/rules/ci-scripts.md, "Path filters gate the diff, never the tree").
#
# Local twin: uv run --frozen python scripts/validation/check_plugin_scanner_score.py
# (also the `plugin-scanner` pre-push job in lefthook.yml).

name: Plugin Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: Plugin Scanner (score >= 80)
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: none
          pr_comment: "off"
