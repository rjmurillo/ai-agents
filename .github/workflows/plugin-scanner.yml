# Plugin Scanner
#
# Runs the HOL AI plugin scanner over the whole repository and fails below a
# normalized score of 80. The hashgraph-online/awesome-ai-plugins listing gate
# is 75 (SCANNER_GUIDE.md, lowered from 80 on 2026-10-27). This gate stays at
# 80 on purpose: a red run here gives 5 points of warning before a listing
# would be blocked.
#
# The action pin matches that catalog's validate-contribution.yml (same commit,
# fail_on_severity none: severities are advisory, the score is the gate). The
# action verifies the scanner wheel's SHA-256 and PyPI provenance before
# installing it. Repository-owned scanner config is not trusted
# (trust_repository_policy defaults to false), so the score here is the score
# the catalog computes.
#
# Bump the action SHA, build/plugin-scanner (scanner-version.txt at that
# commit), and the pins in tests/validation/test_check_plugin_scanner_score.py
# together. That test fails on a one-sided bump.
#
# Margin: this repository scored 82 under scanner 3.57.0 on 2026-10-31. The
# local twin prints every check that lost points, on a pass too.
#
# No path filter: the score reads the whole tree, so any file can move it
# (.claude/rules/ci-scripts.md, "Path filters gate the diff, never the tree").
#
# Local twin: uv run --frozen python scripts/validation/check_plugin_scanner_score.py
# (also the `plugin-scanner` pre-push job in lefthook.yml).

name: Plugin Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  scan:
    name: Plugin Scanner (score >= 80)
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run HOL AI Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@c96833de5070fab4e564010b5ab6e3c3d7e07a3e # v1.2.806
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: none
          pr_comment: "off"
