# Nightly Real-CLI Smoke (issue #2231 items 3-4, ADR-071; issue #2736)
#
# Installs the real Copilot and Claude CLIs and runs two real-CLI smokes end to
# end on ubuntu/macos/windows:
#   - Hook smoke (test_cli_hook_e2e.py): a plugin hook resolves and runs from the
#     install tree. The authenticated cross-platform smoke ADR-071 deferred; the
#     no-auth gates (validate_hook_anchoring, test_generate_hooks_runtime_contract)
#     verify path resolution in PR CI, this verifies the real launcher contract
#     bare CI cannot, on the platforms (Windows PowerShell) where #2205 was filed.
#   - Plugin-load smoke (test_plugin_load_smoke.py, issue #2736): the shipped
#     plugin dir loads in each CLI and the lifecycle skills load with no
#     argument-hint loader warning. PR #2735 was green on schema and unit checks
#     yet still needed manual proof the plugin loaded; this automates that proof.
#
# Security (.claude/rules/security.md, issue #2231 item 3):
#   - Triggers only on schedule and workflow_dispatch. GitHub never fires these
#     from a fork, so a fork PR can never reach the secret-bearing job.
#   - A trusted-context gate (scripts/validation/assert_trusted_smoke_context.py,
#     ADR-006: decision in Python, not YAML) re-checks event, repository, and ref
#     fails closed, so a fork running this workflow on its own schedule is denied.
#   - Least-privilege: top-level permissions are contents: read.
#   - Every action is pinned to a commit SHA (no floating tags).
#   - Auth tokens come from the secrets manager (secrets.*), scoped to the smoke
#     job's env only, never written to the repo.
#
# Loud, not silent (.claude/rules/generated-artifacts.md, issue #2231 item 4):
#   The smoke tests skip without RUN_CLI_E2E=1 and the CLIs, and a skip reads as
#   a pass in a green summary. scripts/validation/assert_smoke_ran.py parses the
#   JUnit report and fails the job if the smoke was skipped or not collected, so
#   a missing auth secret surfaces as a red run, not a silent green one.
#
# Local equivalent:
#   RUN_CLI_E2E=1 uv run pytest tests/e2e/test_cli_hook_e2e.py -m smoke -v
#   RUN_CLI_E2E=1 uv run pytest tests/e2e/test_plugin_load_smoke.py -m smoke -v

name: Nightly CLI Smoke

on:
  schedule:
    # 06:00 UTC daily. Off the top of the hour to avoid the cron thundering herd.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  authorize:
    name: Trusted-context gate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check trusted context
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          trusted=$(python3 scripts/validation/assert_trusted_smoke_context.py \
            --event-name "$EVENT_NAME" \
            --repository "$REPOSITORY" \
            --ref "$REF")
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke (${{ matrix.os }})
    needs: authorize
    if: needs.authorize.outputs.trusted == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUN_CLI_E2E: '1'
      # renovate: datasource=npm depName=@anthropic-ai/claude-code
      CLAUDE_CODE_VERSION: '2.1.218'
      # renovate: datasource=npm depName=@github/copilot
      COPILOT_CLI_VERSION: '1.0.74'
    steps:
      - name: Harden Runner
        # Windows and macOS runners do not support harden-runner; gate it.
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 'lts/*'

      # Keep credentials out of npm lifecycle scripts (CWE-829).
      - name: Install pinned Claude and Copilot CLIs
        shell: bash
        run: >-
          npm install -g
          "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          "@github/copilot@${COPILOT_CLI_VERSION}"

      - name: Run real-CLI hook smoke
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: uv run pytest tests/e2e/test_cli_hook_e2e.py -m smoke --junitxml=smoke-report.xml

      - name: Assert the hook smoke actually ran
        # always(): the gate must run even if the smoke step failed, so a skip
        # (which pytest exits 0 for) is still caught and reported as a red job.
        if: always()
        shell: bash
        run: uv run python scripts/validation/assert_smoke_ran.py smoke-report.xml

      - name: Run real-CLI plugin-load smoke
        # always(): run even if the hook smoke step failed so both smokes report.
        if: always()
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: >-
          uv run pytest tests/e2e/test_plugin_load_smoke.py -m smoke
          --junitxml=plugin-load-report.xml

      - name: Assert the plugin-load smoke actually ran
        # always(): a silent skip of the plugin-load smoke must also fail the job.
        if: always()
        shell: bash
        run: >-
          uv run python scripts/validation/assert_smoke_ran.py
          plugin-load-report.xml
          --smoke-substr test_plugin_load_smoke
          --expected-count 3

      # Issue #3324: the isolation fix this covers is Windows-specific
      # (Path.home() reads USERPROFILE first), and the test skips without the
      # binary on PATH. The PR-time Windows leg has no CLI, so it exercised
      # every part of that test except the part that shells out. This job has a
      # pinned CLI on a windows-latest matrix leg, which makes it the only place
      # the real install path runs on the platform that leaked.
      # No credentials: `plugin install <local-dir>` reads a path, not the API.
      # Verified by running this test with no COPILOT_GITHUB_TOKEN and an
      # isolated home that hides stored auth. Least privilege, and the
      # non-CLI-steps credential policy test stays intact without an exemption.
      - name: Run Copilot install isolation smoke
        # always(): run even if an earlier smoke failed so all three report.
        if: always()
        shell: bash
        run: >-
          uv run pytest
          tests/integration/test_e2e_install.py::TestCopilotBinaryInstall
          --junitxml=install-isolation-report.xml

      - name: Assert the install isolation smoke actually ran
        # always(): pytest exits 0 on a skip, so the skip needs its own gate.
        if: always()
        shell: bash
        run: >-
          uv run python scripts/validation/assert_smoke_ran.py
          install-isolation-report.xml
          --smoke-substr TestCopilotBinaryInstall
          --expected-count 1

  smoke-result:
    name: Smoke Result
    needs: [authorize, smoke]
    # Pass-through summary so the run has one terminal status to alert on.
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      # The reporter is a repo script, so this job needs it on disk. Without
      # this the step died with Errno 2 and masked the real smoke result.
      - name: Checkout reporter script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: scripts/ci/require_job_results.py
          sparse-checkout-cone-mode: false

      - name: Report
        shell: bash
        env:
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          TRUSTED: ${{ needs.authorize.outputs.trusted }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          python3 scripts/ci/require_job_results.py \
            --check AUTHORIZE_RESULT success \
              "Trusted-context gate result: {value}" \
            --check TRUSTED true \
              "Untrusted context; smoke skipped. Run on trusted repo via schedule/workflow_dispatch." \
            --check SMOKE_RESULT success \
              "Nightly smoke result: {value}" \
            --success-message "Nightly CLI smoke passed on all platforms."
