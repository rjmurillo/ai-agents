# taste-lint: ignore file-size, trust gate, matrices, and result job stay together for review.
# Plugin CLI Smoke (issue #6069, REQ-047; supersedes the nightly smoke of issue #2231
# items 3-4, ADR-071, issue #2736)
#
# Gates a pull request on proof that the shipped plugin loads in Codex on
# Ubuntu, macOS, and Windows, that the repo root loads as a Pi package on
# Ubuntu, and that the Claude CLI discovers the plugin hooks on Ubuntu. A path
# filter (scripts/validation/cli_smoke_paths.py, ADR-006: decision in Python,
# not YAML) runs the legs only when a change can affect plugin loading. The
# "CLI Smoke Result" job always runs, so it is the one check to require.
#
# Every leg makes no model call and reads no credential, so none has an
# environment or a secret (ADR-114 decision 1: an environment is for a job that
# calls a model and reads a provider secret). The Claude and Copilot real-CLI
# smoke legs, which ran behind the agent-claude and agent-copilot approvals, were
# removed on 2026-11-25 with every other job gated by an agent-* environment.
#
# Legs:
#   - smoke-pi: one Ubuntu leg. The Pi package smoke makes no model call and
#     reads no credential (ADR-115).
#   - smoke-codex: one leg per OS. The Codex plugin-load smoke makes no model
#     call and reads no credential.
#   - smoke-claude-hooks: one Ubuntu leg. `claude plugin details` proves the CLI
#     still discovers the hooks in src/claude/hooks/hooks.json (REQ-048 Stop
#     nudge, D32). It makes no model call and reads no credential.
#
# What the smokes prove:
#   - Codex plugin-load smoke (REQ-047 AC11): `codex plugin add` installs
#     project-toolkit@ai-agents into an isolated CODEX_HOME and
#     `codex debug prompt-input` lists every expected skill.
#   - Codex agent install smoke (ADR-115 Decision 7): `install_agents.py` runs from the
#     installed plugin cache, and `codex debug prompt-input` lists every shipped agent.
#
# Security (.claude/skills/security-review/references/rule-security.md, issue #2231 item 3):
#   - The trusted-context gate (scripts/validation/assert_trusted_smoke_context.py)
#     re-checks event, repository, head repository, and ref and fails closed,
#     and "CLI Smoke Result" fails a fork PR with a message naming the fork.
#   - Least-privilege: top-level permissions are contents: read.
#   - Every action is pinned to a commit SHA (no floating tags).
#
# Loud, not silent
# (.claude/skills/ai-agents-generation-and-release/references/rule-generated-artifacts.md, issue
# #2231 item 4):
#   The smoke tests skip without RUN_CLI_E2E=1 and the CLIs, and a skip reads as
#   a pass in a green summary. scripts/validation/assert_smoke_ran.py parses the
#   JUnit report and fails the job if the smoke was skipped or not collected, so
#   a missing CLI surfaces as a red run, not a silent green one.
#   assert_smoke_ran.py, assert_trusted_smoke_context.py, and
#   scripts/validation/smoke_result.py are stdlib-only and run with `python -I`
#   from a base-commit checkout (trusted-base/), never from the pull request tree.
#
name: Plugin CLI Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Smoke path filter
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      # Full history: the three-dot diff needs the merge base of the PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # REQ-047 AC12: the filter code must not come from the pull request, or a
      # fork PR could edit it to return run=false and pass the gate. Check the
      # script out from the base commit into its own directory. A
      # workflow_dispatch run has no base SHA and uses its own ref.
      - name: Checkout the path filter from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/cli_smoke_paths.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # python3 -I ignores PYTHONPATH and the script directory, so nothing in
      # the pull request tree can shadow a stdlib import. --repo-root points the
      # three-dot diff at the pull request checkout, not the base copy.
      - name: Decide whether the smoke must run
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -I trusted-base/scripts/validation/cli_smoke_paths.py \
            --event-name "$EVENT_NAME" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --repo-root "$GITHUB_WORKSPACE"

  authorize:
    name: Trusted-context gate
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      # The trust gate decides which contexts run the smoke legs, so its code must not
      # come from the pull request. Run it from the base commit (workflow_dispatch uses its own ref).
      - name: Checkout trusted scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/assert_trusted_smoke_context.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check trusted context
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REF: ${{ github.ref }}
        run: |
          trusted=$(python3 -I trusted-base/scripts/validation/assert_trusted_smoke_context.py \
            --event-name "$EVENT_NAME" \
            --repository "$REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --ref "$REF")
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  # Codex needs no credential: plugin add and debug prompt-input read the repo
  # and an isolated CODEX_HOME only. No environment, no secret (REQ-047 AC11).
  smoke-codex:
    name: Smoke (codex, ${{ matrix.os }})
    needs: [changes, authorize]
    if: needs.changes.outputs.run == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      RUN_CLI_E2E: '1'
    steps:
      - name: Harden Runner
        # Windows and macOS runners do not support harden-runner; gate it.
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The gate decides pass or fail, so it runs from the base commit, not the pull
      # request tree. It is stdlib-only, so `python -I` needs no environment.
      - name: Checkout trusted scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/assert_smoke_ran.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Install pinned Codex CLI
        shell: bash
        working-directory: .github/cli-smoke/codex
        env:
          BIN_DIR: ${{ github.workspace }}/.github/cli-smoke/codex/node_modules/.bin
        run: |
          npm ci
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Run real-CLI plugin-load smoke (codex)
        shell: bash
        run: >-
          uv run --frozen pytest tests/e2e/test_plugin_load_smoke.py -m "smoke and codex"
          --junitxml=plugin-load-report.xml

      - name: Assert the plugin-load smoke actually ran
        # always(): a silent skip of the plugin-load smoke must also fail the job.
        if: always()
        shell: bash
        run: >-
          python -I trusted-base/scripts/validation/assert_smoke_ran.py
          plugin-load-report.xml
          --smoke-substr test_plugin_load_smoke
          --expected-count 2
          --require-pass test_codex_plugin_loads_expected_skills
          --require-pass test_codex_agents_install_and_load

  # Hook discovery needs no credential and no model call: `claude plugin details`
  # reads the plugin tree only, with an empty HOME. No environment, no secret.
  # Its two tests must pass, never skip (no --allow-skip-marker).
  smoke-claude-hooks:
    name: Smoke (claude hook discovery, ubuntu)
    needs: [changes, authorize]
    if: needs.changes.outputs.run == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RUN_CLI_E2E: '1'
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The gate decides pass or fail, so it runs from the base commit, not the pull
      # request tree. It is stdlib-only, so `python -I` needs no environment.
      - name: Checkout trusted scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/assert_smoke_ran.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      # Keep credentials out of npm lifecycle scripts (CWE-829). npm ci installs
      # the committed lockfile and checks every tarball integrity hash.
      - name: Install pinned Claude CLI
        shell: bash
        working-directory: .github/cli-smoke/claude
        env:
          BIN_DIR: ${{ github.workspace }}/.github/cli-smoke/claude/node_modules/.bin
        run: |
          npm ci
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Run real-CLI hook discovery smoke (claude)
        shell: bash
        run: >-
          uv run --frozen pytest tests/e2e/test_claude_hook_discovery_smoke.py
          -m "smoke and claude" --junitxml=hook-discovery-report.xml

      - name: Assert the hook discovery smoke actually ran
        # always(): a silent skip of the hook discovery smoke must also fail the job.
        if: always()
        shell: bash
        run: >-
          python -I trusted-base/scripts/validation/assert_smoke_ran.py
          hook-discovery-report.xml
          --smoke-substr test_claude_hook_discovery_smoke
          --expected-count 2
          --require-pass test_cli_discovers_the_shipped_plugin_hooks
          --require-pass test_cli_finds_no_hooks_when_hooks_json_sits_at_the_plugin_root

  smoke-pi:
    name: Smoke (pi, ${{ matrix.os }})
    needs: [changes, authorize]
    if: needs.changes.outputs.run == 'true' && needs.authorize.outputs.trusted == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      RUN_CLI_E2E: '1'
    steps:
      - name: Harden Runner
        # Windows and macOS runners do not support harden-runner; gate it.
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The gate decides pass or fail, so it runs from the base commit, not the pull
      # request tree. It is stdlib-only, so `python -I` needs no environment.
      - name: Checkout trusted scripts from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/assert_smoke_ran.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15'

      - name: Install uv
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Setup Node
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 'lts/*'

      - name: Install pinned Pi CLI
        shell: bash
        working-directory: .github/cli-smoke/pi
        env:
          BIN_DIR: ${{ github.workspace }}/.github/cli-smoke/pi/node_modules/.bin
        run: |
          npm ci --ignore-scripts
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: Run real-CLI package smoke (pi)
        shell: bash
        run: >-
          uv run --frozen pytest tests/e2e/test_pi_package_smoke.py -m "smoke and pi"
          --junitxml=pi-package-report.xml

      - name: Assert the Pi package smoke actually ran
        # always(): a silent skip of the Pi package smoke must also fail the job.
        if: always()
        shell: bash
        run: >-
          python -I trusted-base/scripts/validation/assert_smoke_ran.py
          pi-package-report.xml
          --smoke-substr test_pi_package_smoke
          --expected-count 1
          --require-pass test_pi_package_loads_every_skill_and_a_skill_script_finds_lib

  smoke-result:
    name: CLI Smoke Result
    needs: [changes, authorize, smoke-codex, smoke-claude-hooks, smoke-pi]
    # The one terminal status to require: it runs on every pull request, passes
    # when the path filter says nothing relevant changed, and otherwise demands
    # every leg. !cancelled() rather than always(): a newer push cancels the run
    # (concurrency), and always() would then report a red check on the old head.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      # The reporter is a repo script, so this job needs it on disk. Without
      # this the step died with Errno 2 and masked the real smoke result. It
      # decides the required check, so it comes from the base commit.
      - name: Checkout reporter script from the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted-base
          sparse-checkout: scripts/validation/smoke_result.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Report
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          TRUSTED: ${{ needs.authorize.outputs.trusted }}
          CODEX_RESULT: ${{ needs.smoke-codex.result }}
          HOOKS_RESULT: ${{ needs.smoke-claude-hooks.result }}
          PI_RESULT: ${{ needs.smoke-pi.result }}
        run: python3 -I trusted-base/scripts/validation/smoke_result.py --preset plugin-cli-smoke
