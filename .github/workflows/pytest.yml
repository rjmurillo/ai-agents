# Python Tests
#
# Runs pytest and security checks for Python code in the repository.
# Uses dorny/paths-filter to determine if tests should run or be skipped.
#
# IMPORTANT: This workflow runs on ALL PRs to satisfy required status checks,
# but skips actual test execution when no Python files are changed.
#
# Testable paths are defined in the check-paths job filters block.
#
# Local developers and AI agents can run the same tests using:
#   uv run pytest
#   uv run pip-audit
#   uv run bandit -r .claude/ scripts/

name: Python Tests

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-paths:
    name: Check Changed Paths
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      python-changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Python file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - 'scripts/memory_enhancement/**'
              - 'lefthook.yml'
              - '.config/wt.toml'
              - 'scripts/bootstrap-vm.sh'
              - '.github/actions/setup-code-env/action.yml'
              - '.github/actions/ai-review/action.yml'
              - '.github/workflows/pytest.yml'

      - name: Report path check result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger - running all tests"
          else
            echo "Python files changed: ${{ steps.filter.outputs.python }}"
          fi

  test:
    name: Run Python Tests
    needs: check-paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check if tests needed
        id: should-run
        env:
          PYTHON_CHANGED: ${{ needs.check-paths.outputs.python-changed }}
        run: |
          if [ "$PYTHON_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Python files changed - skipping tests"
          fi

      - name: Harden Runner
        if: steps.should-run.outputs.skip != 'true'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.should-run.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Setup code environment
        if: steps.should-run.outputs.skip != 'true'
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      # Issue #2655: blocking parse gate. PR #2640 shipped PEP 758 syntax
      # (unparenthesized except tuples) that Python 3.14 accepts but 3.13 and
      # earlier reject; the CLI runs hooks under the host interpreter, so it
      # wedged on older hosts. Nothing caught it because the dev/CI target is
      # 3.14 (where it is valid), ruff E999 is report-only below and exempts the
      # generated src/copilot-cli mirrors, and pytest only fails when a collected
      # test imports the broken module. This step parses every tracked .py at the
      # declared support floor (pyproject requires-python) via ast feature_version
      # and blocks on any failure, even though this runner is 3.14. It is separate
      # from the ruff style backlog: a parse failure is a zero-false-positive
      # defect. Keep it BEFORE the ruff step and do NOT add continue-on-error.
      - name: Validate Python syntax (blocking)
        if: steps.should-run.outputs.skip != 'true'
        run: python scripts/validation/validate_python_syntax.py

      # Issue #2939: keep repo-wide ruff debt from blocking unrelated PRs while
      # failing new violations in changed Python files.
      - name: Run ruff ratchet (changed Python files)
        if: steps.should-run.outputs.skip != 'true'
        env:
          RUFF_RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: python scripts/ci/ruff_ratchet.py

      - name: Run pytest
        if: steps.should-run.outputs.skip != 'true'
        run: |
          mkdir -p artifacts
          pytest --cov --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/pytest-results.xml

      # Issue #1963: test_ai_review.py was split by tested module into
      # test_verdict.py (get_verdict, merge_verdicts, extract_verdict, verdict
      # presentation helpers) and test_quality_gate.py (get_failure_category,
      # spec_validation_failed). scripts.ai_review_common.verdict hosts all of
      # those plus the label/milestone helpers that remain in test_ai_review.py,
      # so the 100% gate must run all three files. Running test_ai_review.py
      # alone now reports 63% and trips --cov-fail-under=100.
      - name: Pin ai_review_common.verdict coverage at 100% (REQ-008-07)
        if: steps.should-run.outputs.skip != 'true'
        run: pytest tests/test_ai_review.py tests/test_verdict.py tests/test_quality_gate.py --cov=scripts.ai_review_common.verdict --cov-branch --cov-fail-under=100

      # Issue #2063 (revised): module-name form is the canonical form for this
      # repository. The file-path form (--cov=.claude/skills/.../*.py) was
      # tested in PR #2078 and produces "Module never imported" + 0% coverage
      # with pytest-cov 7.x on Python 3.14, tripping --cov-fail-under=100. The
      # module-name form resolves correctly via conftest.py sys.path setup and
      # reports the actual 100%. Do not switch forms without re-verifying both
      # locally and in CI.
      - name: Pin REQ-009 module coverage at 100% (PR #1989 user requirement)
        if: steps.should-run.outputs.skip != 'true'
        run: |
          pytest \
            tests/skills/github/test_wait_for_unresolved_zero.py \
            tests/skills/session-end/test_rework_warning.py \
            --cov=wait_for_unresolved_zero \
            --cov=rework_warning \
            --cov-branch --cov-fail-under=100

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.should-run.outputs.skip != 'true'
        with:
          name: pytest-results
          path: artifacts/
          retention-days: 7

  security:
    name: Python Security Checks
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Run pip-audit
        run: |
          # Keep the audited environment on the first fixed pip release for
          # PYSEC-2026-196. CI hit pip 26.1.1 after setup-code-env installed
          # dependencies, and pip-audit reports the fixed version as 26.1.2.

          # Ignored CVEs (re-evaluate when upstream releases a fix):
          #   CVE-2026-4539: pygments 2.19.2, no fix available.
          #   CVE-2026-3219: historical pip 26.0/26.0.1 finding for
          #     concatenated tar/ZIP archives. The runner is upgraded to pip
          #     26.1.2 below; keep this ignore only while pip-audit still
          #     reports stale transitive runner metadata after that upgrade.
          #   CVE-2026-6357: historical pip 26.0.x finding in the same
          #     local-only class as CVE-2026-3219. Remove this ignore when
          #     pip-audit no longer reports it after the pip 26.1.2 upgrade.
          python -m pip install --upgrade "pip==26.1.2"
          pip-audit \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357

      # Issue #2808: `|| true` masked both bandit crashes and genuine findings,
      # turning this step green regardless. Gate on high severity AND high
      # confidence so real high-risk findings fail CI, scoped off test-only
      # false positives. SARIF output feeds GitHub code scanning.
      - name: Run Bandit
        run: |
          bandit -r .claude/ scripts/ \
            -x '*/tests/*,*/test/*' \
            -f sarif \
            -o bandit.sarif \
            --severity-level high \
            --confidence-level high

      - name: Upload Bandit SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-results
          path: bandit.sarif
          retention-days: 7

  # Pass-through job: satisfies required "Run Python Tests" check when no Python files changed.
  # GitHub branch protection requires SUCCESS (not SKIPPED) for required checks.
  # See: Issue #1168
  skip-tests:
    name: Run Python Tests
    needs: check-paths
    if: needs.check-paths.outputs.python-changed != 'true'
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip tests (no Python files changed)
        run: |
          echo "No Python files changed - skipping tests"
          echo ""
          echo "See the 'python' filter in check-paths job for paths that trigger tests."
          echo "Reference: .github/workflows/pytest.yml"

  # ─── Windows runtime contract tests ───────────────────────────────────────
  # The PowerShell path-resolution test never runs on Linux because pwsh is
  # absent. The pytest HEAD guard also depends on Git's Windows trace behavior.
  # This job executes both contracts on an always-on Windows runner. Neither
  # contract needs authentication or external credentials.
  test-windows-pwsh:
    name: Run Python and Lefthook Tests (Windows)
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Run pwsh hook contract tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run pytest tests/build_scripts/test_generate_hooks_runtime_contract.py -v -k "powershell"

      - name: Run pytest HEAD guard contracts
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run pytest tests/test_pytest_head_guard.py -v

      - name: Run Lefthook integration tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run pytest tests/test_lefthook_integration.py -q

      - name: Run AI review output path contract tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run pytest tests/test_check_ai_review_infra_gate.py -v
