# Python Tests
#
# Runs pytest and security checks for Python code in the repository.
# Uses dorny/paths-filter to determine if tests should run or be skipped.
#
# IMPORTANT: This workflow runs on ALL PRs to satisfy required status checks,
# but skips actual test execution when no Python test inputs are changed.
#
# Testable paths are defined in the check-paths job filters block.
#
# Local developers and AI agents can run the same tests using:
#   uv run pytest
#   uv run pip-audit
#   uv run bandit -r .claude/ scripts/

name: Python Tests

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-merge-state:
    name: PR Merge State
    if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check open PR merge state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci/check_pr_merge_state.py

  check-paths:
    name: Check Changed Paths
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      python-changed: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Python test input changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.ps1'
              - '**/*.psm1'
              - '**/*.pyw'
              # Canonical rules and both generated instruction trees are direct
              # inputs to Python contract tests. Keep these roots explicit so
              # unrelated Markdown, such as session logs, still skips pytest.
              - '.claude/rules/**'
              - '.github/instructions/**'
              - 'src/copilot-cli/instructions/**'
              - 'scripts/ci/ruff_count_baseline.txt'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - 'scripts/memory_enhancement/**'
              - 'lefthook.yml'
              - '.config/wt.toml'
              - 'scripts/bootstrap-vm.sh'
              - '.github/actions/setup-code-env/action.yml'
              - '.github/actions/ai-review/action.yml'
              - '.github/workflows/pytest.yml'
              # Episode JSON is a test input, not source: the store-clean pin in
              # tests/skills/memory/test_extract_session_episode.py reads it. The
              # population issue #3633 names is a hand edit or merge-conflict
              # resolution touching only these files, which no '**/*.py' pattern
              # catches.
              - '.agents/memory/episodes/**'
              # Issue #4408: rules files are test inputs -- many Python tests read
              # them directly (e.g. test_validate_workflows.py, test_plugin_tree_no_unicode_dashes.py).
              # A rules-only change must trigger the full suite.
              - '.claude/rules/**'
              - '.github/instructions/**'
              - 'src/copilot-cli/instructions/**'

      - name: Report path check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger - running all tests"
          else
            echo "Python test inputs changed: $PYTHON_CHANGED"
          fi

  test:
    name: Run Python Tests
    needs: check-paths
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check if tests needed
        id: should-run
        env:
          PYTHON_CHANGED: ${{ needs.check-paths.outputs.python-changed }}
        run: |
          if [ "$PYTHON_CHANGED" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Python test inputs changed - skipping tests"
          fi

      - name: Harden Runner
        if: steps.should-run.outputs.skip != 'true'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.should-run.outputs.skip != 'true'
        with:
          fetch-depth: 0

      - name: Setup code environment
        if: steps.should-run.outputs.skip != 'true'
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      # Issue #2655: blocking parse gate. PR #2640 shipped PEP 758 syntax
      # (unparenthesized except tuples) that Python 3.14 accepts but 3.13 and
      # earlier reject; the CLI runs hooks under the host interpreter, so it
      # wedged on older hosts. Nothing caught it because the dev/CI target is
      # 3.14 (where it is valid), ruff E999 is report-only below and exempts the
      # generated src/copilot-cli mirrors, and pytest only fails when a collected
      # test imports the broken module. This step parses every tracked .py at the
      # declared support floor (pyproject requires-python) via ast feature_version
      # and blocks on any failure, even though this runner is 3.14. It is separate
      # from the ruff style backlog: a parse failure is a zero-false-positive
      # defect. Keep it BEFORE the ruff step and do NOT add continue-on-error.
      - name: Validate Python syntax (blocking)
        if: steps.should-run.outputs.skip != 'true'
        run: python scripts/validation/validate_python_syntax.py

      - name: Validate AI review workflow budgets
        if: steps.should-run.outputs.skip != 'true'
        run: python scripts/ci/validate_ai_review_budgets.py

      # Issue #2939: keep repo-wide ruff debt from blocking unrelated PRs while
      # failing new violations in changed Python files.
      - name: Run ruff ratchet (changed Python files)
        if: steps.should-run.outputs.skip != 'true'
        env:
          RUFF_RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: python scripts/ci/ruff_ratchet.py

      # Issue #2993 acceptance criterion 2 (regression guard, option C). The
      # diff-scoped ratchet above cannot see debt a PR adds to a file it does
      # not otherwise touch, so the whole-tree total is capped by
      # scripts/ci/ruff_count_baseline.txt. A lower count passes without
      # rewriting that shared line; use --update only when intentionally
      # lowering the ceiling.
      # `uv run --frozen` pins ruff to the lockfile. The dev extra declares an
      # open-ended `ruff>=`, so a `uv pip install` resolves whatever is newest
      # and a future ruff rule change could fail this baseline on an unrelated
      # PR.
      #
      # PR and non-PR legs select by step-level if: rather than shell branching,
      # per ADR-006 (no decision logic in workflow YAML). Both compare against a
      # ref, which is what makes the baseline one-directional: without
      # --base-ref, raising the baseline in the same change that adds the
      # violations passes as an improvement. A ref name is attacker-controlled
      # text and gets three separate defenses. Keeping it in env means the
      # `${{ }}` expression is never substituted into the script source, so a
      # ref name cannot inject shell syntax. Quoting `"$BASE_REF"` at the one
      # place the shell does expand it keeps it a single argument to git rather
      # than a word-split command line. And the ratchet script is handed the
      # fixed literal FETCH_HEAD, never the ref name, so nothing
      # attacker-controlled reaches Python argv.
      #
      # The non-PR leg compares against the default branch, not
      # github.event.before: event.before is the branch's own previous tip, so
      # raising the baseline in one push and adding the violations in the next
      # would slip through. The default branch is what the baseline is promised
      # against. On a push to the default branch this compares it to itself,
      # which is a harmless no-op.
      - name: Run ruff count ratchet (whole tree, pull request)
        if: steps.should-run.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth=1. The checkout above already used fetch-depth: 0, so a
          # depth-limited fetch saves nothing and writes .git/shallow, grafting
          # the fetched tip parentless. This ratchet does need a merge base:
          # count_ratchet.changed_files diffs `base_ref...HEAD` (three-dot) to
          # sort branch-touched files first. That leg fails open, so a graft
          # degrades the diagnostic instead of failing the step, which is the
          # buried-violation problem the ordering exists to prevent, not a red
          # check. The graft is written by whichever fetch runs first and a
          # plain undepthed fetch does not clear it, only --unshallow does.
          # In pr-validation.yml the same graft hits merge_tree_ratchet_check,
          # which fails closed, and that is what cost a red required check.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/ruff_count_ratchet.py --base-ref FETCH_HEAD

      - name: Run ruff count ratchet (whole tree, non-PR)
        if: steps.should-run.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/ruff_count_ratchet.py --base-ref FETCH_HEAD

      - name: Check security suppressions in diff (pull request, issue 4061)
        if: steps.should-run.outputs.skip != 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      - name: Check security suppressions in diff (non-PR, issue 4061)
        if: steps.should-run.outputs.skip != 'true' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      - name: Run pytest
        if: steps.should-run.outputs.skip != 'true'
        env:
          PYTEST_NON_TMP_ROOT: ${{ runner.temp }}/ai-agents-pytest
        run: uv run --frozen python scripts/ci/run_pytest_non_tmp.py --cov --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/pytest-results.xml

      # Issue #1963: test_ai_review.py was split by tested module into
      # test_verdict.py (get_verdict, merge_verdicts, extract_verdict, verdict
      # presentation helpers) and test_quality_gate.py (get_failure_category,
      # spec_validation_failed). scripts.ai_review_common.verdict hosts all of
      # those plus the label/milestone helpers that remain in test_ai_review.py,
      # so the 100% gate must run all three files. Running test_ai_review.py
      # alone now reports 63% and trips --cov-fail-under=100.
      - name: Pin ai_review_common.verdict coverage at 100% (REQ-008-07)
        if: steps.should-run.outputs.skip != 'true'
        run: pytest tests/test_ai_review.py tests/test_verdict.py tests/test_quality_gate.py --cov=scripts.ai_review_common.verdict --cov-branch --cov-fail-under=100

      # Issue #2063 (revised): module-name form is the canonical form for this
      # repository. The file-path form (--cov=.claude/skills/.../*.py) was
      # tested in PR #2078 and produces "Module never imported" + 0% coverage
      # with pytest-cov 7.x on Python 3.14, tripping --cov-fail-under=100. The
      # module-name form resolves correctly via conftest.py sys.path setup and
      # reports the actual 100%. Do not switch forms without re-verifying both
      # locally and in CI.
      - name: "Pin REQ-009 module coverage at 100% (PR #1989 user requirement)"
        if: steps.should-run.outputs.skip != 'true'
        run: |
          pytest \
            tests/skills/github/test_wait_for_unresolved_zero.py \
            tests/skills/session-end/test_rework_warning.py \
            --cov=wait_for_unresolved_zero \
            --cov=rework_warning \
            --cov-branch --cov-fail-under=100

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.should-run.outputs.skip != 'true'
        with:
          name: pytest-results
          path: artifacts/
          retention-days: 7

  security:
    name: Python Security Checks
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Run pip-audit
        run: |
          # Keep the audited environment on the first fixed pip release for
          # PYSEC-2026-196. CI hit pip 26.1.1 after setup-code-env installed
          # dependencies, and pip-audit reports the fixed version as 26.1.2.

          # Ignored CVEs (re-evaluate when upstream releases a fix):
          #   CVE-2026-4539: pygments 2.19.2, no fix available.
          #   CVE-2026-3219: historical pip 26.0/26.0.1 finding for
          #     concatenated tar/ZIP archives. The runner is upgraded to pip
          #     26.1.2 below; keep this ignore only while pip-audit still
          #     reports stale transitive runner metadata after that upgrade.
          #   CVE-2026-6357: historical pip 26.0.x finding in the same
          #     local-only class as CVE-2026-3219. Remove this ignore when
          #     pip-audit no longer reports it after the pip 26.1.2 upgrade.
          python -m pip install --upgrade "pip==26.1.2"
          pip-audit \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357

      # Issue #2808: `|| true` masked both bandit crashes and genuine findings,
      # turning this step green regardless. Gate on high severity AND high
      # confidence so real high-risk findings fail CI, scoped off test-only
      # false positives. SARIF output feeds GitHub code scanning.
      - name: Run Bandit
        run: |
          bandit -r .claude/ scripts/ \
            -x '*/tests/*,*/test/*' \
            -f sarif \
            -o bandit.sarif \
            --severity-level high \
            --confidence-level high

      - name: Upload Bandit SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-results
          path: bandit.sarif
          retention-days: 7

  # Pass-through job: satisfies required "Run Python Tests" check when no Python test inputs changed.
  # GitHub branch protection requires SUCCESS (not SKIPPED) for required checks.
  # See: Issue #1168
  skip-tests:
    name: Run Python Tests
    needs: check-paths
    if: needs.check-paths.outputs.python-changed != 'true'
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Skip tests (no Python test inputs changed)
        run: |
          echo "No Python test inputs changed - skipping tests"
          echo ""
          echo "See the 'python' filter in check-paths job for paths that trigger tests."
          echo "Reference: .github/workflows/pytest.yml"

  # ─── Windows path-contract tests ────────────────────────────────────────────
  # Tests marked @pytest.mark.windows_path exercise behavior that differs between
  # Windows and POSIX: path separators, PowerShell script resolution, Git's
  # Windows trace behavior, atomic-write durability, and install-tree layout.
  # The marker is the discovery mechanism: add pytestmark = pytest.mark.windows_path
  # (or include it in a list) at module level and the file runs here automatically.
  # Do NOT hardcode test file paths in this job; that was issue #4299.
  test-windows-pwsh:
    name: Run Windows path-contract tests (pytest.mark.windows_path)
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run Windows path-contract tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run pytest -m windows_path -v

  main-failure-alert:
    name: Main failure alert
    needs:
      - check-paths
      - test
      - security
      - skip-tests
      - test-windows-pwsh
    if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify failed Python Tests on main
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/main_pytest_failure_alert.py
