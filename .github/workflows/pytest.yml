# Python Tests
#
# Runs pytest and security checks for Python code in the repository.
# Uses dorny/paths-filter to determine if tests should run or be skipped.
#
# IMPORTANT: This workflow runs on ALL PRs to satisfy required status checks,
# but skips actual test execution when no Python test inputs are changed.
#
# Testable paths are defined in the check-paths job filters block.
#
# Local developers and AI agents can run the same tests using:
#   uv run pytest
#   uv run pip-audit
#   uv run bandit -r .claude/ scripts/

name: Python Tests

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
    branches:
      - main
  merge_group:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-merge-state:
    name: PR Merge State
    if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check open PR merge state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci/check_pr_merge_state.py

  check-paths:
    name: Check Changed Paths
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      python-changed: ${{ (github.event_name == 'workflow_dispatch' || env.ACT == 'true') && 'true' || steps.determine.outputs.python-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Python test input changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' && env.ACT != 'true'
        with:
          filters: |
            python:
              - '**/*.py'
              - '**/*.pyi'
              - '**/*.ipynb'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.yaml'
              - '**/*.yml'
              - '**/*.ps1'
              - '**/*.psm1'
              - '**/*.pyw'
              # Canonical rules and both generated instruction trees are
              # direct inputs to Python contract tests. They were named here
              # when the filter scoped Markdown to a curated set. It no longer
              # does: the extension globs at the bottom of this list match all
              # tracked Markdown, JSON and text, so session logs trigger pytest
              # too. That is deliberate, and the reasoning is at those globs.
              # These roots stay because they also carry non-Markdown files.
              - '.claude/rules/**'
              - '.github/instructions/**'
              - 'src/copilot-cli/instructions/**'
              - 'scripts/ci/ruff_count_baseline.txt'
              - 'scripts/ci/subprocess_encoding_count_baseline.txt'
              - '**/pyproject.toml'
              - '**/ruff.toml'
              - '**/.ruff.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - 'scripts/memory_enhancement/**'
              - 'lefthook.yml'
              - '.config/wt.toml'
              - 'scripts/bootstrap-vm.sh'
              - '.github/actions/setup-code-env/action.yml'
              - '.github/actions/ai-review/action.yml'
              - '.github/workflows/pytest.yml'
              # Episode JSON is a test input, not source: the store-clean pin in
              # tests/skills/memory/test_extract_session_episode.py reads it. The
              # population issue #3633 names is a hand edit or merge-conflict
              # resolution touching only these files, which no '**/*.py' pattern
              # catches.
              - '.agents/memory/episodes/**'
              # Issue #4408: rules files are test inputs -- many Python tests read
              # them directly (e.g. test_validate_workflows.py, test_plugin_tree_no_unicode_dashes.py).
              # A rules-only change must trigger the full suite. The same three
              # roots are listed above for the same reason; one copy is enough.
              # Issue #5315. Pre-push stopped executing the suite on a
              # non-Python change (ADR-104) on the stated ground that CI
              # executes it instead. These roots are read as test inputs by
              # real tests and were absent from this filter, so a push touching
              # only one of them ran no assertions locally AND skipped the
              # matrix here: assertions did not run until the merge queue
              # forced them. Each entry below is referenced by at least one
              # test, which the colocated guard checks textually: it does not
              # prove a runtime read, and a mention in a comment counts. The
              # looseness is deliberate (a strict-path version produced a false
              # negative on a package tree reached by import), and it means a
              # passing guard is evidence of intent, not of dependency.
              #   .claude/skills/**        tests/skills/**, e.g.
              #                            security-review/test_skill_md.py
              #   .serena/memories/**      tests/test_memory_verification.py
              #   .agents/architecture/**  tests/build_scripts/test_hook_contract_knowledge.py
              #   .agents/governance/**    tests/test_canonical_sources_registration.py
              #   AGENTS.md, README.md     tests/test_knowledge_surface_consistency.py
              #   .agents/AGENT-SYSTEM.md  tests/test_agent_role_metadata_migration.py
              - '.claude/skills/**'
              - 'src/copilot-cli/skills/**'
              - '.serena/memories/**'
              - '.agents/architecture/**'
              - '.agents/governance/**'
              - '.agents/AGENT-SYSTEM.md'
              # Added in review on PR #5319, from two concrete misses a reviewer
              # found by reading the tests rather than the filter:
              #   .agents/critique/**  tests/build_scripts/test_hook_contract_knowledge.py
              #                        opens ADR-084-debate-log.md directly
              #   templates/agents/**  tests/test_pr_identity_gate.py reads
              #                        analyst.shared.md directly
              # The colocated test checks that every root here is referenced by
              # a test. It cannot check the reverse, which is the direction that
              # fails silently, and these two are what that gap looked like.
              - '.agents/critique/**'
              - 'templates/agents/**'
              # Second batch, same method and same reviewer (PR #5319): found by
              # reading tests for direct reads rather than by reading the filter.
              #   .github/PULL_REQUEST_TEMPLATE.md
              #       tests/external_signals/test_acceptance_criteria.py
              #   .agents/schemas/**  tests/test_skill_output_schema.py
              #   .claude/settings.json, .claude/hooks/**, src/copilot-cli/hooks/**
              #       tests/build_scripts/test_hook_contract_knowledge.py
              # None was matched by an extension glob: the filter carries no
              # `**/*.json` or `**/*.md`, which is the point of the allowlist and
              # also why a JSON or Markdown input has to be named to be seen.
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.agents/schemas/**'
              - '.claude/settings.json'
              - '.claude/hooks/**'
              - 'src/copilot-cli/hooks/**'
              - 'AGENTS.md'
              - 'README.md'
              # Eighth root, third round, same method (PR #5319):
              #   docs/installation.md  tests/test_knowledge_surface_consistency.py
              - 'docs/installation.md'
              # Fourth round, and the last hand-picked one. A reviewer asked for
              # a reverse audit instead of a fifth batch, so one was run: parse
              # every string literal in all 974 test modules, keep the ones that
              # resolve to a real repository file, and check each against this
              # filter. It found 120 direct test inputs the allowlist did not
              # match, 92 Markdown, 14 JSON, 5 text, spread across every tree
              # including `.agents/retrospective/**`, `.agents/sessions/**`, and
              # `.agents/analysis/**`, which the comment at the top of this
              # filter names as the Markdown it deliberately skips. Those trees
              # are test inputs too, so the thing the allowlist was protecting
              # was already close to empty.
              #
              # Three extension globs close all 120 and end the curation. The
              # trade is deliberate: a docs-only or retro-only PR now runs the
              # matrix it used to skip, so the failure direction flips from "a
              # gate silently did not run" to "a run was wasted". Only the
              # second one is visible to the person who caused it.
              #
              # The named roots above stay: they cover non-Markdown, non-JSON,
              # non-text inputs inside those trees, and deleting them would make
              # this change larger than the gap it closes.
              - '**/*.md'
              - '**/*.json'
              - '**/*.txt'
              # THIRD-PARTY-NOTICES.TXT is read by a test and picomatch is
              # case-sensitive, so the lowercase glob above does not reach it.
              - '**/*.TXT'
              # The reverse audit's remainder: real test inputs with no
              # extension to glob. `.gitkeep` marks a directory a test asserts
              # exists; the other four are read for their contents.
              - '.actrc'
              - '.gitattributes'
              - '.gitignore'
              - '.python-version'
              - '**/.gitkeep'

      - name: Determine if tests should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: python
          FORCE_RUN_EVENTS: merge_group
          OUTPUT_NAME: python-changed
        run: python3 scripts/workflows/determine_should_run_from_filters.py

      - name: Report path check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger - running all tests"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "Merge group - running all tests"
          else
            echo "Python test inputs changed: $PYTHON_CHANGED"
          fi

  test:
    name: "pytest (${{ matrix.partition }})"
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    env:
      NODE_OPTIONS: --use-system-ca
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: bulk
            coverage_file: artifacts/.coverage.bulk
            junit_file: artifacts/pytest-results.xml
          - partition: bulk-nested
            coverage_file: artifacts/.coverage.bulk-nested
            junit_file: artifacts/pytest-results-bulk-nested.xml
          - partition: mutation
            coverage_file: artifacts/.coverage.mutation
            junit_file: artifacts/pytest-results-mutation.xml
          - partition: safe-push
            coverage_file: artifacts/.coverage.safe-push
            junit_file: artifacts/pytest-results-safe-push.xml
          - partition: pr-autofix
            coverage_file: artifacts/.coverage.pr-autofix
            junit_file: artifacts/pytest-results-pr-autofix.xml

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      # Issue #2655: blocking parse gate. PR #2640 shipped PEP 758 syntax
      # (unparenthesized except tuples) that Python 3.14 accepts but 3.13 and
      # earlier reject; the CLI runs hooks under the host interpreter, so it
      # wedged on older hosts. Nothing caught it because the dev/CI target is
      # 3.14 (where it is valid), ruff E999 is report-only below and exempts the
      # generated src/copilot-cli mirrors, and pytest only fails when a collected
      # test imports the broken module. This step parses every tracked .py at the
      # declared support floor (pyproject requires-python) via ast feature_version
      # and blocks on any failure, even though this runner is 3.14. It is separate
      # from the ruff style backlog: a parse failure is a zero-false-positive
      # defect. Keep it BEFORE the ruff step and do NOT add continue-on-error.
      - name: Validate Python syntax (blocking)
        if: matrix.partition == 'bulk'
        run: python scripts/validation/validate_python_syntax.py

      - name: Validate AI review workflow budgets
        if: matrix.partition == 'bulk'
        run: python scripts/ci/validate_ai_review_budgets.py

      # Issue #4494: a test_*.py inside testpaths that defines no test collects
      # nothing and is counted in no failure, so it reads as a passing suite
      # forever. Two mutation harnesses sat in that state, one of them grading
      # mutants nobody read. Blocking on purpose: do NOT add continue-on-error.
      - name: Check for zero-collection test files (blocking)
        if: matrix.partition == 'bulk'
        run: uv run --frozen python scripts/validation/check_zero_collection_tests.py

      # Issue #2939: keep repo-wide ruff debt from blocking unrelated PRs while
      # failing new violations in changed Python files.
      - name: Run ruff ratchet (changed Python files)
        if: matrix.partition == 'bulk'
        env:
          RUFF_RATCHET_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: python scripts/ci/ruff_ratchet.py

      # Issue #2993 acceptance criterion 2 (regression guard, option C). The
      # diff-scoped ratchet above cannot see debt a PR adds to a file it does
      # not otherwise touch, so the whole-tree total is capped by
      # scripts/ci/ruff_count_baseline.txt. A lower count passes without
      # rewriting that shared line; use --update only when intentionally
      # lowering the ceiling.
      # `uv run --frozen` pins ruff to the lockfile. The dev extra declares an
      # open-ended `ruff>=`, so a `uv pip install` resolves whatever is newest
      # and a future ruff rule change could fail this baseline on an unrelated
      # PR.
      #
      # PR and non-PR legs select by step-level if: rather than shell branching,
      # per ADR-006 (no decision logic in workflow YAML). Both compare against a
      # ref, which is what makes the baseline one-directional: without
      # --base-ref, raising the baseline in the same change that adds the
      # violations passes as an improvement. A ref name is attacker-controlled
      # text and gets three separate defenses. Keeping it in env means the
      # `${{ }}` expression is never substituted into the script source, so a
      # ref name cannot inject shell syntax. Quoting `"$BASE_REF"` at the one
      # place the shell does expand it keeps it a single argument to git rather
      # than a word-split command line. And the ratchet script is handed the
      # fixed literal FETCH_HEAD, never the ref name, so nothing
      # attacker-controlled reaches Python argv.
      #
      # The non-PR leg compares against the default branch, not
      # github.event.before: event.before is the branch's own previous tip, so
      # raising the baseline in one push and adding the violations in the next
      # would slip through. The default branch is what the baseline is promised
      # against. On a push to the default branch this compares it to itself,
      # which is a harmless no-op.
      - name: Run ruff count ratchet (whole tree, pull request)
        if: matrix.partition == 'bulk' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth=1. The checkout above already used fetch-depth: 0, so a
          # depth-limited fetch saves nothing and writes .git/shallow, grafting
          # the fetched tip parentless. This ratchet does need a merge base:
          # count_ratchet.changed_files diffs `base_ref...HEAD` (three-dot) to
          # sort branch-touched files first. That leg fails open, so a graft
          # degrades the diagnostic instead of failing the step, which is the
          # buried-violation problem the ordering exists to prevent, not a red
          # check. The graft is written by whichever fetch runs first and a
          # plain undepthed fetch does not clear it, only --unshallow does.
          # In pr-validation.yml the same graft hits merge_tree_ratchet_check,
          # which fails closed, and that is what cost a red required check.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/ruff_count_ratchet.py --base-ref FETCH_HEAD

      - name: Run ruff count ratchet (whole tree, non-PR)
        if: matrix.partition == 'bulk' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/ruff_count_ratchet.py --base-ref FETCH_HEAD

      - name: Run subprocess encoding count ratchet (whole tree, pull request)
        if: matrix.partition == 'bulk' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/subprocess_encoding_count_ratchet.py --base-ref FETCH_HEAD

      - name: Run subprocess encoding count ratchet (whole tree, non-PR)
        if: matrix.partition == 'bulk' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/ci/subprocess_encoding_count_ratchet.py --base-ref FETCH_HEAD

      - name: Check security suppressions in diff (pull request, issue 4061)
        if: matrix.partition == 'bulk' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      - name: Check security suppressions in diff (non-PR, issue 4061)
        if: matrix.partition == 'bulk' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth=1: see the pull_request leg above.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      # Each matrix leg writes one statement-only coverage file. Bulk ignores
      # the two pin suites, mutation, and the two process-sensitive files
      # because those tests run in their own partition or pin step.
      # `-n auto` uses every logical CPU exposed by the runner. On push and
      # pull_request events the import graph narrows each partition to the
      # affected tests (issue #5050); merge_group, any fail-safe verdict, and
      # any partition with no affected test run the full partition, so coverage
      # combine always receives non-empty data. The full-vs-subset decision and
      # the partition argument lists live in the Python runner, not here, per
      # ADR-006.
      - name: Run pytest
        id: run-pytest
        env:
          PYTEST_NON_TMP_ROOT: ${{ runner.temp }}/ai-agents-pytest
          COVERAGE_FILE: ${{ matrix.coverage_file }}
          PYTEST_SELECT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run --frozen python scripts/ci/run_pytest_selected.py
          --partition ${{ matrix.partition }}
          --cov --cov-report=
          --junitxml=${{ matrix.junit_file }}

      # Issue #1963: verdict.py's 100% branch gate needs all three of
      # test_ai_review.py, test_verdict.py, and test_quality_gate.py
      # (test_ai_review.py alone reports 63%). Collection stays broad; the
      # next step isolates the gate with coverage report --include.
      - name: Pin ai_review_common.verdict coverage collection (REQ-008-07)
        id: pin-verdict-collect
        if: matrix.partition == 'bulk' && steps.run-pytest.outcome != 'skipped' && !cancelled()
        env:
          COVERAGE_FILE: artifacts/.coverage.pin-verdict
        run: pytest tests/test_ai_review.py tests/test_verdict.py tests/test_quality_gate.py --cov --cov-branch --cov-report=

      # Isolated 100% branch gate for scripts/ai_review_common/verdict.py.
      - name: Enforce ai_review_common.verdict coverage at 100% (REQ-008-07)
        if: steps.pin-verdict-collect.outcome != 'skipped' && !cancelled()
        run: coverage report --data-file=artifacts/.coverage.pin-verdict --include=scripts/ai_review_common/verdict.py --fail-under=100

      # Issue #2063: module-name --cov fails for these file-path targets.
      # Collect broadly here, then isolate the file paths in the next step.
      - name: "Pin REQ-009 module coverage collection (PR #1989 user requirement)"
        id: pin-req009-collect
        if: matrix.partition == 'bulk' && steps.run-pytest.outcome != 'skipped' && !cancelled()
        env:
          COVERAGE_FILE: artifacts/.coverage.pin-req009
        run: |
          pytest \
            tests/skills/github/test_wait_for_unresolved_zero.py \
            --cov --cov-branch --cov-report=

      # Isolated 100% branch gate for the REQ-009 module.
      - name: "Enforce REQ-009 module coverage at 100% (PR #1989 user requirement)"
        if: steps.pin-req009-collect.outcome != 'skipped' && !cancelled()
        run: >-
          coverage report --data-file=artifacts/.coverage.pin-req009
          --include=.claude/skills/github/scripts/pr/wait_for_unresolved_zero.py
          --fail-under=100

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-results-${{ matrix.partition }}
          path: artifacts/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  coverage:
    name: Combine Python coverage
    needs:
      - check-paths
      - test
    if: needs.check-paths.outputs.python-changed == 'true' && !cancelled() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Download partition artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pytest-results-*
          merge-multiple: true
          path: artifacts

      # Coverage.py cannot directly combine line rows with branch arc rows.
      # The helper projects branch inputs to executed lines before union.
      - name: Combine coverage data
        run: |
          uv run --frozen python scripts/ci/combine_pin_coverage.py \
            --main-data artifacts/.coverage.bulk \
            --main-data artifacts/.coverage.bulk-nested \
            --main-data artifacts/.coverage.mutation \
            --main-data artifacts/.coverage.safe-push \
            --main-data artifacts/.coverage.pr-autofix \
            --pin-data artifacts/.coverage.pin-verdict \
            --pin-data artifacts/.coverage.pin-req009 \
            --output-data artifacts/.coverage.combined
          uv run --frozen coverage xml --data-file=artifacts/.coverage.combined -o artifacts/coverage.xml

      - name: Upload combined coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: artifacts/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  test-result:
    name: Run Python Tests
    needs:
      - check-paths
      - test
      - coverage
    # !cancelled() rather than always(): a superseded run leaves its
    # dependencies 'cancelled', and always() would turn that into a red
    # required check on the PR head (Issue #5097). !cancelled() still runs on
    # failed and skipped dependencies, so the pass-through and the real
    # failure signal both survive.
    if: >-
      !cancelled() &&
      (needs.check-paths.result != 'success' ||
      needs.check-paths.outputs.python-changed == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/require_job_results.py

      - name: Require test and coverage success
        env:
          PATH_RESULT: ${{ needs.check-paths.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: >-
          python scripts/ci/require_job_results.py
          --check PATH_RESULT success "path detection failed or was cancelled: {value}"
          --check TEST_RESULT success "test job failed or was cancelled: {value}"
          --check COVERAGE_RESULT success "coverage job failed or was cancelled: {value}"

  security:
    name: Python Security Checks
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Run pip-audit
        run: |
          # Keep the audited environment on a pip release pip-audit reports
          # clean. This pin has moved once before: issue #2438 set it to
          # 26.1.2 to escape PYSEC-2026-196, and 26.1.2 has since become the
          # vulnerable version under PYSEC-2026-3721, whose fix is 26.2
          # (issue #5222). Expect it to move again; the version below is the
          # only place that decides which pip runs, so keep every mention of
          # it in this block moving with it.

          # Ignored CVEs (re-evaluate when upstream releases a fix):
          #   CVE-2026-4539: pygments 2.19.2, no fix available. This project
          #     pins 2.19.2, so a clean virtualenv (which resolves 2.21.0)
          #     says nothing about it; retiring this belongs to issue #1778,
          #     measured against the real tree.
          #
          # The two historical pip findings, CVE-2026-3219 and CVE-2026-6357,
          # were ignored only while the runner still carried pre-26.1 pip
          # metadata. Run 32500970183 upgraded to 26.2 and pip-audit reported
          # a single ignored vulnerability, so those two ignores now suppress
          # nothing and would hide the findings if they ever recurred.
          python -m pip install --upgrade "pip==26.2"
          pip-audit --ignore-vuln CVE-2026-4539

      # Issue #2808: `|| true` masked both bandit crashes and genuine findings,
      # turning this step green regardless. Gate on high severity AND high
      # confidence so real high-risk findings fail CI, scoped off test-only
      # false positives. SARIF output feeds GitHub code scanning.
      - name: Run Bandit
        run: |
          bandit -r .claude/ scripts/ \
            -x '*/tests/*,*/test/*' \
            -f sarif \
            -o bandit.sarif \
            --severity-level high \
            --confidence-level high

      - name: Upload Bandit SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-results
          path: bandit.sarif
          retention-days: 7

  # Pass-through job: satisfies required "Run Python Tests" check when no Python test inputs changed.
  # GitHub branch protection requires SUCCESS (not SKIPPED) for required checks.
  # See: Issue #1168
  skip-tests:
    name: Run Python Tests
    needs: check-paths
    if: needs.check-paths.result == 'success' && needs.check-paths.outputs.python-changed != 'true'
    # ADR-025: ARM runner for cost optimization
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Skip tests (no Python test inputs changed)
        run: |
          echo "No Python test inputs changed - skipping tests"
          echo ""
          echo "See the 'python' filter in check-paths job for paths that trigger tests."
          echo "Reference: .github/workflows/pytest.yml"

  # Tests marked @pytest.mark.windows_path exercise behavior that differs between
  # Windows and POSIX: path separators, PowerShell script resolution, Git's
  # Windows trace behavior, atomic-write durability, and install-tree layout.
  # The marker is the discovery mechanism. Do not hardcode test file paths.
  test-windows-pwsh:
    name: Run Windows path-contract tests (pytest.mark.windows_path)
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run Windows path-contract tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run --frozen pytest -m windows_path -v

  main-failure-alert:
    name: Main failure alert
    needs:
      - check-paths
      - test
      - test-result
      - security
      - skip-tests
      - test-windows-pwsh
    # !cancelled() rather than always(): the alert script treats a 'cancelled'
    # dependency as a failure, so a cancelled main run would file a bogus
    # "Python Tests failed on main" issue (Issue #5097).
    if: >-
      !cancelled() && github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify failed Python Tests on main
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/main_pytest_failure_alert.py
