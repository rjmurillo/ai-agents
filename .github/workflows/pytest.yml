# taste-lint: ignore file-size
# This workflow keeps the platform matrix and required status aggregation together.
#
# Python Tests
#
# Runs pytest and security checks for Python code in the repository.
#
# IMPORTANT: The required "Run Python Tests" context comes from one job,
# test-result, whose verdict rests on the test partitions, the coverage job and
# the repository guards it depends on. None of them sits behind a path filter.
# ADR-101 requirement 1: no condition sourced outside that chain's own logic
# may let the context report success without running the verification its name
# claims. The check-paths job still gates the two jobs that are not part of the
# required context (Python Security Checks and the Windows path-contract tests).
#
# Which tests each partition runs is decided inside scripts/ci/run_pytest_selected.py.
#
# Local developers and AI agents can run the same tests using:
#   uv run pytest
#   uv run pip-audit
#   uv run bandit -r .claude/ scripts/

name: Python Tests

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
  pull_request:
    branches:
      - main
  merge_group:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pr-merge-state:
    name: PR Merge State
    if: github.event_name == 'push' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check open PR merge state
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python scripts/ci/check_pr_merge_state.py

  check-paths:
    name: Check Changed Paths
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      python-changed: ${{ (github.event_name == 'workflow_dispatch' || env.ACT == 'true') && 'true' || steps.determine.outputs.python-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Python test input changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group' && env.ACT != 'true'
        with:
          # Issue #5318. The list itself lives in the policy file, which
          # `scripts/test_selection/path_policy.py` also reads, so the
          # local test selector and this gate cannot drift apart. The
          # action accepts a workspace-relative path here in place of an
          # inline document; the checkout above puts the file in place.
          filters: scripts/test_selection/path_policy.yml

      - name: Determine if tests should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: python
          FORCE_RUN_EVENTS: merge_group
          OUTPUT_NAME: python-changed
        run: python3 scripts/workflows/determine_should_run_from_filters.py

      - name: Report path check result
        env:
          EVENT_NAME: ${{ github.event_name }}
          PYTHON_CHANGED: ${{ steps.filter.outputs.python }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger - running all tests"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            echo "Merge group - running all tests"
          else
            echo "Python test inputs changed: $PYTHON_CHANGED"
          fi

  zero-collection-guard:
    name: Check for zero-collection test files (blocking)
    # Copilot review round 3, PR #5344: this whole-tree guard examines every
    # file under testpaths regardless of diff, so it must not sit behind a
    # path filter (`.claude/rules/ci-scripts.md`: "The whole tree ... MUST
    # run"). It used to live inside the `test` job's `bulk` partition, which
    # is skipped whenever check-paths reports no Python-relevant diff,
    # letting a mainline push publish a stale green tick without measuring
    # the current tree. No `needs:`/`if:` here on purpose.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Check for zero-collection test files (blocking)
        run: uv run --frozen python scripts/validation/check_zero_collection_tests.py

  line-endings-guard:
    name: Check index line endings (blocking)
    # Issue #5475. Same reasoning as zero-collection-guard above, and the same
    # deliberate absence of `needs:`/`if:`. This guard reads every tracked
    # blob, so a path filter can report green without measuring.
    #
    # `.md` is NOT the example: the `python` filter carries `**/*.md`, so the
    # two incident handoffs would have set `python-changed` true and run the
    # `test` job. The gap is the text paths the filter omits. `.gitattributes`
    # applies `* text=auto eol=lf` to every tracked file; measured against the
    # filter, `**/*.xml` has no glob at all (7 tracked files) and only
    # `scripts/bootstrap-vm.sh` of the 16 tracked `.sh` files is listed, while
    # `.gitattributes` declares `*.sh text eol=lf`. A CRLF blob under any of
    # those leaves `python-changed` false and skips a filtered job.
    #
    # Both offending blobs arrived through the GraphQL createCommitOnBranch
    # API, which runs no local hook, so CI is the only place that producer is
    # observed.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Check index line endings (blocking)
        run: uv run --frozen python scripts/validation/check_index_line_endings.py

  context-output-guard:
    name: Check context outputs (blocking)
    # Issue #5836: the manifest is a whole-repository contract. Keep this job
    # outside check-paths so an unrelated diff cannot hide existing drift.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check complete context-output manifest (blocking)
        run: >-
          python3
          .claude/skills/context-optimizer/scripts/extract_and_index.py
          --check --manifest .project-toolkit/context-output-manifest.json

  count-ratchet-guard:
    name: Check whole-tree count ratchets (blocking)
    # Issue #5636, decision D13. The ruff and subprocess-encoding count
    # ratchets score every tracked Python file, so they are whole-tree checks
    # (`.claude/rules/ci-scripts.md`, "Path filters gate the diff, never the
    # tree"). This job has no `needs:` and no
    # `if:` on purpose, the same shape as zero-collection-guard above.
    #
    # This job's name is pinned in scripts/ci/ruleset_required_contexts.py and
    # and must match ruleset 11104075 (ci-scripts.md MUST 22 dual-name rollout).
    # `test-result` also needs this job, so "Run Python Tests" fails when a
    # ratchet fails.
    #
    # `uv run --frozen` pins ruff to the lockfile; an open-ended `ruff>=` could
    # fail the baseline on an unrelated PR after a rule change. BASE_REF stays
    # in env, so a ref name never reaches the script source, and the ratchet
    # receives the fixed literal FETCH_HEAD, never the ref name. Both ratchets
    # compare against a ref: without --base-ref, raising the baseline in the
    # change that adds the violations would pass as an improvement.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      # No --depth=1: count_ratchet.py reads a merge base, and a depth-limited
      # fetch would graft .git/shallow for the whole job.
      - name: Fetch the base ref
        run: git fetch origin "$BASE_REF"

      - name: Run ruff count ratchet (whole tree)
        run: uv run --frozen python scripts/ci/ruff_count_ratchet.py --base-ref FETCH_HEAD

      - name: Run subprocess encoding count ratchet (whole tree)
        run: uv run --frozen python scripts/ci/subprocess_encoding_count_ratchet.py --base-ref FETCH_HEAD

      # ADR-113 decision 2: persist this job's typed result for the promotion gate.
      - name: Upload promotion evidence
        if: always()
        uses: ./.github/actions/upload-validator-evidence
        with:
          validator: check_whole_tree_count_ratchets_blocking
          job-status: ${{ job.status }}

  test:
    name: "pytest (${{ matrix.partition }})"
    # ADR-101 requirement 1: no `needs:` and no job-level `if:`. The partitions
    # sit inside the required "Run Python Tests" chain, so a path filter must
    # not decide whether they run. A diff that matches no policy path still
    # runs every partition in full (run_pytest_selected.py falls back to the
    # full partition when no affected test is owned by it).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `checks: write` was here from the ADR-042 migration (953b4534d, PR #967)
    # and was never used: no step in this job publishes a check run, and
    # `git log -S test-reporter -- .github/workflows/pytest.yml` is empty across
    # the file's whole history. It is removed rather than kept, because until
    # ADR-101 item 7 pins a publishing App by `integration_id`, a required
    # status context is matched by name alone, so any job holding `checks: write`
    # on a `pull_request` trigger can publish a check run bearing a required
    # context's name from head-editable code. This job runs on every Python pull
    # request. CWE-269.
    permissions:
      contents: read
    env:
      NODE_OPTIONS: --use-system-ca
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: bulk
            coverage_file: artifacts/.coverage.bulk
            junit_file: artifacts/pytest-results.xml
          - partition: bulk-nested
            coverage_file: artifacts/.coverage.bulk-nested
            junit_file: artifacts/pytest-results-bulk-nested.xml
          - partition: bulk-nested-ci
            coverage_file: artifacts/.coverage.bulk-nested-ci
            junit_file: artifacts/pytest-results-bulk-nested-ci.xml
          - partition: mutation
            coverage_file: artifacts/.coverage.mutation
            junit_file: artifacts/pytest-results-mutation.xml
          - partition: safe-push
            coverage_file: artifacts/.coverage.safe-push
            junit_file: artifacts/pytest-results-safe-push.xml
          - partition: pr-autofix
            coverage_file: artifacts/.coverage.pr-autofix
            junit_file: artifacts/pytest-results-pr-autofix.xml

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      # Issue #2655: blocking parse gate. PR #2640 shipped PEP 758 syntax
      # (unparenthesized except tuples) that Python 3.14 accepts but 3.13 and
      # earlier reject; the CLI runs hooks under the host interpreter, so it
      # wedged on older hosts. Nothing caught it because the dev/CI target is
      # 3.14 (where it is valid), ruff E999 is report-only below and exempts the
      # generated src/copilot-cli mirrors, and pytest only fails when a collected
      # test imports the broken module. This step parses every tracked .py at the
      # declared support floor (pyproject requires-python) via ast feature_version
      # and blocks on any failure, even though this runner is 3.14. It is separate
      # from the ruff style backlog: a parse failure is a zero-false-positive
      # defect. Keep it BEFORE the ruff step and do NOT add continue-on-error.
      - name: Validate Python syntax (blocking)
        if: matrix.partition == 'bulk'
        run: python scripts/validation/validate_python_syntax.py

      - name: Validate AI review workflow budgets
        if: matrix.partition == 'bulk'
        run: python scripts/ci/validate_ai_review_budgets.py

      # Issue #2939: keep repo-wide ruff debt from blocking unrelated PRs while
      # failing new violations in changed Python files.
      - name: Run ruff ratchet (changed Python files)
        if: matrix.partition == 'bulk'
        # Same per-event base as the mypy ratchet below: HEAD^1 is the exact
        # base of the pull_request merge checkout, and merge_group.base_sha
        # keeps every batched PR in scope.
        env:
          RUFF_RATCHET_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before || 'HEAD~1' }}
        run: python scripts/ci/ruff_ratchet.py

      # mypy ran only in the pre-push hook and pre_pr.py, so a push that skipped
      # lefthook merged type errors unchecked. Same diff-line ratchet as the
      # hook: pre-existing errors print, errors on changed lines block.
      # Each mypy call has a 60s cap, but the calls run in series. The step cap
      # keeps a stall from eating the pytest steps' share of the job's 10 min.
      # Measured: 40 scripts/validation files with a cold cache took 6.7s.
      - name: Run mypy ratchet (changed Python files)
        if: matrix.partition == 'bulk'
        timeout-minutes: 3
        # Base per event. pull_request checks out GitHub's merge commit, whose
        # first parent can be newer than pull_request.base.sha; HEAD^1 is the
        # exact base, so newer main lines are never charged to the PR.
        # merge_group uses the group's base_sha so every batched PR is in
        # scope, not only the last one that HEAD~1 would cover.
        env:
          MYPY_RATCHET_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before || 'HEAD~1' }}
        run: python scripts/ci/mypy_ratchet.py

      - name: Check security suppressions in diff (pull request, issue 4061)
        if: matrix.partition == 'bulk' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # No --depth=1: a depth-limited fetch grafts .git/shallow for the job.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      - name: Check security suppressions in diff (non-PR, issue 4061)
        if: matrix.partition == 'bulk' && github.event_name != 'pull_request'
        env:
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          # No --depth=1: a depth-limited fetch grafts .git/shallow for the job.
          git fetch origin "$BASE_REF"
          uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-diff --base-ref FETCH_HEAD

      # Each matrix leg writes one statement-only coverage file. Bulk ignores
      # the two pin suites, mutation, and the two process-sensitive files
      # because those tests run in their own partition or pin step.
      # `-n auto` uses every logical CPU exposed by the runner. On push and
      # pull_request events the import graph narrows each partition to the
      # affected tests (issue #5050); merge_group, any fail-safe verdict, and
      # any partition with no affected test run the full partition, so coverage
      # combine always receives non-empty data. The full-vs-subset decision and
      # the partition argument lists live in the Python runner, not here, per
      # ADR-006.
      #
      # Both selection refs are immutable SHAs from the event payload, never a
      # branch name. The head one is why (issue #5378): on pull_request the
      # checkout above is `refs/pull/N/merge`, a synthetic commit whose first
      # parent is the current base-branch tip, so diffing `base.sha...HEAD`
      # attributes every base-branch commit made since `base.sha` to this pull
      # request. Observed on PR #5341, where an unrelated
      # `.github/workflows/claude.yml` entered the changed set and forced the
      # full suite. `head.sha` is the pull request's own tip and reproduces
      # GitHub's base-to-head file list. The `fetch-depth: 0` checkout above is
      # what makes both commits readable: it fetches every branch plus the
      # merge ref, whose second parent is `head.sha`. If either commit is
      # missing the git diff fails and the runner runs the full suite.
      - name: Run pytest
        id: run-pytest
        env:
          PYTEST_NON_TMP_ROOT: ${{ runner.temp }}/ai-agents-pytest
          COVERAGE_FILE: ${{ matrix.coverage_file }}
          PYTEST_SELECT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PYTEST_SELECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          uv run --frozen python scripts/ci/run_pytest_selected.py
          --partition ${{ matrix.partition }}
          --cov --cov-report=
          --junitxml=${{ matrix.junit_file }}

      # Issue #5610. The count-ratchet registry deadline is calibrated against
      # a wall-clock measurement, and a wall clock taken inside the `-n auto
      # --dist loadfile` shard above measures the runner's load, not the
      # registry: `main` went red at 19f257b5b with 87.7s against an 85s
      # deadline on a tree whose corpus had shrunk. The test skips unless
      # COUNT_RATCHET_TIMING_MEASUREMENT is 1, so this is the only place it
      # runs, and `-p no:xdist` keeps it alone on the runner. merge_group only:
      # once per merge, not once per push, and never on a PR shard.
      - name: Measure the count-ratchet registry (issue 5610)
        if: github.event_name == 'merge_group' && matrix.partition == 'bulk-nested'
        env:
          PYTEST_NON_TMP_ROOT: ${{ runner.temp }}/ai-agents-pytest
          COUNT_RATCHET_TIMING_MEASUREMENT: "1"
        run: >-
          uv run --frozen python -m pytest
          tests/ci/test_pre_pr_runs_lefthook_ratchets.py
          -p no:xdist
          -k test_the_real_registry_finishes_with_margin_inside_the_deadline

      # Issue #5382. Reads the JUnit report the step above already wrote, so it
      # runs no test of its own, and fails when a budgeted validator suite
      # exceeds the seconds recorded for it in [tool.slow-test-budget]. A
      # budgeted suite this partition did not run is absent from the report and
      # is not a violation.
      # The step name carries no "#": a plain scalar treats it as a comment
      # (ci-scripts.md item 20).
      - name: Enforce the slow-test budget (issue 5382)
        if: steps.run-pytest.outcome != 'skipped' && !cancelled()
        run: >-
          uv run --frozen python scripts/testing/slow_test_budget.py
          ${{ matrix.junit_file }}
          --budget pyproject.toml

      # Issue #1963: verdict.py's 100% branch gate needs all three of
      # test_ai_review.py, test_verdict.py, and test_quality_gate.py
      # (test_ai_review.py alone reports 63%). Collection stays broad; the
      # next step isolates the gate with coverage report --include.
      - name: Pin ai_review_common.verdict coverage collection (REQ-008-07)
        id: pin-verdict-collect
        if: matrix.partition == 'bulk' && steps.run-pytest.outcome != 'skipped' && !cancelled()
        env:
          COVERAGE_FILE: artifacts/.coverage.pin-verdict
        run: pytest tests/test_ai_review.py tests/test_verdict.py tests/test_quality_gate.py --cov --cov-branch --cov-report=

      # Isolated 100% branch gate for scripts/ai_review_common/verdict.py.
      - name: Enforce ai_review_common.verdict coverage at 100% (REQ-008-07)
        if: steps.pin-verdict-collect.outcome != 'skipped' && !cancelled()
        run: coverage report --data-file=artifacts/.coverage.pin-verdict --include=scripts/ai_review_common/verdict.py --fail-under=100

      # Issue #2063: module-name --cov fails for these file-path targets.
      # Collect broadly here, then isolate the file paths in the next step.
      - name: "Pin REQ-009 module coverage collection (PR #1989 user requirement)"
        id: pin-req009-collect
        if: matrix.partition == 'bulk' && steps.run-pytest.outcome != 'skipped' && !cancelled()
        env:
          COVERAGE_FILE: artifacts/.coverage.pin-req009
        run: |
          pytest \
            tests/skills/github/test_wait_for_unresolved_zero.py \
            --cov --cov-branch --cov-report=

      # Isolated 100% branch gate for the REQ-009 module.
      - name: "Enforce REQ-009 module coverage at 100% (PR #1989 user requirement)"
        if: steps.pin-req009-collect.outcome != 'skipped' && !cancelled()
        run: >-
          coverage report --data-file=artifacts/.coverage.pin-req009
          --include=.claude/skills/github/scripts/pr/wait_for_unresolved_zero.py
          --fail-under=100

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pytest-results-${{ matrix.partition }}
          path: artifacts/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  coverage:
    name: Combine Python coverage
    needs: test
    if: "!cancelled() && needs.test.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Download partition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pytest-results-*
          merge-multiple: true
          path: artifacts

      # Coverage.py cannot directly combine line rows with branch arc rows.
      # The helper projects branch inputs to executed lines before union.
      - name: Combine coverage data
        run: |
          uv run --frozen python scripts/ci/combine_pin_coverage.py \
            --main-data artifacts/.coverage.bulk \
            --main-data artifacts/.coverage.bulk-nested \
            --main-data artifacts/.coverage.bulk-nested-ci \
            --main-data artifacts/.coverage.mutation \
            --main-data artifacts/.coverage.safe-push \
            --main-data artifacts/.coverage.pr-autofix \
            --pin-data artifacts/.coverage.pin-verdict \
            --pin-data artifacts/.coverage.pin-req009 \
            --output-data artifacts/.coverage.combined
          uv run --frozen coverage xml --data-file=artifacts/.coverage.combined -o artifacts/coverage.xml

      - name: Upload combined coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-results
          path: artifacts/
          include-hidden-files: true
          overwrite: true
          retention-days: 7

  # Test duration trend. Reads the JUnit reports the partitions already wrote,
  # writes per-partition wall time and the slowest modules to the job summary,
  # and compares per-module seconds with the median of earlier main runs. A
  # module or the suite that crosses both the ratio and the seconds threshold
  # fails this job and raises a warning annotation. The history rides in the
  # Actions cache, saved only from pushes to main, so a pull request reads the
  # main baseline and never writes it. ADR-015 caps artifact retention at
  # 7 days, which is why the history is not an artifact. Two overlapping main
  # runs restore the same history, so the later save drops one snapshot; the
  # median absorbs a missing sample. Not a dependency of test-result: runner
  # timing noise must not block a merge.
  test-durations:
    name: Test duration trend
    needs: test
    if: "!cancelled() && needs.test.result == 'success'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Download partition artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: pytest-results-*
          merge-multiple: true
          path: artifacts

      - name: Restore main duration history
        id: restore-history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: test-durations/history.json
          key: test-duration-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: test-duration-history-

      - name: Report test duration trend
        id: duration-trend
        env:
          RUN_SHA: ${{ github.sha }}
          HISTORY_KEY: ${{ steps.restore-history.outputs.cache-matched-key }}
        run: >-
          echo "history restored from cache key: ${HISTORY_KEY:-none}" &&
          uv run --frozen python scripts/testing/duration_trend.py
          artifacts/pytest-results*.xml
          --history test-durations/history.json
          --write-history test-durations/history.json
          --snapshot-out test-durations/snapshot.json
          --sha "$RUN_SHA"
          --summary "$GITHUB_STEP_SUMMARY"

      # The script writes the history even when it reports a regression, so
      # a slowdown that lands on main joins the baseline instead of failing
      # every later run. hashFiles is empty only when nothing was restored and
      # the script could not write; otherwise an exit 3 re-saves the restored
      # history unchanged.
      - name: Save main duration history
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main'
          && hashFiles('test-durations/history.json') != '' && !cancelled()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: test-durations/history.json
          key: test-duration-history-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload duration report
        if: steps.duration-trend.outcome != 'skipped' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-durations
          path: test-durations/
          retention-days: 7

  # The only job that publishes the required "Run Python Tests" context. It
  # replaces a same-named pair (this job plus a skip-tests pass-through that
  # answered when a path filter said no Python inputs changed). ADR-101
  # requirement 1: the verdict comes from the chain's own results, and every
  # dependency must have succeeded. A skipped dependency is a failure here, so
  # nothing can turn the context green without the tests having run.
  test-result:
    name: Run Python Tests
    needs:
      - test
      - coverage
      - zero-collection-guard
      - line-endings-guard
      - context-output-guard
      - count-ratchet-guard
    # !cancelled() rather than always(): a superseded run leaves its
    # dependencies 'cancelled', and always() would turn that into a red
    # required check on the PR head (Issue #5097). !cancelled() still runs on
    # failed and skipped dependencies, so the real failure signal survives.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/require_job_results.py
            scripts/__init__.py
            scripts/validation/__init__.py
            scripts/validation/models.py
            scripts/validation/evidence.py
            scripts/validation/promotion_evidence.py
            scripts/validation/emit_validator_evidence.py
            .github/actions/upload-validator-evidence

      - name: Require test, coverage, and repository guard success
        env:
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          ZERO_COLLECTION_RESULT: ${{ needs.zero-collection-guard.result }}
          LINE_ENDINGS_RESULT: ${{ needs.line-endings-guard.result }}
          CONTEXT_OUTPUT_RESULT: ${{ needs.context-output-guard.result }}
          COUNT_RATCHET_RESULT: ${{ needs.count-ratchet-guard.result }}
        run: >-
          python scripts/ci/require_job_results.py
          --check TEST_RESULT success "test job failed or was cancelled: {value}"
          --check COVERAGE_RESULT success "coverage job failed or was cancelled: {value}"
          --check ZERO_COLLECTION_RESULT success "zero-collection-guard failed or was cancelled: {value}"
          --check LINE_ENDINGS_RESULT success "line-endings-guard failed or was cancelled: {value}"
          --check CONTEXT_OUTPUT_RESULT success "context-output-guard failed or was cancelled: {value}"
          --check COUNT_RATCHET_RESULT success "count-ratchet-guard failed or was cancelled: {value}"

      # ADR-113 decision 2: persist this job's typed result for the promotion gate.
      - name: Upload promotion evidence
        if: always()
        uses: ./.github/actions/upload-validator-evidence
        with:
          validator: run_python_tests
          job-status: ${{ job.status }}

  security:
    name: Python Security Checks
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Run pip-audit
        run: |
          # Keep the audited environment on a pip release pip-audit reports
          # clean. This pin has moved once before: issue #2438 set it to
          # 26.1.2 to escape PYSEC-2026-196, and 26.1.2 has since become the
          # vulnerable version under PYSEC-2026-3721, whose fix is 26.2
          # (issue #5222). Expect it to move again; the version below is the
          # only place that decides which pip runs, so keep every mention of
          # it in this block moving with it.

          # Ignored CVEs (re-evaluate when upstream releases a fix):
          #   CVE-2026-4539: pygments 2.19.2, no fix available. This project
          #     pins 2.19.2, so a clean virtualenv (which resolves 2.21.0)
          #     says nothing about it; retiring this belongs to issue #1778,
          #     measured against the real tree.
          #
          # The two historical pip findings, CVE-2026-3219 and CVE-2026-6357,
          # were ignored only while the runner still carried pre-26.1 pip
          # metadata. Run 32500970183 upgraded to 26.2 and pip-audit reported
          # a single ignored vulnerability, so those two ignores now suppress
          # nothing and would hide the findings if they ever recurred.
          python -m pip install --upgrade "pip==26.2"
          pip-audit --ignore-vuln CVE-2026-4539

      # Issue #2808: `|| true` masked both bandit crashes and genuine findings,
      # turning this step green regardless. Gate on high severity AND high
      # confidence so real high-risk findings fail CI, scoped off test-only
      # false positives. SARIF output feeds GitHub code scanning.
      # Issue #6028: a pip-audit finding in a transitive pin skipped Bandit on
      # every pull request. Bandit scans this repo's code, so it runs anyway.
      - name: Run Bandit
        if: ${{ !cancelled() }}
        run: |
          bandit -r .claude/ scripts/ \
            -x '*/tests/*,*/test/*' \
            -f sarif \
            -o bandit.sarif \
            --severity-level high \
            --confidence-level high

      - name: Upload Bandit SARIF
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: Upload Bandit results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: bandit-results
          path: bandit.sarif
          retention-days: 7

  # Tests marked @pytest.mark.windows_path exercise behavior that differs between
  # Windows and POSIX: path separators, PowerShell script resolution, Git's
  # Windows trace behavior, atomic-write durability, and install-tree layout.
  # The marker is the discovery mechanism. Do not hardcode test file paths.
  # run_pytest_windows.py keeps that property: it discovers the candidate
  # modules by scanning for the marker's name and hands only those to pytest,
  # so a new marked file still needs no edit here. Issue #5380: passing the
  # marker alone made pytest import all 33,326 items to select 1,115.
  test-windows-pwsh:
    name: Run Windows path-contract tests (pytest.mark.windows_path)
    needs: check-paths
    if: needs.check-paths.outputs.python-changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Run Windows path-contract tests
        shell: pwsh
        env:
          UV_PYTHON: '3.14'
        run: uv run --frozen python scripts/ci/run_pytest_windows.py -v

  main-failure-alert:
    name: Main failure alert
    needs:
      - check-paths
      - test
      - test-result
      - security
      - test-windows-pwsh
      - context-output-guard
      - count-ratchet-guard
    # !cancelled() rather than always(): the alert script treats a 'cancelled'
    # dependency as a failure, so a cancelled main run would file a bogus
    # "Python Tests failed on main" issue (Issue #5097).
    if: >-
      !cancelled() && github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify failed Python Tests on main
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/ci/main_pytest_failure_alert.py
