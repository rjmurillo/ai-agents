# taste-lint: ignore file-size
name: PR Maintenance

on:
  schedule:
    - cron: '0 * * * *'  # Hourly at minute 0 (UTC)
  workflow_dispatch:     # Manual trigger
    inputs:
      max_prs:
        description: 'Max PRs to discover'
        type: number
        default: 20

# Issue #2520: least privilege. Both jobs are read-only. Job-level blocks below.
permissions:
  contents: read

concurrency:
  group: pr-maintenance
  cancel-in-progress: false

env:
  PR_MAX_PRS: ${{ inputs.max_prs || 20 }}

jobs:
  # Job 1: Discover PRs needing attention
  discover-prs:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    # The discovery query reads statusCheckRollup, so github.token needs
    # checks and statuses too.
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      summary-json: ${{ steps.discover.outputs.summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check API rate limit
        id: ratelimit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/test_rate_limit.py

      - name: Discover PRs needing attention
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result=$(python3 .github/scripts/invoke_pr_maintenance.py --max-prs "$PR_MAX_PRS" --output-json)
          echo "summary=$result" >> "$GITHUB_OUTPUT"

          echo "Found $(echo "$result" | jq -r '.summary.total') open PRs"
          echo "Action Required: $(echo "$result" | jq -r '.summary.actionRequired')"
          echo "With Conflicts: $(echo "$result" | jq '[.prs[] | select(.hasConflicts == true)] | length')"

      - name: Write step summary
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_JSON: ${{ steps.discover.outputs.summary }}
        run: python3 scripts/ci/write_pr_discovery_summary.py

      # Issue #4316: a commit pushed after its PR merged is dropped silently.
      # Warn, never block: exit 1 means findings, and a finding is for a human
      # to judge, not a reason to fail the sweep.
      - name: Detect orphan commits on merged PR branches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci/report_advisory_result.py run
          --validator orphan-commit-report
          --scope "commits pushed to merged PR branches"
          --findings-exit 1
          -- python3 scripts/maintenance/detect_orphan_commits.py --limit 50

  # Job 2: Post-processing summary
  summarize:
    needs: discover-prs
    if: always()
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Final summary
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_JSON: ${{ needs.discover-prs.outputs.summary-json }}
        run: python3 scripts/ci/write_pr_maintenance_summary.py

      # Issue #4355: three of six sampled open PRs were already fixed on main
      # and nothing said so until someone rebased. Report only; the signal has
      # a known false positive (#4163) and needs a human to confirm.
      - name: Report PR supersession candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_pr_supersession.py >> "$GITHUB_STEP_SUMMARY"
