# Validate Rule and Skill Activation Coverage (Issue #3457)
#
# Fails when a rule (.claude/rules/*.md) or skill (.claude/skills/*/SKILL.md)
# has no activation scenario and is not listed in
# scripts/validation/rule_activation_coverage_baseline.json, or when a scenario
# points at a deleted artifact. The ratchet only blocks NEW uncovered drift;
# baselined debt is allowed until a scenario is added.
#
# Route-change gate (issue #6291): on pull requests, a new or changed row in
# the autoplan `Intent | Route` table must come with an edited scenario in
# tests/evals/skill-scenarios/autoplan.json. The deterministic autoplan route
# eval then runs as a fast subset with no model call. Budget: 60 seconds for
# the subset step (about 2 seconds measured). The full model suite runs on a
# schedule in autoplan-route-eval.yml.
#
# Fail-closed: a missing inventory, an unparseable baseline, or a malformed
# scenario exits non-zero. An unmeasured artifact must never read as clean.
#
# Uses dorny/paths-filter: fires on all PRs to satisfy the required-check
# contract, skips with a passing status when no relevant files changed. No
# logic in YAML (ADR-006); the check step calls a Python entry point.

name: Validate Rule Activation Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  check-changes:
    name: Check for Rule, Skill, or Scenario Changes
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should-run-coverage: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.coverage }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check path filters
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            coverage:
              - '.claude/rules/**'
              - '.claude/skills/**/SKILL.md'
              - 'tests/evals/rule-scenarios/**'
              - 'tests/evals/skill-scenarios/**'
              - 'scripts/validation/check_rule_activation_coverage.py'
              - 'scripts/validation/report_rule_activation_states.py'
              - 'scripts/validation/check_route_scenario_coverage.py'
              - 'scripts/eval/eval_autoplan_routes.py'
              - 'tests/evals/autoplan-routes/**'
              - '.claude/skills/autoplan/scripts/**'
              - 'scripts/validation/rule_activation_coverage_baseline.json'
              - '.github/workflows/validate-rule-activation-coverage.yml'

  validate-coverage:
    name: Validate Rule Activation Coverage
    needs: check-changes
    if: needs.check-changes.outputs.should-run-coverage == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Check rule and skill activation coverage ratchet
        run: python3 scripts/validation/check_rule_activation_coverage.py

      - name: Require a scenario for each new or changed autoplan route
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: uv run --frozen python scripts/validation/check_route_scenario_coverage.py --base-ref "origin/$BASE_REF"

      - name: Run the deterministic autoplan route subset (budget 60 seconds)
        timeout-minutes: 1
        run: uv run --frozen python scripts/eval/eval_autoplan_routes.py

      - name: Report per-artifact evidence states
        run: python3 scripts/validation/report_rule_activation_states.py --output "$RUNNER_TEMP/rule-activation-states.json"

      - name: Upload evidence-state report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rule-activation-states
          path: ${{ runner.temp }}/rule-activation-states.json
          if-no-files-found: error
          retention-days: 7

  skip-validation:
    name: Skip Validation (No Coverage-Relevant Changes)
    needs: check-changes
    if: needs.check-changes.outputs.should-run-coverage != 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - name: Skip message
        run: |
          echo "Rule activation coverage validation skipped - no relevant files changed"
