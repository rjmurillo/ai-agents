# Validate Generated Agent Files
#
# Ensures generated agent files haven't been edited directly.
# Regenerates all agents from templates and fails if committed files differ.
#
# Local developers and AI agents can run the same validation using:
#   uv run python build/generate_agents.py --validate

name: Validate Generated Agents

on:
  push:
    branches:
      - main
    # NO paths filter - use dorny/paths-filter internally to satisfy required checks
  pull_request:
    branches:
      - main
    # NO paths filter - use dorny/paths-filter internally to satisfy required checks
  merge_group:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: validate-agents-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Check if relevant files changed using paths-filter
  check-paths:
    name: Check Paths
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      should-run-agents: ${{ steps.determine.outputs.should-run-agents }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Check for relevant file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        with:
          filters: |
            agents:
              - 'templates/**'
              - 'docs/agent-catalog.md'
              - 'src/vs-code-agents/**'
              - 'src/copilot-cli/**'
              - 'src/claude/**'
              - '.claude-plugin/marketplace.json'
              - '.github/plugin/marketplace.json'
              - '.claude/.claude-plugin/plugin.json'
              - 'build/generate_agents.py'
              - 'build/generate_agents_common.py'
              - 'build/generate_agent_catalog.py'
              - 'build/scripts/**'
              - 'scripts/validation/**'
              - '.claude/**'
              - 'lefthook.yml'
              - '.config/lefthook.yml'
              - '.githooks/**'
              - '.github/agents/**'
              - '.github/actions/**'
              - '.github/instructions/**'
              - '.github/prompts/**'
              - '.github/workflows/**'
              - 'tests/ci/test_validation_scripts_are_reachable.py'
              - 'tests/ci/test_frontmatter_gate_paths_filter.py'

      - name: Determine if validation should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: agents
          FORCE_RUN_EVENTS: merge_group
          OUTPUT_NAME: should-run-agents
        run: python3 scripts/workflows/determine_should_run_from_filters.py

  validate:
    name: Validate Generated Files
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    needs: check-paths
    permissions:
      contents: read

    steps:
      - name: Check if validation needed
        id: should-run
        env:
          SHOULD_VALIDATE: ${{ needs.check-paths.outputs.should-run-agents }}
        run: |
          if [ "$SHOULD_VALIDATE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No agent files changed - skipping validation"
          fi

      - name: Checkout repository
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          # fetch-depth: 0 so the install-parity step can resolve
          # origin/<base> and the push-event before-SHA without a
          # follow-up fetch. The validator diffs against a base ref; a
          # shallow checkout leaves that ref unresolvable.
          fetch-depth: 0

      - name: Set up Python
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Set up uv
        if: steps.should-run.outputs.skip != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate script reachability
        if: steps.should-run.outputs.skip != 'true'
        run: uv run python -m pytest -q tests/ci/test_validation_scripts_are_reachable.py

      # This guard belongs here rather than only in the default pytest run.
      # It asserts that this workflow's own paths filter still covers every
      # tree the frontmatter gate scans, so the regression it catches is a
      # YAML-only edit to the filter above. pytest.yml does run this file as
      # part of the full suite, but its trigger list is Python-shaped and does
      # not include this workflow, so a YAML-only narrowing would skip
      # pytest.yml entirely and the guard would never fire on the one change
      # it exists to catch. Running it here closes that hole, because this
      # workflow triggers on .github/workflows/**.
      - name: Validate frontmatter gate paths filter
        if: steps.should-run.outputs.skip != 'true'
        run: uv run python -m pytest -q tests/ci/test_frontmatter_gate_paths_filter.py

      - name: Validate capability matrix references
        if: steps.should-run.outputs.skip != 'true'
        run: uv run python build/scripts/validate_agent_matrix_refs.py

      - name: Regenerate and validate agent files
        if: steps.should-run.outputs.skip != 'true'
        run: |
          echo "Running agent generation in validation mode..."
          uv run python build/generate_agents.py --validate

      - name: Build-all staleness check (REQ-003-005)
        if: steps.should-run.outputs.skip != 'true'
        # Run the M3 orchestrator in --check mode. Fails (exit 2) if any
        # generator output is stale relative to the source. Catches the
        # "forgot to regenerate skills/agents" class of error before merge.
        run: |
          echo "Running build_all.py --check..."
          uv run python build/scripts/build_all.py --check

      - name: Review-axes drift check (REQ-008-03)
        if: steps.should-run.outputs.skip != 'true'
        # Rehomed from the retired ai-pr-quality-gate.yml. The canonical
        # review-axis prompts under .github/prompts/pr-quality-gate-*.md and the
        # generated copies under .claude/skills/review/references/ outlive that
        # workflow: the local /review skill reads them. This job is what keeps
        # the two in parity, so it moves here rather than being deleted with the
        # gate. This workflow's paths filter already covers build/scripts/**,
        # .github/prompts/**, and .claude/**.
        run: uv run python build/scripts/run_drift_check_ci.py

      - name: Validate platform template schema (REQ-003-002)
        if: steps.should-run.outputs.skip != 'true'
        run: uv run python build/scripts/validate_templates_schema.py

      - name: "Validate plugin frontmatter self-containment (issue #3565)"
        if: steps.should-run.outputs.skip != 'true'
        # A shipped `description` loads into every consumer session, so a path
        # into an upstream-only directory never resolves for them. The prose
        # ratchet scans only .claude/skills and does not know `docs/`, which is
        # how PR #3497 landed `docs/agent-metrics.md` two PRs after the rule
        # shipped. See .claude/rules/plugin-self-containment.md.
        run: uv run python scripts/validation/check_plugin_frontmatter_self_containment.py

      - name: Validate agent capability matrix references
        if: steps.should-run.outputs.skip != 'true'
        # Matrix rows are model-routing contracts. A row that names an agent
        # absent from its own install tree points the model at a dead route.
        run: uv run python build/scripts/validate_agent_matrix_refs.py

      - name: Install-parity check (changed-together siblings)
        if: steps.should-run.outputs.skip != 'true'
        # Catches the class of drift the build-all generator cannot:
        # the install copies under .claude/agents/ and .github/agents/
        # are hand-maintained self-host copies and must move together
        # with the shared template under templates/agents/ and the three
        # vendored copies under src/. PR #2087 (qa) and PR #2083
        # (orchestrator) are the regressions this gate prevents.
        #
        # Per ADR-006 (Thin Workflows, Testable Modules), the fetch +
        # base-ref resolution + validator invocation live in
        # scripts/validation/run_install_parity_ci.py. The YAML step
        # passes inputs via environment variables and runs one command.
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          uv run python scripts/validation/run_install_parity_ci.py

      - name: Plugin lib sync check (M7-T1)
        if: steps.should-run.outputs.skip != 'true'
        # `scripts/hook_utilities/` and `scripts/github_core/` are the
        # canonical sources; `.claude/lib/` carries plugin-distributed
        # copies with relative imports. The sync script has a --check
        # mode that exits 1 on any drift between source and copy.
        # Without this gate, a contributor could add a function to
        # scripts/hook_utilities/ without running the sync script and
        # the lib copy would silently fall behind.
        run: |
          echo "Running sync_plugin_lib.py --check..."
          uv run python scripts/sync_plugin_lib.py --check

      - name: "Plugin manifest description count check (Issue #3651)"
        if: steps.should-run.outputs.skip != 'true'
        # One invariant: no description in either marketplace file or any plugin
        # manifest may embed a component count, because nothing recomputes it and
        # it goes stale on the next component change (PR #2187).
        # The version-parity half (Issue #2222) was retired with ADR-092: the
        # manifests carry no version, so there is nothing to hold in parity.
        # Exits 1 on staleness, 2 on malformed input, 0 when it holds.
        run: |
          echo "Running check_plugin_manifest_parity.py..."
          uv run python build/scripts/check_plugin_manifest_parity.py

      - name: Validate GitHub Actions SHA Pinning
        if: steps.should-run.outputs.skip != 'true'
        shell: bash
        run: |
          echo "Validating GitHub Actions SHA pinning..."
          uv run python scripts/validation/sha_pinning.py --ci

      - name: "Validate Copilot agent frontmatter (issues #2491-#2497, #2500)"
        if: steps.should-run.outputs.skip != 'true'
        # Parse every .github/agents/*.agent.md frontmatter as a YAML loader
        # would. An unquoted plain-scalar description that embeds colon-bearing
        # examples makes Copilot fail to load the agent; this gate blocks that
        # class in CI (not only the local pre_pr gate). Exit 1 on malformed.
        run: |
          echo "Validating Copilot agent frontmatter..."
          uv run python scripts/validation/validate_copilot_agent_frontmatter.py
          uv run python scripts/validation/validate_argument_hint.py
          uv run python scripts/validation/agent_registry.py

      - name: Show diff on failure
        if: failure() && steps.should-run.outputs.skip != 'true'
        run: uv run python scripts/ci/show_generated_agent_diff.py
