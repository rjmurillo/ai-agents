# Validate Vendor Portability (Issue #2050)
#
# Fails when a NEW skill script under .claude/skills/ hard-codes an
# upstream-only path (.agents/ or .claude/lib/) without routing through the
# portability helper at .claude/lib/paths.py. Pre-existing offenders are
# tracked in scripts/validation/vendor_portability_baseline.txt and allowed;
# the ratchet only blocks regressions.
#
# These ratchets inspect the whole repository tree. Every supported event must
# run them because a per-change path filter can report green without measuring.

name: Validate Vendor Portability

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  validate-portability:
    name: Validate Vendor Portability
    runs-on: ubuntu-26.04-arm
    # Raised from 3 when the checkout went full-depth (issue #6506). Checkout
    # time was not measured on the runner; lower it if runs stay well under.
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The prose ratchet reads its ceiling from origin/<base>, which needs
          # the fork point of HEAD and the base (issue #6506). A depth-1 clone
          # has neither the ref nor a merge base to name.
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check for new vendor-portability offenders
        run: python3 scripts/validation/check_vendor_portability.py

      - name: Check skill script portability ratchet
        run: python3 -m scripts.validation.check_skill_portability

      - name: "Check for new bare-exec skill-path offenders (issue #2838)"
        run: uv run --frozen python scripts/validation/check_skill_md_exec_portability.py

      # Issue #6506: without --base-ref the baseline in the PR head is the only
      # ceiling, so a PR could raise it in the commit that adds the references.
      # With it, a count above what the base branch recorded fails. The
      # full-depth checkout above already holds origin/<base>. Push and dispatch
      # events carry no base_ref, and this workflow triggers only on main, so
      # 'main' backs it. default_branch would resolve to master under local act.
      - name: Check skill prose portability ratchet
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: uv run --frozen python scripts/validation/check_skill_md_portability.py --base-ref "origin/$BASE_REF"

      - name: Check skill resolver anchoring
        run: python3 scripts/validation/check_skill_resolver_anchoring.py

      - name: Check skill contract test binding
        run: python3 scripts/validation/check_skill_contract_tests.py

      - name: "Check plugin-root skill invocations use bare python3 (issue #5949)"
        run: python3 scripts/validation/check_plugin_root_interpreter.py

      - name: "Check ADR-107 projection invariants 6 and 8 (issue #5687)"
        run: python3 scripts/validation/check_projection_invariants.py

      - name: Show remediation on failure
        if: failure()
        run: |
          echo ""
          echo "=== Vendor Portability Validation Failed ==="
          echo ""
          echo "One of four ratchets failed:"
          echo ""
          echo "1. A skill SCRIPT under .claude/skills/ hard-codes an"
          echo "   upstream-only path (.agents/ or .claude/lib/) without"
          echo "   routing through the portability helper."
          echo "   Fix via .claude/lib/paths.py:"
          echo "     - resolve_artifact_root() for write paths"
          echo "     - resolve_skill_resource() for read paths"
          echo "   Baseline: scripts/validation/vendor_portability_baseline.txt"
          echo "   Update:   python3 scripts/validation/check_vendor_portability.py --update-baseline"
          echo ""
          echo "2. A skill script exceeds its upstream-path baseline."
          echo "   Baseline: scripts/validation/skill_portability_baseline.json"
          echo "   Update:   python3 -m scripts.validation.check_skill_portability --update-baseline"
          echo ""
          echo "3. A skill Markdown file invokes a bare '.claude/skills/...' script"
          echo "   (issue #2838). This covers SKILL.md, references/**/*.md,"
          echo "   and scripts/README-*.md under each skill root. That path does"
          echo "   not exist in a vendored plugin install. Resolve the root through"
          echo "   a plugin-root env var with a source fallback:"
          # shellcheck disable=SC2016
          echo '     SCRIPTS_DIR="${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/..."'
          # shellcheck disable=SC2016
          echo '     python3 "$SCRIPTS_DIR/script.py"'
          echo "   Or declare an intentional dependency with the marker"
          echo "     <!-- vendor-portability-exec: <reason> -->"
          echo "   Baseline: scripts/validation/skill_md_exec_portability_baseline.json"
          echo "   Update:   python3 scripts/validation/check_skill_md_exec_portability.py --update-baseline"
          echo ""
          echo "4. A skill Markdown file contains a prose reference to an"
          echo "   upstream-only runtime path (.agents/, .project-toolkit/, .claude/lib/, .claude/review-axes/)"
          echo "   without an opt-out marker (issue #2050)."
          echo "   To declare an intentional dependency, add the marker:"
          echo "     <!-- vendor-portability: <reason> -->"
          echo "   Baseline: scripts/validation/skill_md_portability_baseline.json"
          echo "   Update:   python3 scripts/validation/check_skill_md_portability.py --update-baseline"
          echo ""
          echo "5. A plugin-root skill invocation used something other than bare"
          echo "   python3 (e.g. 'uv run python'), or named a target with a"
          echo "   non-stdlib import (issue #5949). A vendored plugin install has"
          echo "   no uv lock file and no third-party dependencies installed."
          echo "   Use the canonical form:"
          # shellcheck disable=SC2016
          echo '     python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/.../script.py"'
          echo "   Or declare an intentional exception with the marker"
          echo "     plugin-root-interpreter: <reason>"
          echo "   No baseline: every offense fails."
          echo ""
          echo "6. A Copilot CLI projection of push-pr or security-scan changed the"
          echo "   allowed-tools set (ADR-107 invariant 6) or the Exit Codes table"
          echo "   (invariant 8) of its Claude source (issue #5687). Fix the source"
          echo "   or the transform, then regenerate:"
          echo "     uv run python build/scripts/build_all.py"
          echo "   No baseline: every difference fails."
          echo ""
          echo "See issues #2050, #2838, #5687, and #5949 for context."

  # Issue #5420: `.agents/` keeps only read-only canonical inputs, and agent
  # write targets live under `.project-toolkit/`. A separate job so the
  # portability job's step list stays the six validators pre_pr mirrors
  # (tests/validation/test_pre_pr_covers_vendor_portability.py); pre_pr runs
  # this gate in-process as "Legacy .agents Write Targets".
  validate-agents-write-targets:
    name: Validate .agents Write Targets
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Check .agents write targets
        run: uv run --frozen python scripts/validation/check_agents_write_targets.py
