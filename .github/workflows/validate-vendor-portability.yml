# Validate Vendor Portability (Issue #2050)
#
# Fails when a NEW skill script under .claude/skills/ hard-codes an
# upstream-only path (.agents/ or .claude/lib/) without routing through the
# portability helper at .claude/lib/paths.py. Pre-existing offenders are
# tracked in scripts/validation/vendor_portability_baseline.txt and allowed;
# the ratchet only blocks regressions.
#
# These ratchets inspect the whole repository tree. Every supported event must
# run them because a per-change path filter can report green without measuring.

name: Validate Vendor Portability

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  validate-portability:
    name: Validate Vendor Portability
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Check for new vendor-portability offenders
        run: python3 scripts/validation/check_vendor_portability.py

      - name: Check skill script portability ratchet
        run: python3 -m scripts.validation.check_skill_portability

      - name: "Check for new bare-exec skill-path offenders (issue #2838)"
        run: uv run --frozen python scripts/validation/check_skill_md_exec_portability.py

      - name: Check skill prose portability ratchet
        run: uv run --frozen python scripts/validation/check_skill_md_portability.py

      - name: Check skill resolver anchoring
        run: python3 scripts/validation/check_skill_resolver_anchoring.py

      - name: Check skill contract test binding
        run: python3 scripts/validation/check_skill_contract_tests.py

      - name: Show remediation on failure
        if: failure()
        run: |
          echo ""
          echo "=== Vendor Portability Validation Failed ==="
          echo ""
          echo "One of four ratchets failed:"
          echo ""
          echo "1. A skill SCRIPT under .claude/skills/ hard-codes an"
          echo "   upstream-only path (.agents/ or .claude/lib/) without"
          echo "   routing through the portability helper."
          echo "   Fix via .claude/lib/paths.py:"
          echo "     - resolve_artifact_root() for write paths"
          echo "     - resolve_skill_resource() for read paths"
          echo "   Baseline: scripts/validation/vendor_portability_baseline.txt"
          echo "   Update:   python3 scripts/validation/check_vendor_portability.py --update-baseline"
          echo ""
          echo "2. A skill script exceeds its upstream-path baseline."
          echo "   Baseline: scripts/validation/skill_portability_baseline.json"
          echo "   Update:   python3 -m scripts.validation.check_skill_portability --update-baseline"
          echo ""
          echo "3. A skill Markdown file invokes a bare '.claude/skills/...' script"
          echo "   (issue #2838). This covers SKILL.md, references/**/*.md,"
          echo "   and scripts/README-*.md under each skill root. That path does"
          echo "   not exist in a vendored plugin install. Resolve the root through"
          echo "   a plugin-root env var with a source fallback:"
          # shellcheck disable=SC2016
          echo '     SCRIPTS_DIR="${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/..."'
          # shellcheck disable=SC2016
          echo '     python3 "$SCRIPTS_DIR/script.py"'
          echo "   Or declare an intentional dependency with the marker"
          echo "     <!-- vendor-portability-exec: <reason> -->"
          echo "   Baseline: scripts/validation/skill_md_exec_portability_baseline.json"
          echo "   Update:   python3 scripts/validation/check_skill_md_exec_portability.py --update-baseline"
          echo ""
          echo "4. A skill Markdown file contains a prose reference to an"
          echo "   upstream-only runtime path (.agents/, .claude/lib/, .claude/review-axes/)"
          echo "   without an opt-out marker (issue #2050)."
          echo "   To declare an intentional dependency, add the marker:"
          echo "     <!-- vendor-portability: <reason> -->"
          echo "   Baseline: scripts/validation/skill_md_portability_baseline.json"
          echo "   Update:   python3 scripts/validation/check_skill_md_portability.py --update-baseline"
          echo ""
          echo "See issues #2050 and #2838 for context."
