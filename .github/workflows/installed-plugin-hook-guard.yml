name: Installed Plugin Hook Guard
# Structural regression gate for #4672: verifies the installed plugin's hooks
# allow tool calls from a consumer environment, on all three target platforms.
# Includes "vanilla" rows that genuinely lack Python, proving the degraded path.

# Deliberately NOT path-filtered. This guard protects a customer-facing
# failure mode that has recurred three times and cost three uninstalls
# (#4672). A paths filter would leave it silent for changes that break the
# hooks indirectly, for example an edit to a lib module, a generator, an
# action, or a dependency pin. A path-filtered required check also never
# reports on unrelated pull requests, which stalls merges rather than
# guarding anything. Cost is a few minutes per run; a missed regression
# costs a customer.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: plugin-hook-guard-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  hook-positive:
    name: Hook allows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/test-installed-plugin-hooks
        with:
          plugin-source: src/copilot-cli
          negative-env: 'false'

  hook-negative-env:
    name: Hook fail-open (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/test-installed-plugin-hooks
        with:
          plugin-source: src/copilot-cli
          negative-env: 'true'

  # Truly vanilla Linux: minimal container with NO Python installed.
  # Proves the hook degrades gracefully rather than blocking.
  vanilla-linux:
    name: Vanilla Linux (no Python)
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim@sha256:362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143  # bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Assert precondition - no Python present
        shell: bash
        run: |
          # PRECONDITION: this row exists to test the no-Python path.
          # If the base image ever ships Python, this row must fail loudly
          # so it does not silently become a non-vanilla row.
          if command -v python3 >/dev/null 2>&1; then
            echo "FATAL: python3 found on vanilla image. Row is not vanilla."
            exit 1
          fi
          if command -v python >/dev/null 2>&1; then
            echo "FATAL: python found on vanilla image. Row is not vanilla."
            exit 1
          fi
          echo "PRECONDITION PASSED: no Python interpreter on PATH"

      - name: Install jq for JSON parsing
        shell: bash
        run: |
          # jq only. Do NOT install Python here: this row's entire value is
          # that no interpreter is present, and the precondition above would
          # start failing if that changed.
          apt-get update -qq
          apt-get install -y --no-install-recommends jq >/dev/null
          jq --version
          if command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1; then
            echo "FATAL: installing jq pulled in Python. Row is no longer vanilla."
            exit 1
          fi

      - name: Materialize installed plugin
        shell: bash
        run: |
          INSTALL_ROOT="${RUNNER_TEMP:-/tmp/runner}/installed-plugins/ai-agents/project-toolkit"
          mkdir -p "${INSTALL_ROOT}"
          cp -r src/copilot-cli/* "${INSTALL_ROOT}/"
          cp -r src/copilot-cli/.claude-plugin "${INSTALL_ROOT}/"
          echo "INSTALL_ROOT=${INSTALL_ROOT}" >> "$GITHUB_ENV"

      - name: Run PreToolUse hook and assert degrade-with-warning
        shell: bash
        run: |
          # Precondition: python3 must not be available in this container
          if command -v python3 >/dev/null 2>&1; then echo "FAIL: python3 found"; exit 1; fi
          if command -v python >/dev/null 2>&1; then echo "FAIL: python found"; exit 1; fi
          # Extract the bash command from hooks.json with a real JSON parser.
          # grep and sed cannot do this: the command contains escaped quotes,
          # so a "[^"]*" pattern truncates at the first one and yields an empty
          # string. An empty command makes `bash -c ""` exit 0, which would
          # satisfy the "did not deny" assertion while testing nothing.
          # jq is a JSON parser and, unlike Python, does not undo this row's
          # vanilla precondition.
          BASH_CMD=$(jq -r '.hooks.PreToolUse[0].bash' "${INSTALL_ROOT}/hooks/hooks.json")

          # Fail loudly rather than testing an empty string.
          if [ -z "${BASH_CMD}" ] || [ "${BASH_CMD}" = "null" ]; then
            echo "FATAL: could not extract the PreToolUse bash command from hooks.json"
            exit 1
          fi
          case "${BASH_CMD}" in
            *_dispatch.py*) : ;;
            *)
              echo "FATAL: extracted command does not invoke the dispatcher; extraction is wrong"
              echo "Extracted: ${BASH_CMD}"
              exit 1
              ;;
          esac

          # Set up environment as the host would
          export COPILOT_PLUGIN_ROOT="${INSTALL_ROOT}"
          export CLAUDE_PLUGIN_ROOT="${INSTALL_ROOT}"

          # Run the hook command, capture output
          set +e
          OUTPUT=$(echo '{"tool_name":"Bash","tool_input":{"command":"echo hi"}}' | bash -c "${BASH_CMD}" 2>&1)
          EXIT_CODE=$?
          set -e

          echo "Exit code: ${EXIT_CODE}"
          echo "Output: ${OUTPUT}"

          # Assert: must NOT deny (exit 0)
          if [ "${EXIT_CODE}" -ne 0 ]; then
            echo "FAIL: hook DENIED (exit ${EXIT_CODE}). Must degrade, not block."
            exit 1
          fi

          # Assert: must warn
          if ! echo "${OUTPUT}" | grep -q "hooks DISABLED"; then
            echo "FAIL: no 'hooks DISABLED' warning in output"
            exit 1
          fi
          if ! echo "${OUTPUT}" | grep -q "session is unaffected"; then
            echo "FAIL: no 'session is unaffected' in output"
            exit 1
          fi
          if ! echo "${OUTPUT}" | grep -q "python.org/downloads"; then
            echo "FAIL: no install URL in output"
            exit 1
          fi

          echo "PASS: hook degraded gracefully with actionable warning"

  # Vanilla Windows: Python scrubbed from PATH.
  # NOTE: windows-latest ships Python and the py launcher preinstalled.
  # We cannot remove them, but we CAN hide them from PATH to simulate
  # a machine where Python was never added to PATH (common on enterprise
  # Windows). The py launcher is neutralized by renaming it for the job.
  # This does NOT prove complete absence (a real vanilla box has no Python
  # binaries at all), but it exercises the exact code path: command -v
  # fails for all interpreter names, so the shell guard fires.
  vanilla-windows:
    name: Vanilla Windows (Python hidden from PATH)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Scrub Python from PATH and neutralize py launcher
        shell: pwsh
        run: |
          # Remove all Python entries from PATH
          $cleanPath = ($env:PATH -split ';' | Where-Object {
            $_ -notmatch '[Pp]ython' -and $_ -notmatch 'PyLauncher'
          }) -join ';'
          echo "CLEAN_PATH=$cleanPath" >> $env:GITHUB_ENV

          # Neutralize the py launcher by renaming it for the duration
          $pyPaths = @(
            "$env:SYSTEMROOT\py.exe",
            "$env:LOCALAPPDATA\Programs\Python\Launcher\py.exe"
          )
          foreach ($p in $pyPaths) {
            if (Test-Path $p) {
              Rename-Item $p "$p.disabled" -ErrorAction SilentlyContinue
              echo "Disabled: $p"
            }
          }

      - name: Assert precondition - no Python resolves
        shell: pwsh
        env:
          PATH: ${{ env.CLEAN_PATH }}
        run: |
          # PRECONDITION: all interpreter names must fail to resolve.
          # If any resolves, the row is not vanilla.
          $failed = $false
          foreach ($cmd in @('py', 'python3', 'python')) {
            if (Get-Command $cmd -ErrorAction SilentlyContinue) {
              Write-Host "FATAL: $cmd found. Row is not vanilla."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "PRECONDITION PASSED: no Python interpreter resolves"

      - name: Run PreToolUse hook and assert degrade-with-warning
        shell: pwsh
        env:
          PATH: ${{ env.CLEAN_PATH }}
        run: |
          $installRoot = "$env:RUNNER_TEMP\installed-plugins\ai-agents\project-toolkit"
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          Copy-Item -Recurse -Force "src\copilot-cli\*" $installRoot
          Copy-Item -Recurse -Force "src\copilot-cli\.claude-plugin" $installRoot

          $env:COPILOT_PLUGIN_ROOT = $installRoot
          $env:CLAUDE_PLUGIN_ROOT = $installRoot

          # Extract the powershell command from hooks.json
          $hooks = Get-Content "$installRoot\hooks\hooks.json" | ConvertFrom-Json
          $pwshCmd = $null
          foreach ($prop in $hooks.hooks.PSObject.Properties) {
            foreach ($entry in $prop.Value) {
              if ($entry.powershell -and $entry.powershell -match 'PreToolUse') {
                $pwshCmd = $entry.powershell
                break
              }
            }
            if ($pwshCmd) { break }
          }

          if (-not $pwshCmd) {
            Write-Host "FATAL: Could not find PreToolUse powershell command"
            exit 1
          }

          # Pipe a payload and run the hook command
          $payload = '{"tool_name":"Bash","tool_input":{"command":"echo hi"}}'
          $output = $payload | pwsh -NoProfile -Command $pwshCmd 2>&1
          $exitCode = $LASTEXITCODE

          Write-Host "Exit code: $exitCode"
          Write-Host "Output: $output"

          # Assert: must NOT deny
          if ($exitCode -ne 0) {
            Write-Host "FAIL: hook DENIED (exit $exitCode). Must degrade, not block."
            exit 1
          }

          # Assert: must warn
          $text = $output -join "`n"
          if ($text -notmatch 'hooks DISABLED') {
            Write-Host "FAIL: no 'hooks DISABLED' warning"
            exit 1
          }
          if ($text -notmatch 'python.org/downloads') {
            Write-Host "FAIL: no install URL in output"
            exit 1
          }

          Write-Host "PASS: hook degraded gracefully with actionable warning"

  e2e-installed:
    name: E2E installed plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5
        with:
          enable-cache: false
      - name: Materialize plugin and run e2e
        shell: bash
        run: |
          uv sync --frozen

          INSTALL_ROOT="${RUNNER_TEMP}/installed-plugins/ai-agents/project-toolkit"
          mkdir -p "${INSTALL_ROOT}"
          cp -r src/copilot-cli/* "${INSTALL_ROOT}/"
          cp -r src/copilot-cli/.claude-plugin "${INSTALL_ROOT}/"

          export COPILOT_PLUGIN_ROOT="${INSTALL_ROOT}"
          export CLAUDE_PLUGIN_ROOT="${INSTALL_ROOT}"
          export RUN_INSTALLED_PLUGIN_HOOK_E2E=1

          uv run --frozen pytest tests/e2e/test_installed_plugin_hook_e2e.py -v

  # Single aggregate status so branch protection can require ONE context
  # instead of every matrix leg by name. It must fail when any upstream job
  # fails OR is skipped or cancelled: a required check that reports success
  # because its dependencies never ran is the exact false-green this guard
  # exists to prevent.
  guard-result:
    name: Plugin Hook Guard Result
    if: always()
    needs:
      - hook-positive
      - hook-negative-env
      - vanilla-linux
      - vanilla-windows
      - e2e-installed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Assert every guard job succeeded
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 .github/scripts/assert_guard_jobs_succeeded.py
