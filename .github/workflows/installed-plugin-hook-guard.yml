name: Installed Plugin Hook Guard
# Structural regression gate for #4672: verifies the installed plugin's hooks
# allow tool calls from a consumer environment, on all three target platforms.

on:
  pull_request:
    paths:
      - 'src/copilot-cli/**'
      - '.claude/hooks/**'
      - 'build/scripts/generate_dispatcher.py'
      - 'build/scripts/generate_hooks*.py'
      - 'scripts/ci/test_installed_plugin_hooks.py'
      - '.github/actions/test-installed-plugin-hooks/**'
      - '.github/workflows/installed-plugin-hook-guard.yml'
  push:
    branches: [main]
    paths:
      - 'src/copilot-cli/**'
      - '.claude/hooks/**'
      - 'build/scripts/generate_dispatcher.py'
      - 'build/scripts/generate_hooks*.py'

concurrency:
  group: plugin-hook-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hook-positive:
    name: Hook allows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: ./.github/actions/test-installed-plugin-hooks
        with:
          plugin-source: src/copilot-cli
          negative-env: 'false'

  hook-negative-env:
    name: Hook fail-open (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: ./.github/actions/test-installed-plugin-hooks
        with:
          plugin-source: src/copilot-cli
          negative-env: 'true'

  e2e-installed:
    name: E2E installed plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182  # v5
        with:
          enable-cache: false
      - name: Materialize plugin and run e2e
        shell: bash
        run: |
          uv sync --frozen

          INSTALL_ROOT="${RUNNER_TEMP}/installed-plugins/ai-agents/project-toolkit"
          mkdir -p "${INSTALL_ROOT}"
          cp -r src/copilot-cli/* "${INSTALL_ROOT}/"
          cp -r src/copilot-cli/.claude-plugin "${INSTALL_ROOT}/"

          export COPILOT_PLUGIN_ROOT="${INSTALL_ROOT}"
          export CLAUDE_PLUGIN_ROOT="${INSTALL_ROOT}"
          export RUN_INSTALLED_PLUGIN_HOOK_E2E=1

          uv run --frozen pytest tests/e2e/test_installed_plugin_hook_e2e.py -v
