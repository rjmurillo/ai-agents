# Audit Hook Bypass Detection
#
# CI backstop that detects commits likely made with --no-verify.
# Analyzes PR commits for indicators that pre-commit hooks were bypassed.
# Non-blocking: reports findings for audit trail, does not block merge.
#
# Detection heuristics:
#   - Commits modifying .agents/ without session log
#   - HANDOFF.md modifications on feature branches
#   - Bash scripts added under .github/scripts/ (ADR-042)
#
# Related: Issue #664 (--no-verify bypass logging)
# Related: lefthook.yml (local named validator jobs)

name: Audit Hook Bypass

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-bypass:
    name: Detect Hook Bypass
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run bypass detection
        id: detect
        run: |
          # Issue #2808: `|| true` masked the crash path. The exit contract
          # (0=clean, 1=indicators found, >=2=crash) is enforced in a tested
          # script (ADR-006: no logic in YAML) so a broken audit cannot be
          # reported as a clean one.
          python3 scripts/ci/run_hook_bypass_audit.py \
            --detector scripts/detect_hook_bypass.py \
            --base-ref origin/main \
            --output artifacts/hook-bypass-audit.json
          # Count extraction lives in a tested script (ADR-006: no logic in YAML).
          python3 scripts/ci/parse_hook_bypass_results.py \
            --input artifacts/hook-bypass-audit.json \
            --count-out hook-bypass-count.txt
          echo "indicator_count=$(cat hook-bypass-count.txt)" >> "$GITHUB_OUTPUT"

      - name: Report findings
        if: steps.detect.outputs.indicator_count != '0'
        run: |
          echo "::warning::Hook bypass indicators detected. See audit report."
          # Indicators are non-blocking (exit 1 by contract); do not fail the audit.
          python3 scripts/detect_hook_bypass.py --base-ref origin/main || true

      - name: Upload audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: hook-bypass-audit
          path: artifacts/hook-bypass-audit.json
          retention-days: 7
