name: PR Validation

# Validates PR description matches diff and enforces review comment policies
# Implements Phase 2 and Phase 4 from Issue #230
#
# Related Required Checks (configured in branch protection):
#   - PR Validation (this workflow)
#   - Session Protocol Validation (ai-session-protocol.yml)
#   - AI Quality Gate (ai-pr-quality-gate.yml)
#   - CodeQL Analysis (codeql-analysis.yml) - Security scanning

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Concurrency control: Attempts to cancel in-progress runs when new runs start

# NOTE: GitHub Actions does NOT guarantee run coalescing - race conditions can occur

# where multiple runs start before cancellation takes effect. This is best-effort

# See ADR-026 (../.agents/architecture/ADR-026-pr-automation-concurrency-and-safety.md)

# for architectural decision on workflow-level concurrency control

# Mitigation: Path filtering, timeouts, and PR-specific temp files reduce impact

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate-pr:
    name: Validate PR
    # ADR-055: ARM runner for cost optimization (37.5% savings vs x64)
    # PowerShell Core and GitHub CLI fully support ARM64
    runs-on: ubuntu-24.04-arm
    # Note: No job-level if condition - job must always run to report status for required checks
    # Bot exclusions handled at step level to ensure status is always reported
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check if validation should run
        id: should-run
        shell: pwsh
        run: |
          $actor = $env:GITHUB_ACTOR
          $excludedBots = @('dependabot[bot]', 'github-actions[bot]', 'renovate[bot]')
          
          if ($actor -in $excludedBots) {
            Write-Host "Skipping validation for bot actor: $actor"
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Running validation for actor: $actor"
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout repository
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PowerShell
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "Available modules:"
          Get-Module -ListAvailable | Select-Object Name, Version | Format-Table

      - name: Validate PR Description vs Diff
        if: steps.should-run.outputs.skip != 'true'
        id: validate-description
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/map_pr_description_result.py

      - name: Validate PR Description Standards
        if: steps.should-run.outputs.skip != 'true'
        id: validate-standards
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/parse_pr_standards.py

      - name: Check QA Report Exists
        if: steps.should-run.outputs.skip != 'true'
        id: check-qa
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/check_pr_qa_report.py

      - name: Generate Validation Report
        if: steps.should-run.outputs.skip != 'true'
        id: report
        env:
          DESCRIPTION_RESULT: ${{ steps.validate-description.outputs.validation_result }}
          BYPASS_USED: ${{ steps.validate-description.outputs.bypass_used }}
          BYPASS_LABEL: ${{ steps.validate-description.outputs.bypass_label }}
          BYPASS_COUNT: ${{ steps.validate-description.outputs.bypass_count }}
          HAS_CODE_CHANGES: ${{ steps.check-qa.outputs.has_code_changes }}
          QA_EXISTS: ${{ steps.check-qa.outputs.qa_report_exists }}
          QA_REPORT: ${{ steps.check-qa.outputs.qa_report }}
          KEYWORDS_STATUS: ${{ steps.validate-standards.outputs.keywords_status }}
          TEMPLATE_STATUS: ${{ steps.validate-standards.outputs.template_status }}
          TEMPLATE_MESSAGE: ${{ steps.validate-standards.outputs.template_message }}
          STANDARDS_WARNINGS: ${{ steps.validate-standards.outputs.standards_warnings }}
        run: python3 scripts/ci/build_pr_validation_report.py

      - name: Post PR Comment
        if: steps.should-run.outputs.skip != 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "pr-validation-report.md" ]; then
            python3 .github/scripts/run_with_retry.py -- \
              python3 .github/scripts/post_issue_comment.py \
              --issue "$PR_NUMBER" \
              --body-file "pr-validation-report.md" \
              --marker "PR-VALIDATION"
          fi

      - name: Set Job Summary
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Test-Path "pr-validation-report.md") {
            Get-Content "pr-validation-report.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Check PR commit count
        if: steps.should-run.outputs.skip != 'true'
        id: commit-check
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Thin wrapper (ADR-006): classification and transient-failure handling
        # live in the testable module. A transient GitHub API failure degrades
        # to status=UNKNOWN and exit 0 (issue #3262); the downstream Enforce
        # Blocking Issues step still enforces a real BLOCKED status.
        run: python3 scripts/validation/pr_commit_count.py --pr-number "$PR_NUMBER"

      - name: Apply needs-split label
        # Fixes #2557: this step is ADVISORY and must never fail the job.
        # The real 20-commit cap is enforced in `Enforce Blocking Issues`.
        # `continue-on-error` is the belt; warnings (not throws) in the body
        # are the suspenders, so a label API outage shows as an annotation
        # rather than a red step outline.
        if: steps.commit-check.outputs.status == 'WARNING' || steps.commit-check.outputs.status == 'ALERT' || steps.commit-check.outputs.status == 'BLOCKED'
        continue-on-error: true
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read existing labels through the REST issues endpoint. Stderr stays
          # visible so HTTP status and response messages remain in the job log.
          $existingLabels = gh api "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/labels" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not fetch PR labels (exit code: $LASTEXITCODE); skipping advisory 'needs-split' label."
            exit 0
          }

          if ($existingLabels -contains 'needs-split') {
            Write-Host "PR #$env:PR_NUMBER already has 'needs-split' label"
            exit 0
          }

          # Add the label via the REST issues/labels endpoint. The previous
          # `gh pr edit --add-label` call routed through GraphQL, which
          # returns HTTP 401 for installation/fine-grained tokens that the
          # REST reads above accept (see #2557, run 27280632030).
          $payload = '{"labels":["needs-split"]}'
          $payload | gh api `
            -X POST `
            -H "Accept: application/vnd.github+json" `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/labels" `
            --input -
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to add advisory 'needs-split' label (exit code: $LASTEXITCODE). Cosmetic only; the 20-commit cap is still enforced by 'Enforce Blocking Issues'."
            exit 0
          }
          Write-Host "Added 'needs-split' label to PR #$env:PR_NUMBER"

      - name: Remove needs-split label when below threshold
        # Fixes #2557: same advisory-only contract as the add step.
        if: steps.commit-check.outputs.status == 'OK'
        continue-on-error: true
        shell: pwsh
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read existing labels through the REST issues endpoint. Stderr stays
          # visible so HTTP status and response messages remain in the job log.
          $existingLabels = gh api "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/labels" --jq '.[].name'
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not fetch PR labels (exit code: $LASTEXITCODE); skipping advisory 'needs-split' cleanup."
            exit 0
          }

          if ($existingLabels -notcontains 'needs-split') {
            exit 0
          }

          # Delete the label via REST. The previous `gh pr edit --remove-label`
          # call routed through GraphQL and returned HTTP 401 for installation
          # tokens (see #2557). REST DELETE on issues/{N}/labels/{name} accepts
          # the same token used for the REST read above.
          gh api `
            -X DELETE `
            -H "Accept: application/vnd.github+json" `
            "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/labels/needs-split"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Failed to remove advisory 'needs-split' label (exit code: $LASTEXITCODE). Cosmetic only; the gate logic is unchanged."
            exit 0
          }
          Write-Host "Removed 'needs-split' label from PR #$env:PR_NUMBER"

      - name: Enforce Blocking Issues
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh
        env:
          OVERALL_STATUS: ${{ steps.report.outputs.overall_status }}
          COMMIT_STATUS: ${{ steps.commit-check.outputs.status }}
          COMMIT_COUNT: ${{ steps.commit-check.outputs.commit_count }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ($env:OVERALL_STATUS -eq "FAIL" -or $env:OVERALL_STATUS -eq "ERROR") {
            Write-Error "PR validation failed: $env:OVERALL_STATUS"
            exit 1
          }

          # Block if commit count exceeds limit (requires human override via bypass label)
          if ($env:COMMIT_STATUS -eq "BLOCKED") {
            # Check for bypass label through REST. This is a fail-closed gate:
            # auth/API errors must stay visible and fail validation.
            $labels = gh api "repos/$env:GITHUB_REPOSITORY/issues/$env:PR_NUMBER/labels" --jq '.[].name'
            if ($LASTEXITCODE -ne 0) { throw "Failed to fetch PR labels (exit code: $LASTEXITCODE)" }

            if ($labels -contains 'commit-limit-bypass') {
              Write-Host "::warning::Commit limit bypassed via 'commit-limit-bypass' label"
            } else {
              Write-Error "PR has $env:COMMIT_COUNT commits (limit: 20). Add 'commit-limit-bypass' label to override or split this PR."
              exit 1
            }
          }

          Write-Host "✓ PR validation passed"

      # Issue #2967: ADR-006 forbids business logic in workflow `run:` blocks.
      # The burn-down count (93 at audit time, 87 today) had no gate, so it could
      # climb back silently between extraction PRs. This freezes it: the scanner
      # exits 1 when the count exceeds --max. Lower --max after each extraction.
      # Runs on every PR because workflow YAML can change in any PR, and pytest.yml
      # (which hosts the ruff ratchets) only runs when Python files change.
      - name: Run ADR-006 run-block ratchet
        if: steps.should-run.outputs.skip != 'true'
        run: python3 scripts/ci/adr006_run_block_scanner.py --max 77

      # Issue #3330: workflow *schema* validation had no required CI gate. YAML
      # Lint (yaml-lint.yml) does run on `**/*.yml` for PRs, but it runs yamllint,
      # which checks syntax and style. It does not know what a workflow is: it
      # accepts an unpinned action, a job with no `runs-on`, and a missing `on:`
      # trigger. It is also not a required check, so it cannot block. That left
      # lefthook as the only thing enforcing workflow structure, which misses every
      # path that does not run local hooks: Renovate and Dependabot action-pin
      # bumps, the web editor, the API, a clone where `lefthook install` was never
      # run. A malformed workflow then surfaces when it next fires, which for a
      # scheduled job is hours or days later. #3275 is a live example.
      #
      # This job is the right host because it is a required check that reports
      # status on every PR regardless of touched paths.
      #
      # actionlint stays out on purpose. It is not in the runner image, so adding
      # it means adding a download-and-trust step, which is a supply-chain
      # decision worth making on its own rather than smuggling into this one.
      # This script runs in under a second across all the workflows and covers
      # YAML syntax, duplicate keys, structure, and action SHA pinning.
      #
      # The uv-setup and validate steps below are unconditional. The checkout
      # step fires only when the bot-skip guard suppressed the earlier checkout
      # (skip == 'true'), so validation still has source to read regardless of
      # who opened the PR. Renovate and Dependabot are exactly the actors that
      # open workflow-only PRs (action SHA bumps), so exempting them would defeat
      # the purpose of this gate.
      - name: Checkout repository for workflow validation
        if: steps.should-run.outputs.skip == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup uv for workflow validation
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate workflow YAML
        run: uv run --frozen python3 scripts/validate_workflows.py
