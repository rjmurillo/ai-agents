name: PR Validation

# Validates PR description matches diff and enforces review comment policies
# Implements Phase 2 and Phase 4 from Issue #230
#
# Related Required Checks (configured in branch protection):
#   - PR Validation (this workflow)
#   - CodeQL Analysis (codeql-analysis.yml) - Security scanning

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Concurrency control: Attempts to cancel in-progress runs when new runs start

# NOTE: GitHub Actions does NOT guarantee run coalescing - race conditions can occur

# where multiple runs start before cancellation takes effect. This is best-effort

# See ADR-026 (../.agents/architecture/ADR-026-pr-automation-concurrency-and-safety.md)

# for architectural decision on workflow-level concurrency control

# Mitigation: Path filtering, timeouts, and PR-specific temp files reduce impact

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  validate-pr:
    name: Validate PR
    # ADR-055: ARM runner for cost optimization (37.5% savings vs x64)
    # PowerShell Core and GitHub CLI fully support ARM64
    runs-on: ubuntu-24.04-arm
    # Note: No job-level if condition - job must always run to report status for required checks
    # Bot exclusions handled at step level to ensure status is always reported
    timeout-minutes: 10

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check if validation should run
        id: should-run
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $actor = $env:GITHUB_ACTOR
          $excludedBots = @('dependabot[bot]', 'github-actions[bot]', 'renovate[bot]')
          $shouldSkip = $env:EVENT_NAME -eq 'merge_group' -or $actor -in $excludedBots

          if ($shouldSkip) {
            Write-Host "Skipping PR-shaped validation for event or actor"
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Running validation for actor: $actor"
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Checkout repository
        if: steps.should-run.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `Check PR commit count` no longer needs this (its main-merge trunk
          # read was removed, issue #5233), but this job also runs the
          # merge-tree ratchet and several count ratchets further down
          # (issue #4572, #4518), and those steps share this same checkout.
          # A shallow checkout leaves `.git/shallow` in place for the rest of
          # the job, which breaks `git merge-tree` with "refusing to merge
          # unrelated histories". fetch-depth: 0 still has to stay here.
          fetch-depth: 0

      # Must precede every `uv run` in this job. `Check PR commit count` below
      # is the first one, and the runner has no preinstalled uv, so ordering
      # this after it fails the step with `uv: command not found` (exit 127).
      - name: Setup uv
        if: steps.should-run.outputs.skip != 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup PowerShell
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "Available modules:"
          Get-Module -ListAvailable | Select-Object Name, Version | Format-Table

      - name: Validate PR Description vs Diff
        if: steps.should-run.outputs.skip != 'true'
        id: validate-description
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/map_pr_description_result.py

      - name: Validate PR Description Standards
        if: steps.should-run.outputs.skip != 'true'
        id: validate-standards
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/parse_pr_standards.py

      - name: Generate Validation Report
        if: steps.should-run.outputs.skip != 'true'
        id: report
        env:
          DESCRIPTION_RESULT: ${{ steps.validate-description.outputs.validation_result }}
          BYPASS_USED: ${{ steps.validate-description.outputs.bypass_used }}
          BYPASS_LABEL: ${{ steps.validate-description.outputs.bypass_label }}
          BYPASS_COUNT: ${{ steps.validate-description.outputs.bypass_count }}
          KEYWORDS_STATUS: ${{ steps.validate-standards.outputs.keywords_status }}
          TEMPLATE_STATUS: ${{ steps.validate-standards.outputs.template_status }}
          TEMPLATE_MESSAGE: ${{ steps.validate-standards.outputs.template_message }}
          STANDARDS_WARNINGS: ${{ steps.validate-standards.outputs.standards_warnings }}
        run: python3 scripts/ci/build_pr_validation_report.py

      - name: Post PR Comment
        if: steps.should-run.outputs.skip != 'true'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f "pr-validation-report.md" ]; then
            python3 .github/scripts/run_with_retry.py -- \
              python3 .github/scripts/post_issue_comment.py \
              --issue "$PR_NUMBER" \
              --body-file "pr-validation-report.md" \
              --marker "PR-VALIDATION" \
              --update-if-exists
          fi

      - name: Set Job Summary
        if: steps.should-run.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (Test-Path "pr-validation-report.md") {
            Get-Content "pr-validation-report.md" | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Check PR commit count
        if: steps.should-run.outputs.skip != 'true'
        id: commit-check
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Thin wrapper (ADR-006): classification and transient-failure handling
        # live in the testable module. A transient GitHub API failure degrades
        # to status=UNKNOWN and exit 0 (issue #3262). The commit count is
        # advisory only (issue #5233): no downstream step blocks on it.
        run: uv run --frozen python scripts/validation/pr_commit_count.py --pr-number "$PR_NUMBER"

      - name: Apply needs-split label
        # Fixes #2557: this step is ADVISORY and must never fail the job. It is
        # purely a suggestion label with no local enforcement attached (issue
        # #5233 removed the commit-count block this used to accompany).
        # `continue-on-error` is the belt; warnings (not throws) in the body
        # are the suspenders, so a label API outage shows as an annotation
        # rather than a red step outline.
        if: steps.commit-check.outputs.status == 'WARNING' || steps.commit-check.outputs.status == 'ALERT'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/update_needs_split_label.py --mode add

      - name: Remove needs-split label when below threshold
        # Fixes #2557: same advisory-only contract as the add step.
        if: steps.commit-check.outputs.status == 'OK'
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/update_needs_split_label.py --mode remove

      - name: Enforce Blocking Issues
        if: steps.should-run.outputs.skip != 'true'
        env:
          OVERALL_STATUS: ${{ steps.report.outputs.overall_status }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci/enforce_pr_validation.py

      # Issue #3330: workflow *schema* validation had no required CI gate. YAML
      # Lint (yaml-lint.yml) does run on `**/*.yml` for PRs, but it runs yamllint,
      # which checks syntax and style. It does not know what a workflow is: it
      # accepts an unpinned action, a job with no `runs-on`, and a missing `on:`
      # trigger. It is also not a required check, so it cannot block. That left
      # lefthook as the only thing enforcing workflow structure, which misses every
      # path that does not run local hooks: Renovate and Dependabot action-pin
      # bumps, the web editor, the API, a clone where `lefthook install` was never
      # run. A malformed workflow then surfaces when it next fires, which for a
      # scheduled job is hours or days later. #3275 is a live example.
      #
      # This job is the right host because it is a required check that reports
      # status on every PR regardless of touched paths.
      #
      # actionlint stays out on purpose. It is not in the runner image, so adding
      # it means adding a download-and-trust step, which is a supply-chain
      # decision worth making on its own rather than smuggling into this one.
      # This script runs in under a second across all the workflows and covers
      # YAML syntax, duplicate keys, structure, and action SHA pinning.
      #
      # The uv-setup and validate steps below are unconditional. The checkout
      # step fires only when the bot-skip guard suppressed the earlier checkout
      # (skip == 'true'), so validation still has source to read regardless of
      # who opened the PR. Renovate and Dependabot are exactly the actors that
      # open workflow-only PRs (action SHA bumps), so exempting them would defeat
      # the purpose of this gate.
      - name: Checkout repository for workflow validation
        if: steps.should-run.outputs.skip == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Run merge-tree ratchet is unconditional, so the bot-skip leg shares
          # this checkout. Default depth 1 creates .git/shallow, and a later
          # full fetch does not remove that graft.
          fetch-depth: 0

      - name: Setup uv for workflow validation
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate workflow YAML
        run: uv run --frozen python3 scripts/validate_workflows.py

      - name: Check bare-python3 documentation entrypoints
        run: uv run --frozen python3 scripts/validation/check_python3_entrypoints.py

      # Issue #4871: a `.claude/rules/*.md` scoped with a key Claude Code does
      # not read loads on every session. The three wrong keys fail differently,
      # measured by running one rule per shape through generate_rules.py:
      #   applyTo:      remapped, so the Copilot mirror IS correctly scoped and
      #                 only the Claude source declares nothing. This is the
      #                 case instruction_budget.py cannot see, because it reads
      #                 the generated tree where the rule looks fine.
      #   globs:        preserved verbatim, never becomes applyTo:, so NEITHER
      #                 tree is scoped.
      #   alwaysApply:  dropped, applyTo: '**' synthesized, so both trees load
      #                 universally and a code-only rule cannot state its scope.
      # Only a source-tree check catches the first; this gate catches all three.
      #
      # Unconditional and hosted here for the same reason as the ratchets below.
      # The pre-push `pre-pr-validation` lefthook job already runs this via
      # pre_pr.py, but no workflow invokes pre_pr.py, so the hook was the only
      # enforcement. A push from a clone without `lefthook install`, the web
      # editor, or the API could regress a rule back to `applyTo:` with nothing
      # on the remote to catch it. A gate that only fires locally is not a gate.
      - name: Check rule scope declarations (paths:)
        run: uv run --frozen python3 scripts/validation/check_rule_scope_keys.py

      # Issue #2967: ADR-006 forbids business logic in workflow `run:` blocks.
      # The burn-down count started at 93 at audit time and reached zero. The
      # ratchet ceiling is now fixed at 0: the scanner exits 1 when the count
      # exceeds --max, so any new run block fails the gate.
      #
      # Unconditional (Issue #4151): Renovate and Dependabot open workflow-only
      # PRs (action SHA bumps), which are exactly the PRs that could smuggle a
      # new run block past this gate if it were skip-guarded. A gate that exempts
      # the actors who author workflow changes is weaker than the hook it
      # backstops, not equal to it.
      - name: Run ADR-006 run-block ratchet
        run: python3 scripts/ci/adr006_run_block_scanner.py --max 0

      # Issue #3779: taste-lints emits severity="error" and nothing could fail
      # because of one. The linter itself is correct (it exits 10 on an error),
      # but `run_taste_advisory` in scripts/validation/git_hook_policy.py read
      # that exit code, printed "advisory", and returned 0; no workflow called
      # the linter at all. So the `error` severity was decorative, and every
      # commit touching a large file printed an error the author correctly
      # learned to ignore, which is the same training signal that teaches people
      # to ignore the naming and complexity rules in the same output.
      #
      # Existing debt is capped by scripts/ci/taste_count_baseline.txt.
      # Lower counts pass without rewriting that shared line. Use --update
      # only when intentionally lowering the ceiling.
      #
      # This job hosts it for the same reason it hosts the workflow-YAML and
      # model-pin gates: taste-lints scans Markdown, YAML, JSON, shell, and
      # PowerShell as well as Python, so a Python-paths-filtered workflow
      # (pytest.yml, where the ruff ratchets live) would miss most of its scope.
      #
      # --base-ref makes the ratchet one-directional. Without it a PR could
      # raise the baseline in the same commit that adds the violations, and the
      # gate would pass while the debt grew.
      - name: Run taste-lint error-count ratchet
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # This job later runs merge-tree and count-ratchet diagnostics that
          # need a merge base. A depth-limited fetch writes .git/shallow for
          # the whole job, and a later plain fetch does not repair it. This job
          # already checked out full history, so keep this base fetch full-depth.
          git fetch origin "$BASE_REF"
          uv run --frozen python3 scripts/ci/taste_count_ratchet.py --base-ref FETCH_HEAD
      # Issue #4039: type: ignore suppressions bypass the mypy ratchet by inflating
      # allowed violations without the ratchet noticing. Counting them separately
      # ensures net-new suppressions are visible and blocked on a regression.
      - name: Run type-ignore count ratchet
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # Keep this fetch full-depth; an earlier shallow fetch would graft
          # .git/shallow for the later merge-tree ratchet. See the taste-lint
          # ratchet step above for why a later plain fetch does not repair it.
          git fetch origin "$BASE_REF"
          uv run --frozen python3 scripts/ci/type_ignore_count_ratchet.py --base-ref FETCH_HEAD
      # Issue #4313: 425 atomic memories are unreachable through the retrieval
      # path AGENTS.md points at. The pre-push ratchet stops the count rising,
      # but every route that skips local hooks reaches the remote unchecked:
      # `--no-verify`, a clone where `lefthook install` was never run, a bot
      # push, a cloud agent. The gate needs a server-side leg for the same
      # reason the conflict-marker gate below does.
      - name: Run unindexed-memory count ratchet
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # Keep this fetch full-depth; an earlier shallow fetch would graft
          # .git/shallow for the later merge-tree ratchet. See the taste-lint
          # ratchet step above for why a later plain fetch does not repair it.
          git fetch origin "$BASE_REF"
          uv run --frozen python3 scripts/ci/memory_index_count_ratchet.py --base-ref FETCH_HEAD
      # Issue #4441: `memory-token-update` repairs every index token count on
      # pre-commit, but it carries `skip: [merge, "test $SKIP_AUTOFIX = 1"]` and
      # nothing verifies its result. An autofix with no verifier is not a gate.
      # A memory edited inside a merge commit reached main with the old count
      # still recorded: measured on pristine main, `skills-git-index` read 287
      # against an actual 324, a 13% undercount. This needs the same server-side
      # leg as the count ratchet above, and for the same reason: every route
      # that skips local hooks reaches the remote unchecked. It takes no
      # --base-ref because its floor is fixed at zero, so there is no baseline
      # to compare against and nothing a contributor could raise to silence it.
      - name: Run memory-index token ratchet
        run: uv run --frozen python3 scripts/ci/memory_index_token_ratchet.py
      # Issue #4398: the three count ratchets measure the branch head, not the
      # merged result. A branch cut before main lowered a baseline can pass its
      # own count check yet breach the ceiling once it lands. This step evaluates
      # all three ratchets against the result of merging HEAD into base_ref, so
      # the stale-branch hole is closed at merge time, not only at push time.
      #
      # The check is complementary to reserve-band enforcement (issue #4345),
      # which closes the concurrent-admission hole. Neither subsumes the other.
      #   - merge-tree ratchet: one stale PR merging green against old main.
      #     PR #4272 is the canonical example (file grew past ceiling on old main).
      #   - reserve band: three PRs each passing the SAME current main;
      #     union breaches (measured: af27638a6 +891, 9a7bd1d93 +339,
      #     7b5279967 +259; each passed alone, cumulative 82603 -> 83201
      #     against 83000 ceiling).
      #
      # Conflict policy: a conflicting PR cannot merge anyway; skip with a
      # message rather than blocking on a check that duplicates the merge gate.
      - name: Run merge-tree ratchet
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          # Issue #4518: this fetch MUST NOT be shallow. The count ratchets
          # above do not need ancestry for their own baseline reads, but
          # merge-tree needs a merge base, and a --depth=1 fetch writes
          # .git/shallow and cuts traversal at the fetched commit.
          # git then aborts with "refusing to merge unrelated histories" (rc 128)
          # on any branch behind the base, which is the only case this gate
          # exists to evaluate. Measured: behind+shallow rc=128, behind+full
          # rc=0, up-to-date+shallow rc=0.
          git fetch origin "$BASE_REF"
          uv run --frozen --extra dev python3 scripts/ci/merge_tree_ratchet_check.py --base-ref FETCH_HEAD
      # Issue #3770: `conflict-marker-policy` runs only at pre-commit over the
      # index. Every route that skips local hooks reached the remote unchecked:
      # a server-side merge from the "Update branch" button, `--no-verify`, a
      # clone where `lefthook install` was never run, a bot push.
      #
      # It already happened. Commit b71580c23 landed two unresolved hunks in
      # tests/test_lefthook_integration.py while neither parent carried any,
      # then survived four further merges. What caught it was the Python syntax
      # check in pytest.yml, which is incidental coverage: it exists to enforce
      # the 3.10 syntax floor, it only reads Python, and a marker in Markdown or
      # YAML has no equivalent backstop anywhere in the repository.
      #
      # This job is the right host for the same reason the two gates above are
      # here: it is a required check that reports on every PR regardless of
      # which paths changed, and a marker can arrive in any file type.
      #
      # The scan walks the whole tracked tree rather than the PR diff so that a
      # marker is caught by the PR carrying it no matter which route introduced
      # it. That costs about one second across 7,530 tracked files, and the tree
      # is clean today, so this is a ratchet at zero with no allowlist.
      - name: Check for conflict markers
        run: uv run --frozen python3 scripts/validation/git_hook_policy.py tracked-conflict-markers

      # Issue #4068: scripts with a `main` entrypoint need tests that prove the
      # CLI returns nonzero on failure. Helper-only assertions miss silent-pass
      # regressions after shell logic moves into Python.
      - name: Run CLI exit contract ratchet
        run: uv run --frozen python3 scripts/ci/cli_exit_contract_ratchet.py --base-ref FETCH_HEAD

      # Issue #2840: ADR-080 requires an unjustified `model:` pin to fail CI.
      # `check_model_pins.py --mode enforce` exits 1 on a new or changed pin
      # that lacks a model-rationale field, and `checks_spec.validate_model_pins`
      # documents that "enforcement stays in CI" -- but nothing under .github/
      # ever invoked it. The pre-PR runner wraps only `--mode warn`, which
      # prints `VIOLATION` and exits 0 by design, so until now a new unjustified
      # pin was detected, reported, and merged anyway.
      #
      # Hosted in this job for the same reason as the workflow-YAML step above:
      # a `model:` pin can land in any skill, agent, or command file, so the
      # gate has to fire on every PR regardless of touched paths, and this is
      # the only required check that always reports status.
      #
      # Enforce mode grandfathers the existing backlog through
      # scripts/validation/model_pin_baseline.json and fails only on new or
      # changed pins, so it passes clean on today's tree.
      - name: Enforce model pin policy
        run: uv run --frozen python3 scripts/validation/check_model_pins.py --mode enforce
