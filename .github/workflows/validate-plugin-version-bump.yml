# Validate Plugin Version Bump
#
# Fails when a packaged plugin's .claude-plugin/plugin.json carries a version
# field. With the field absent, Claude Code resolves freshness from the git
# commit SHA, which changes on every merge. A committed version pins freshness
# to that string and conflicts across every concurrent PR.
#
# The same rule covers the two marketplace files: a per-plugin version in a
# marketplace entry is Claude Code's resolution step 2 and pins freshness ahead
# of the commit SHA. A marketplace-only change touches no plugin source, so this
# workflow filters on those two paths as well.
#
# Scope: the 3 packaged plugins (.claude, src/claude, src/copilot-cli) plus
# .claude-plugin/marketplace.json and .github/plugin/marketplace.json.
# Runs only on PRs/pushes that touch a plugin source dir, a marketplace file,
# or the gate itself.
#
# Related: ADR-092, Issue rjmurillo/ai-agents#4080, Issue rjmurillo/ai-agents#2118

name: Validate Plugin Version Bump

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches: [main]
  workflow_dispatch:

jobs:
  check-paths:
    name: Check Changed Paths
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should-run-version-bump: ${{ steps.determine.outputs.should-run-version-bump }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for relevant file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch' && github.event_name != 'merge_group'
        with:
          filters: |
            paths:
              - '.claude/**'
              - 'src/claude/**'
              - 'src/copilot-cli/**'
              - '.claude-plugin/marketplace.json'
              - '.github/plugin/marketplace.json'
              - 'build/scripts/validate_plugin_version_bump.py'
              - 'scripts/validation/run_plugin_version_bump_ci.py'
              - 'scripts/validation/ci_runner_base.py'
              - '.github/workflows/validate-plugin-version-bump.yml'

      - name: Determine if validation should run
        id: determine
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTPUTS: ${{ toJson(steps.filter.outputs) }}
          FILTER_KEYS: paths
          FORCE_RUN_EVENTS: merge_group
          OUTPUT_NAME: should-run-version-bump
        run: python3 scripts/workflows/determine_should_run_from_filters.py

  validate:
    name: Validate Plugin Version Bump
    needs: check-paths
    if: needs.check-paths.outputs.should-run-version-bump == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # fetch-depth: 0 so the runner can resolve origin/<base> and the
          # push-event before-SHA. The validator reads the manifests from a git
          # ref rather than the working tree, so a shallow checkout that cannot
          # resolve the head ref would fail the gate as a config error.
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Validate plugin version bump
        # Per ADR-006 (Thin Workflows, Testable Modules), fetch + base-ref
        # resolution + validator invocation live in the runner module. The
        # YAML passes inputs via env and runs one command.
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
          PUSH_BEFORE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          python3 scripts/validation/run_plugin_version_bump_ci.py

      - name: Show fix instructions on failure
        if: failure()
        run: |
          echo ""
          echo "=== Plugin Version Field Validation Failed ==="
          echo ""
          echo "A packaged plugin manifest carries a 'version' field."
          echo "That pins Claude Code freshness to the string instead of the"
          echo "commit SHA, and conflicts across every concurrent PR."
          echo ""
          echo "Fix: delete the 'version' line from the reported"
          echo ".claude-plugin/plugin.json, then commit. See ADR-092."
          echo ""

  skip-validation:
    name: Validate Plugin Version Bump (Skipped)
    needs: check-paths
    if: needs.check-paths.outputs.should-run-version-bump != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Skip validation (no relevant files changed)
        run: echo "No plugin source files changed - skipping version-bump validation"
