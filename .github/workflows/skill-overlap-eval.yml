name: Skill Overlap Eval

on:
  schedule:
    - cron: '0 6 1 */3 *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-overlap-eval
  cancel-in-progress: true

jobs:
  run-eval:
    name: Run skill overlap eval
    # Issue #1949: quarterly eval checks skill redundancy drift.
    runs-on: ubuntu-26.04-arm
    environment: agent-claude
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
        with:
          enable-cache: true

      - name: Run skill overlap eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          uv run python scripts/eval/eval-skill-overlap.py
          --pairs scripts/eval/examples/overlap-pairs-issue-1949.json
          --run-id quarterly-${{ github.run_id }}

      - name: Upload overlap report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: skill-overlap-eval-${{ github.run_id }}
          path: evals/reports/overlap-quarterly-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
