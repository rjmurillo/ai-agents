# Update Reviewer Signal Stats
#
# Automated daily workflow to gather PR review comment statistics and update
# the pr-review/pr-comment-responder-skills Serena memory with accurate signal
# quality data.
#
# This workflow:
# - Runs daily at 06:00 UTC (scheduled)
# - Can be triggered manually with custom days_back parameter
# - Aggregates PR review comments by reviewer
# - Calculates actionability scores using heuristics
# - Updates the Serena memory file (source of truth)
# - Publishes the agent PR intervention report (issue #7154)
# - Hands the file to a second job that commits it on the
#   automation/reviewer-stats branch and opens a pull request, because the
#   default branch is protected (issue #7287)
#
# Two jobs keep the write token away from the steps that run repository code
# and resolved dependencies. A new output file goes in the artifact path list
# of the first job and in a --path flag of the publish step. The publish step
# copies only those named paths out of the downloaded artifact (--artifact-dir),
# so a forged artifact cannot replace the script that runs with the write token.
# scripts/ci/open_bot_pr.py documents the publish rules, the stale-branch
# delete, and how a human starts the required checks on the pull request.
#
# Related: Issue #234 (Automated daily reviewer signal quality statistics)

name: Update Reviewer Signal Stats

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of history to analyze'
        required: false
        default: '28'

permissions:
  contents: read

# A newer run supersedes an older one, so two publishes never overlap: a second
# run that saw a stale branch would delete the branch the first run just pushed,
# and GitHub closes the pull request. A cancelled publish is safe: the next run
# deletes the orphan branch and retries.
concurrency:
  group: update-reviewer-stats
  cancel-in-progress: true

jobs:
  update-stats:
    name: Update Reviewer Stats
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-26.04-arm
    environment: agent-claude
    # The intervention report step alone may take 15 minutes; the stats step,
    # checkout and upload need headroom on top (observed 2.5 to 9.3 minutes).
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1-3-g0c366fd (untagged, one commit before v6.0.2)
        with:
          # Need full history for accurate PR analysis
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run statistics aggregation
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
        run: |
          days_back="${DAYS_BACK:-90}"
          uv run --frozen python scripts/update_reviewer_signal_stats.py --days-back "$days_back"

      # Independent of the stats step above: a failure there must not skip this
      # report, and the upload below runs whatever was built.
      - name: Build agent PR intervention report
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/update_reviewer_signal_stats.py --agent-intervention

      # The ACT guards on the upload, download and publish steps follow pytest.yml:
      # gh act 0.2.89 cannot serve the v4 artifact protocol, and publishing needs a
      # real push. Under act the jobs run up to those steps.
      - name: Upload updated stats
        if: ${{ !cancelled() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-stats
          # Two paths, both tracked, so both are always present: this step fails
          # only if the upload itself breaks. The publish step finds each file at
          # its repository path or by basename, so it does not matter which root
          # the action picks, and it fails loud if it finds neither.
          path: |
            .serena/memories/pr-review/pr-comment-responder-skills.md
            .project-toolkit/metrics/agent-pr-intervention.md
          # upload-artifact v4 and later skip dot-prefixed paths by default; both
          # files sit under dot directories (pytest.yml does the same for
          # .testmondata).
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-stats:
    name: Publish Reviewer Stats
    # No environment: update-stats runs under agent-claude (one required
    # reviewer), and needs: keeps this job behind that approval. A second
    # environment here would ask for a second approval on every run.
    needs: update-stats
    # Run when the aggregation job failed too: the upload step ran regardless,
    # so whichever report was built still gets published.
    if: ${{ !cancelled() && (needs.update-stats.result == 'success' || needs.update-stats.result == 'failure') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    # The only job that holds write scopes: contents writes the bot branch and
    # pull-requests opens the pull request (issue #7287). It runs no repository
    # Python except the stdlib-only publish script.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1-3-g0c366fd (untagged, one commit before v6.0.2)
        with:
          # The publish script checks that HEAD is an ancestor of origin/main.
          fetch-depth: 0
          # The publish step authenticates through gh auth setup-git.
          persist-credentials: false

      - name: Download updated stats
        if: ${{ env.ACT != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: reviewer-stats
          # A scratch directory, never the checkout: the publish step copies only
          # the named files out of it.
          path: ${{ runner.temp }}/reviewer-stats

      - name: Open pull request with updated stats
        if: ${{ env.ACT != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 -I scripts/ci/open_bot_pr.py \
            --artifact-dir "$RUNNER_TEMP/reviewer-stats" \
            --branch automation/reviewer-stats \
            --issue 234 \
            --path .serena/memories/pr-review/pr-comment-responder-skills.md \
            --path .project-toolkit/metrics/agent-pr-intervention.md \
            --user-name "github-actions[bot]" \
            --user-email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "chore(stats): update reviewer signal statistics" \
            --message "Automated daily update of the reviewer signal and agent PR intervention reports." \
            --message "Generated by update_reviewer_signal_stats.py"
