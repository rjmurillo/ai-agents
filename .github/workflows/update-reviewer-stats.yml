# Update Reviewer Signal Stats
#
# Automated daily workflow to gather PR review comment statistics and update
# the pr-review/pr-comment-responder-skills Serena memory with accurate signal
# quality data.
#
# This workflow:
# - Runs daily at 06:00 UTC (scheduled)
# - Can be triggered manually with custom days_back parameter
# - Aggregates PR review comments by reviewer
# - Calculates actionability scores using heuristics
# - Updates the Serena memory file (source of truth)
# - Hands the file to a second job that commits it on the
#   automation/reviewer-stats branch and opens a pull request, because the
#   default branch is protected (issue #7287)
#
# Two jobs keep the write token away from the step that runs repository code
# and resolved dependencies. A new output file goes in the artifact path list
# of the first job and in a --path flag of the publish step. A new directory
# needs its own artifact and download step.
# scripts/ci/open_bot_pr.py documents the publish rules, the stale-branch
# delete, and why a human must close and reopen the pull request.
#
# Related: Issue #234 (Automated daily reviewer signal quality statistics)

name: Update Reviewer Signal Stats

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of history to analyze'
        required: false
        default: '28'

permissions:
  contents: read

# One publish at a time: a second run that saw a stale branch would delete the
# branch the first run just pushed, and GitHub closes the pull request. A
# cancelled publish is safe: the next run deletes the orphan branch and retries.
concurrency:
  group: update-reviewer-stats
  cancel-in-progress: true

jobs:
  update-stats:
    name: Update Reviewer Stats
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-26.04-arm
    environment: agent-claude
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1-3-g0c366fd (untagged, one commit before v6.0.2)
        with:
          # Need full history for accurate PR analysis
          fetch-depth: 0
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run statistics aggregation
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
        run: |
          days_back="${DAYS_BACK:-90}"
          uv run --frozen python scripts/update_reviewer_signal_stats.py --days-back "$days_back"

      - name: Upload updated stats
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reviewer-stats
          path: .serena/memories/pr-review/pr-comment-responder-skills.md
          # upload-artifact v4 and later skip dot-prefixed paths by default; the
          # file sits under .serena/ (pytest.yml does the same for .testmondata).
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  publish-stats:
    name: Publish Reviewer Stats
    # No environment: update-stats runs under agent-claude (one required
    # reviewer), and needs: keeps this job behind that approval. A second
    # environment here would ask for a second approval on every run.
    needs: update-stats
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    # The only job that holds write scopes: contents writes the bot branch and
    # pull-requests opens the pull request (issue #7287). It runs no repository
    # Python except the stdlib-only publish script.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.1-3-g0c366fd (untagged, one commit before v6.0.2)
        with:
          # The publish script checks that HEAD is an ancestor of origin/main.
          fetch-depth: 0
          # The publish step authenticates through gh auth setup-git.
          persist-credentials: false

      - name: Download updated stats
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: reviewer-stats
          # The artifact holds one file at its basename; this is its directory.
          path: .serena/memories/pr-review

      - name: Open pull request with updated stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/ci/open_bot_pr.py \
            --branch automation/reviewer-stats \
            --issue 234 \
            --path .serena/memories/pr-review/pr-comment-responder-skills.md \
            --user-name "github-actions[bot]" \
            --user-email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "chore(stats): update reviewer signal statistics" \
            --message "Automated daily update of PR reviewer signal quality metrics." \
            --message "Generated by update_reviewer_signal_stats.py"
