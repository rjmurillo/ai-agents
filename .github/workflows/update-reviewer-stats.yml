# Update Reviewer Signal Stats
#
# Automated daily workflow to gather PR review comment statistics and update
# the pr-review/pr-comment-responder-skills Serena memory with accurate signal
# quality data.
#
# This workflow:
# - Runs daily at 06:00 UTC (scheduled)
# - Can be triggered manually with custom days_back parameter
# - Aggregates PR review comments by reviewer
# - Calculates actionability scores using heuristics
# - Updates the Serena memory file (source of truth)
# - Publishes the agent PR intervention report (issue #7154)
# - Commits and pushes changes automatically
#
# Related: Issue #234 (Automated daily reviewer signal quality statistics)

name: Update Reviewer Signal Stats

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Days of history to analyze'
        required: false
        default: '28'

permissions:
  contents: write
  pull-requests: read

jobs:
  update-stats:
    name: Update Reviewer Stats
    # ADR-025: ARM runner for cost optimization (37.5% savings vs x64)
    runs-on: ubuntu-26.04-arm
    environment: agent-claude

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          # Need full history for accurate PR analysis
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run statistics aggregation
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS_BACK: ${{ github.event.inputs.days_back }}
        run: |
          days_back="${DAYS_BACK:-90}"
          uv run --frozen python scripts/update_reviewer_signal_stats.py --days-back "$days_back"

      - name: Commit updated stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/ci/commit_and_push.py \
            --path .serena/memories/pr-review/pr-comment-responder-skills.md \
            --user-name "github-actions[bot]" \
            --user-email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "chore(stats): update reviewer signal statistics" \
            --message "Automated daily update of PR reviewer signal quality metrics." \
            --message "Generated by update_reviewer_signal_stats.py"

      # Independent of the stats steps above: a failure there must not skip this
      # report, and a failed build must not reach the commit step.
      - name: Build agent PR intervention report
        id: intervention_report
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen python scripts/update_reviewer_signal_stats.py --agent-intervention

      - name: Commit agent PR intervention report
        if: ${{ !cancelled() && steps.intervention_report.outcome == 'success' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          python3 scripts/ci/commit_and_push.py \
            --path .project-toolkit/metrics/agent-pr-intervention.md \
            --user-name "github-actions[bot]" \
            --user-email "41898282+github-actions[bot]@users.noreply.github.com" \
            --message "chore(stats): update agent PR intervention report" \
            --message "Automated daily update of the agent PR intervention metrics." \
            --message "Generated by update_reviewer_signal_stats.py --agent-intervention"
