name: Slash Command Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-paths:
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: read
    outputs:
      should-run-commands: ${{ steps.filter.outputs.commands == 'true' || steps.filter.outputs.validator == 'true' || steps.filter.outputs.spec_evals == 'true' }}
      spec_evals_changed: ${{ steps.filter.outputs.spec_command == 'true' || steps.filter.outputs.spec_evals == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            commands:
              - '.claude/commands/**/*.md'
            spec_command:
              - '.claude/commands/spec.md'
            spec_evals:
              - 'tests/evals/spec-scenarios.json'
              - 'scripts/eval/eval-prompt-change.py'
            validator:
              - '.claude/skills/slashcommandcreator/scripts/validate_slash_command.py'
              - 'scripts/modules/slash_command_validator.py'

  validate-slash-commands:
    runs-on: ubuntu-24.04-arm
    needs: check-paths
    if: needs.check-paths.outputs.should-run-commands == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Validate slash commands
        run: python3 -c "from scripts.modules.slash_command_validator import invoke_slash_command_validation; raise SystemExit(invoke_slash_command_validation())"

      - name: Install eval extra (openai grader)
        # setup-code-env installs only .[dev]; the github provider grader needs
        # the openai package from .[eval]. Without this, eval-prompt-change.py
        # exits 3 (missing package is not a provider outage, so the skip-net
        # does not neutral-skip it). Gated on the same condition as the eval so
        # it only runs when the /spec eval actually fires.
        if: |
          github.event_name == 'pull_request' &&
          needs.check-paths.outputs.spec_evals_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv pip install --system -e ".[eval]"

      - name: Run /spec behavioral evals
        # Grader: openai/gpt-5 via GitHub Models (the COPILOT_GITHUB_TOKEN CI
        # already uses), reachable as a reasoning model after #2712. The default
        # Anthropic transport is dead until the API budget resets 2026-07-01.
        # gpt-5 is the highest grader GitHub Models offers (no gpt-5.5 / Opus).
        # CALIBRATION ROLLOUT tracked by issue #2718. The scenarios' expected
        # verdicts were authored for a Claude grader, so a cross-family grader
        # may shift borderline verdicts. The skip-net in eval-prompt-change.py
        # still neutral-skips genuine provider outages.
        if: |
          github.event_name == 'pull_request' &&
          needs.check-paths.outputs.spec_evals_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/eval/eval-prompt-change.py --prompt .claude/commands/spec.md --scenarios tests/evals/spec-scenarios.json --provider github --model openai/gpt-5 --base-ref "$BASE_REF"

  skip-validation:
    runs-on: ubuntu-24.04-arm
    needs: check-paths
    if: needs.check-paths.outputs.should-run-commands != 'true'
    permissions: {}
    steps:
      - name: Skip validation
        run: echo "No slash command changes detected, skipping validation"
