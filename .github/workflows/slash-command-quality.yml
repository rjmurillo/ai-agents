name: Slash Command Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# ADR-064 (issue #5632) retired `.claude/commands/`, so the slash-command
# validator this workflow was built around has no corpus and its filter and step
# are gone. What remains is the /spec behavioral eval, which is the only gate
# here that ever read a prompt's content. The workflow and job names are
# deliberately unchanged: a job name is a branch-protection identifier, and
# renaming one ahead of the ruleset blocks every PR (ci-scripts.md MUST 22).
jobs:
  check-paths:
    runs-on: ubuntu-24.04-arm
    permissions:
      pull-requests: read
    outputs:
      spec_evals_changed: ${{ steps.filter.outputs.spec_command == 'true' || steps.filter.outputs.spec_evals == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            spec_command:
              # The whole skill directory, not just SKILL.md. The eval compares
              # the prompt surface the agent actually loads, which since ADR-064
              # is the body plus every references/*.md beside it, so an edit to
              # a reference changes graded behavior and has to fire this gate.
              - '.claude/skills/spec/**'
            spec_evals:
              - 'tests/evals/spec-scenarios.json'
              - 'scripts/eval/eval-prompt-change.py'

  validate-slash-commands:
    runs-on: ubuntu-24.04-arm
    needs: check-paths
    if: needs.check-paths.outputs.spec_evals_changed == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          enable-pester: false
          enable-git-hooks: false

      - name: Install eval extra (openai grader)
        # setup-code-env installs only .[dev]; the github provider grader needs
        # the openai package from .[eval]. Without this, eval-prompt-change.py
        # exits 3 (missing package is not a provider outage, so the skip-net
        # does not neutral-skip it). Gated on the same condition as the eval so
        # it only runs when the /spec eval actually fires.
        if: |
          github.event_name == 'pull_request' &&
          needs.check-paths.outputs.spec_evals_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: uv pip install --system -e ".[eval]"

      - name: Run /spec behavioral evals
        # Grader: claude-sonnet-4-6 via the Anthropic API (ANTHROPIC_API_KEY
        # CI secret). GitHub Models retired permanently on 2026-07-30; the
        # three retirement-brownout markers have been removed from the skip-net
        # in eval-prompt-change.py so it covers only genuine transient outages.
        # Refs #4339.
        if: |
          github.event_name == 'pull_request' &&
          needs.check-paths.outputs.spec_evals_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/eval/eval-prompt-change.py --prompt .claude/skills/spec/SKILL.md --renamed-from .claude/commands/spec.md --scenarios tests/evals/spec-scenarios.json --base-ref "$BASE_REF"

  skip-validation:
    runs-on: ubuntu-24.04-arm
    needs: check-paths
    if: needs.check-paths.outputs.spec_evals_changed != 'true'
    permissions: {}
    steps:
      - name: Skip validation
        run: echo "No /spec prompt or scenario changes detected, skipping evals"
