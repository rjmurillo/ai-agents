# Promotion Gate
#
# ADR-113 decision 1: one checked-in program, scripts/validation/promotion_gate.py,
# computes the release promotion verdict from persisted validator evidence.
# This workflow only calls it. By hand (workflow_dispatch) the mode input
# defaults to advisory: the program writes a manifest and exits 0 whatever the
# verdict, and the manifest says so.
# publish.yml calls it (workflow_call) with mode enforcing for a real publish and
# advisory for a dry run. Enforcing mode exits 1 on a block, which fails the
# job and so the publish. ADR-113 decision 5 keeps the tag route dormant until
# the v* tag ruleset exists, and the job below runs only from the default
# branch, so a tag push cannot reach it.
#
# Run it from the default branch only. The candidate SHA is an input. Evidence
# comes from fetch_promotion_evidence.py, which downloads an artifact only from
# a push or merge-queue run of the expected workflow on the candidate commit
# (ADR-113 decision 5). The job reads no artifact from a pull request.

name: Promotion Gate

on:
  workflow_call:
    inputs:
      candidate-sha:
        description: 'Full 40-character commit SHA of the promotion candidate'
        required: true
        type: string
      candidate-digest:
        description: 'SHA-256 digest of the built npm tarball'
        required: false
        default: ''
        type: string
      release-tag:
        description: 'Existing release tag to attach the manifest to (empty to skip)'
        required: false
        default: ''
        type: string
      mode:
        description: 'advisory or enforcing'
        required: false
        default: 'advisory'
        type: string
      build-run-id:
        description: 'Run id holding the build-tier evidence (the caller run), empty for none'
        required: false
        default: ''
        type: string
      attach-manifest:
        description: 'False when the caller attaches the manifest itself, after its publish'
        required: false
        default: true
        type: boolean
    outputs:
      verdict:
        description: 'promote or block'
        value: ${{ jobs.gate.outputs.verdict }}
      promoted:
        description: 'true for an enforced, digest-bound promote verdict'
        value: ${{ jobs.gate.outputs.promoted }}
      release_eligible:
        description: 'true when the promoted verdict also names a verified tag'
        value: ${{ jobs.gate.outputs.release_eligible }}
  workflow_dispatch:
    inputs:
      candidate-sha:
        description: 'Full 40-character commit SHA of the promotion candidate'
        required: true
        type: string
      candidate-digest:
        description: 'SHA-256 digest of the built npm tarball, if built'
        required: false
        default: ''
        type: string
      release-tag:
        description: 'Existing release tag to attach the manifest to (empty to skip)'
        required: false
        default: ''
        type: string
      mode:
        description: 'advisory writes a manifest and exits 0, enforcing exits 1 on a block'
        required: false
        default: 'advisory'
        type: choice
        options:
          - 'advisory'
          - 'enforcing'
      attach-manifest:
        description: 'Attach the manifest to the release named above when the verdict allows'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.candidate-sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  gate:
    name: Compute promotion manifest
    # Run from the default branch only. A dispatch from another branch would run
    # that branch's copy of the gate program (ADR-113 decision 5).
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      verdict: ${{ steps.manifest.outputs.verdict }}
      promoted: ${{ steps.manifest.outputs.promoted }}
      release_eligible: ${{ steps.manifest.outputs.release_eligible }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      # Full history and tags: the gate checks that the candidate is an
      # ancestor of the default branch head and that a named tag resolves to it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup code environment
        uses: ./.github/actions/setup-code-env
        with:
          # The setup action only checks that gh runs and exports this value as
          # GH_TOKEN, so it gets none. Only the fetch steps hold a token.
          gh-token: ''
          enable-pester: false
          enable-git-hooks: false

      # ADR-113 decisions 2 and 5. The program asks the API for the candidate's
      # runs and downloads an artifact only from a run whose event, workflow,
      # branch, and head SHA match, then keeps the worse of the artifact and the
      # job's check-run. It runs here, from the default branch, so no pull
      # request or candidate code decides what counts. Only this step holds a
      # token, and it is read-only.
      - name: Fetch verified evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: >-
          uv run --frozen python scripts/validation/fetch_promotion_evidence.py
          --repo "$REPOSITORY"
          --candidate-sha "$CANDIDATE_SHA"
          --default-branch "$DEFAULT_BRANCH"
          --evidence-dir "$RUNNER_TEMP/evidence"
          --build-run-id "$BUILD_RUN_ID"

      # ADR-113 Resolved Question 3. The previous promoted manifest is a release
      # asset. It feeds only the non-blocking remediated class, and a first
      # promotion has none, which the step records in no-baseline.json. The gate
      # refuses a directory with neither file. The step fails closed: it exits
      # non-zero when GitHub cannot answer or the newest asset is not a promoted
      # manifest, and that fails this job before any manifest is written, in advisory
      # mode too.
      - name: Fetch the previous promoted manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          uv run --frozen python scripts/validation/fetch_previous_manifest.py
          --repo "$REPOSITORY"
          --current-tag "$RELEASE_TAG"
          --output-dir "$RUNNER_TEMP/previous"

      - name: Compute the promotion manifest
        id: manifest
        env:
          CANDIDATE_SHA: ${{ inputs.candidate-sha }}
          CANDIDATE_DIGEST: ${{ inputs.candidate-digest }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          MODE: ${{ inputs.mode }}
        run: >-
          uv run --frozen python scripts/validation/promotion_gate.py
          --evidence-dir "$RUNNER_TEMP/evidence"
          --candidate-sha "$CANDIDATE_SHA"
          --candidate-digest "$CANDIDATE_DIGEST"
          --ancestor-of HEAD
          --expect-tag "$RELEASE_TAG"
          --previous-manifest-dir "$RUNNER_TEMP/previous"
          --output "$RUNNER_TEMP/promotion-manifest.json"
          --github-output "$GITHUB_OUTPUT"
          --mode "$MODE"

      - name: Upload the manifest
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: promotion-manifest
          path: ${{ runner.temp }}/promotion-manifest.json
          if-no-files-found: error

  # The only job with a write token (ADR-113 Resolved Question 3). It checks
  # out nothing, runs no candidate code, and does not parse the manifest. It
  # attaches the file to an existing release and never creates a release or tag.
  # It runs only for an enforced promote verdict, so a blocked or advisory
  # manifest never becomes the baseline for the remediated class (decision 9).
  # The gate step has already checked that the tag resolves to the candidate.
  # A real publish runs the gate in enforcing mode, so this job runs after one;
  # a dry run and a manual dispatch are advisory and never attach a manifest.
  release-manifest:
    name: Attach manifest to release
    needs: gate
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && inputs.release-tag != ''
      && inputs.attach-manifest
      && needs.gate.outputs.release_eligible == 'true' }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Download the manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: promotion-manifest
          path: ${{ runner.temp }}/manifest

      - name: Attach the manifest to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release upload "$RELEASE_TAG"
          "$RUNNER_TEMP/manifest/promotion-manifest.json"
          --clobber --repo "$REPOSITORY"
