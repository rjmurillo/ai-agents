name: Publish Training Wiki
# Issue #7202, epic #7201. One-way mirror of docs/training/ to the GitHub wiki.
# This file holds triggers and calls. Every decision lives in
# scripts/ci/publish_wiki.py, which has the tests (ADR-006).
#
# The wiki is read-only for people: a wiki edit is overwritten on the next run.
#
#   dry-run  Manual dispatch with dry_run on (the default). No environment, no
#            secret, contents: read. It clones the public wiki without a
#            credential and prints the planned diff, so a branch can run it.
#   publish  Push to main, or a manual dispatch with dry_run off. It names the
#            environment wiki-publish, which holds the only credential
#            WIKI_PUSH_TOKEN. ADR-101 keeps stored secrets out of repository
#            scope (tests/ci/test_workflow_secret_environment_scope.py). The
#            job runs only for main (a dispatch from a branch with dry_run off
#            is skipped), and the environment should also allow only main as a
#            second control. Without the secret the job falls back to the
#            workflow token.
#
# The script reports BLOCKED (exit 4) when the wiki refuses the credential, and
# SKIP (exit 0) when the wiki repo does not exist yet or no credential is
# present.
on:
  push:
    branches: [main]
    paths:
      - 'docs/training/**'
      - 'scripts/ci/publish_wiki.py'
      - 'scripts/ci/_wiki_links.py'
      - '.github/workflows/publish-wiki.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the planned wiki diff and push nothing'
        required: false
        default: true
        type: boolean
permissions: {}
concurrency:
  group: publish-wiki-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dry-run:
    name: Plan the wiki diff
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan
        run: python3 scripts/ci/publish_wiki.py --dry-run
  publish:
    name: Mirror docs/training to the wiki
    if: ${{ github.event_name == 'push' || (!inputs.dry_run && github.ref == 'refs/heads/main') }}
    environment: wiki-publish
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN || github.token }}
        run: python3 scripts/ci/publish_wiki.py
