name: Auto-Merge Dependabot PRs

# Enables auto-merge on Dependabot PRs with the per-run GITHUB_TOKEN.
# Renovate needs no workflow here: it merges through its own platform
# auto-merge (renovate.json). Required status checks still gate every
# merge. No AI and no stored secret is on this path.
#
# Security: all PR-supplied values (html_url, title) are passed via env and
# referenced as quoted shell variables, never interpolated into run blocks.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dependabot:
    name: Dependabot (GitHub Actions and Python)
    # gh pr merge --auto needs both write scopes. The job checks out no PR code.
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-26.04-arm
    # Gate on the PR author, not github.actor. The actor can be Dependabot on
    # a PR someone else wrote, and this job holds a write token (the
    # confused deputy pattern, CWE-441).
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Fetch metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # GITHUB_TOKEN is always available to the workflow, including in
          # Dependabot PR contexts where repo secrets are not exposed.
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
