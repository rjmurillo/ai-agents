# yaml-language-server: $schema=https://json.schemastore.org/github-labeler.json

# Label configuration for actions/labeler@v6
# Automatically applies labels to PRs based on file paths and branch names
# Labels aligned with existing repository label configuration

# ============================================================================
# AREA LABELS (aligned with existing area-* labels)
# ============================================================================

area-workflows:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
          - ".github/actions/**/*"

area-prompts:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/prompts/**/*"
          - "**/*.prompt.md"

area-installation:
  - changed-files:
      - any-glob-to-any-file:
          - "scripts/Install-*.ps1"
          - "scripts/Setup-*.ps1"
          - "**/install*.ps1"
          - "**/setup*.ps1"

area-infrastructure:
  - changed-files:
      - any-glob-to-any-file:
          - "build/**/*"
          - ".github/dependabot.yml"
          - ".github/labeler.yml"
          - ".github/FUNDING.yml"
          - ".markdownlint-cli2.yaml"
          - ".coderabbit.yaml"
          - ".gitignore"

area-skills:
  - changed-files:
      - any-glob-to-any-file:
          - ".claude/skills/**/*"
          - ".serena/memories/skill-*.md"

# ============================================================================
# CONTENT TYPE LABELS
# ============================================================================

documentation:
  # Match markdown files but exclude agent/memory working directories
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - "**/*.md"
      - changed-files:
          - all-globs-to-all-files:
              - "!.agents/**/*.md"
              - "!.project-toolkit/**/*.md"
              - "!.serena/memories/**/*.md"
              - "!src/**/*.md"
  # Always match docs directory
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**/*"
  # Match docs branches
  - head-branch:
      - "^docs[/-]"

github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**/*"
          - ".github/actions/**/*"
  - head-branch:
      - "^ci[/-]"

automation:
  - changed-files:
      - any-glob-to-any-file:
          - "lefthook.yml"
          - "lefthook.yaml"
          - "lefthook.json"
          - "lefthook.jsonc"
          - "lefthook.toml"
          - ".lefthook.yml"
          - ".lefthook.yaml"
          - ".lefthook.json"
          - ".lefthook.jsonc"
          - ".lefthook.toml"
          - "lefthook-local.yml"
          - "lefthook-local.yaml"
          - "lefthook-local.json"
          - "lefthook-local.jsonc"
          - "lefthook-local.toml"
          - ".lefthook-local.yml"
          - ".lefthook-local.yaml"
          - ".lefthook-local.json"
          - ".lefthook-local.jsonc"
          - ".lefthook-local.toml"
          - ".config/lefthook.yml"
          - ".config/lefthook.yaml"
          - ".config/lefthook.json"
          - ".config/lefthook.jsonc"
          - ".config/lefthook.toml"
          - ".config/lefthook-local.yml"
          - ".config/lefthook-local.yaml"
          - ".config/lefthook-local.json"
          - ".config/lefthook-local.jsonc"
          - ".config/lefthook-local.toml"
          - "scripts/**/*"
          - ".github/scripts/**/*"
  - head-branch:
      - "^copilot[/-]"
      - "^latta[/-]"
      - "^chore[/-]"
      - "^refactor[/-]"
      - "^style[/-]"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "**/package.json"
          - "**/package-lock.json"
          - ".github/dependabot.yml"
  - head-branch:
      - "^dependabot[/-]"
      - "^deps[/-]"
      - "^build[/-]"

