rules:
  - id: script_python_first_new_scripts
    agent: quality
    title: "New scripts should be Python-first (ADR-042)"
    description: |
      ADR-042 supersedes ADR-005 for new development.
      New internal automation scripts should be Python. PowerShell scripts are
      grandfathered and may be edited or migrated over time.
    importance: 9

    match:
      file_glob:
        - "**/*.sh"
        - "**/*.ps1"
        - "**/*.psm1"
        - "!.githooks/**"      # Git hooks are pre-existing exception
        - "!.github/actions/**/*.sh"  # External actions may have shell

    checklist:
      - "Flag newly ADDED .sh, .ps1, or .psm1 script files, not edits to existing grandfathered scripts"
      - "Verify this isn't an existing PowerShell script edit or approved exception"
      - "Suggest a Python implementation for new internal automation"
      - "Reference ADR-042 for rationale"

    examples:
      bad: |
        # build.ps1
        [CmdletBinding()]
        param()
        docker build -t myapp .
      good: |
        # build.py
        import subprocess

        subprocess.run(["docker", "build", "-t", "myapp", "."], check=True)

    tags:
      - architecture
      - python
      - powershell
      - compliance

    why_important: |
      Python is the primary language for new internal automation, while
      existing PowerShell remains supported during the migration.

    link: .agents/architecture/ADR-042-python-migration-strategy.md


  - id: ps_cmdletbinding_required
    agent: quality
    title: "PowerShell functions should use [CmdletBinding()]"
    description: |
      Functions without [CmdletBinding()] lack parameter validation,
      common parameter support, and proper error handling.
    importance: 7

    match:
      file_glob:
        - "**/*.ps1"
        - "**/*.psm1"
        - "!**/*.Tests.ps1"
      content_regex:
        - "function\\s+[A-Z]"

    checklist:
      - "Find functions that don't have [CmdletBinding()] attribute"
      - "Check if function accepts parameters"
      - "Verify parameter validation is present"
      - "Suggest adding [CmdletBinding()] for better error handling"

    examples:
      bad: |
        function Get-UserData {
            param([string]$UserId)
            # No parameter validation
            # No common parameters (-Verbose, -ErrorAction, etc.)
        }
      good: |
        function Get-UserData {
            [CmdletBinding()]
            param(
                [Parameter(Mandatory)]
                [ValidateNotNullOrEmpty()]
                [string]$UserId
            )
            # Supports common parameters
            # Has parameter validation
        }

    tags:
      - powershell
      - quality
      - error-handling


  - id: ps_error_handling_required
    agent: bugs
    title: "Complex PowerShell functions need error handling"
    description: |
      Functions with multiple operations or external calls should use
      try-catch blocks to handle errors gracefully.
    importance: 8

    match:
      file_glob:
        - "**/*.ps1"
        - "**/*.psm1"
        - "!**/*.Tests.ps1"
      content_regex:
        - "\\b(Invoke-RestMethod|Invoke-WebRequest|gh|git)\\s"

    checklist:
      - "Find functions making external calls (gh, git, API calls)"
      - "Check if try-catch block exists"
      - "Verify error messages are descriptive"
      - "Ensure errors are either handled or propagated with context"

    examples:
      bad: |
        function Get-PRData {
            [CmdletBinding()]
            param([int]$PRNumber)
            
            gh pr view $PRNumber --json title,body | ConvertFrom-Json
            # No error handling - fails silently or with unclear error
        }
      good: |
        function Get-PRData {
            [CmdletBinding()]
            param(
                [Parameter(Mandatory)]
                [int]$PRNumber
            )
            
            try {
                # Use splatting for external commands to ensure proper argument handling
                $ghArgs = @('pr', 'view', $PRNumber, '--json', 'title,body')
                $result = & gh @ghArgs 2>&1
                if (-not $?) {
                    throw "Failed to fetch PR #$PRNumber: $result"
                }
                return $result | ConvertFrom-Json
            }
            catch {
                Write-Error "Error retrieving PR #$PRNumber: $_"
                throw
            }
        }

    tags:
      - powershell
      - error-handling
      - bugs


  - id: ps_avoid_write_host_in_modules
    agent: quality
    title: "Use Write-Output instead of Write-Host in modules"
    description: |
      Write-Host writes directly to console and cannot be captured or tested.
      Use Write-Output for testable output in modules and scripts.
    importance: 6

    match:
      file_glob:
        - "**/*.psm1"
        - "scripts/**/*.ps1"
      content_regex:
        - "Write-Host"

    checklist:
      - "Find Write-Host usage in modules or utility scripts"
      - "Check if output needs to be testable"
      - "Suggest Write-Output, Write-Verbose, or Write-Information"
      - "For progress updates, suggest Write-Progress"

    examples:
      bad: |
        function Get-Results {
            $data = Get-Data
            Write-Host "Found $($data.Count) items"
            return $data
        }
      good: |
        function Get-Results {
            [CmdletBinding()]
            param()
            
            $data = Get-Data
            Write-Verbose "Found $($data.Count) items"
            return $data
        }

    tags:
      - powershell
      - testability
      - quality


  - id: ps_proper_parameter_validation
    agent: quality
    title: "PowerShell parameters should have validation attributes"
    description: |
      Parameters accepting user input should have appropriate validation
      attributes to fail fast with clear error messages.
    importance: 7

    match:
      file_glob:
        - "**/*.ps1"
        - "**/*.psm1"
        - "!**/*.Tests.ps1"
      content_regex:
        - "\\[Parameter\\(Mandatory\\)\\]"

    checklist:
      - "Find mandatory parameters without validation attributes"
      - "Check for [ValidateNotNullOrEmpty()] on strings"
      - "Check for [ValidateRange()] on numeric parameters"
      - "Check for [ValidateSet()] for enum-like parameters"
      - "Verify file paths use [ValidateScript({ Test-Path $_ })]"

    examples:
      bad: |
        function Update-Config {
            [CmdletBinding()]
            param(
                [Parameter(Mandatory)]
                [string]$ConfigPath,
                [int]$RetryCount
            )
        }
      good: |
        function Update-Config {
            [CmdletBinding()]
            param(
                [Parameter(Mandatory)]
                [ValidateScript({ Test-Path $_ })]
                [string]$ConfigPath,
                
                [ValidateRange(1, 10)]
                [int]$RetryCount = 3
            )
        }

    tags:
      - powershell
      - validation
      - error-handling
