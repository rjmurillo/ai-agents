# taste-lint: ignore file-size, hook config is one executable contract and splitting would hide stage order.
min_version: 2.1.10
no_auto_install: true
lefthook: uv run --frozen lefthook
glob_matcher: doublestar

commit-msg:
  jobs:
    - name: commit-message-policy
      timeout: 30s
      run: uv run --frozen python scripts/validation/git_hook_policy.py commit-message "{1}"

pre-merge-commit:
  jobs:
    - name: security-suppressions-staged
      timeout: 2m
      run: uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-staged

pre-commit:
  piped: true
  jobs:
    # Issue #4698: a push can write core.bare=true into the shared .git/config,
    # which leaves every worktree unable to run a command needing a work tree.
    # It runs first because the failures it causes name the wrong component:
    # the incident produced four unrelated-looking diagnoses before the shared
    # cause was found. One accurate message has to precede all of them.
    # Cap sized from the script's own budget, not from a default. The script
    # holds GIT_BUDGET_SECONDS = 7 across the whole evaluation and exits 3 when
    # it runs out, so this 10s cap is that budget plus 3s of interpreter
    # headroom and is never what stops the job. Measured on this checkout:
    # 0.077s and 0.130s warm, 0.944s on the run that also built the venv.
    # The per-call GIT_TIMEOUT_SECONDS = 5 watchdog does NOT bound the run: the
    # corrupted path issues five sequential git calls, so the watchdog alone
    # allows 25s and lefthook would kill the job before it printed the repair,
    # which is the one message this gate exists to deliver.
    # `tests/validation/test_check_repo_health_budget.py` parses this cap and
    # fails if either number moves without the other. The pair below is funded
    # from one allocation (see repair-packed-refs) so the stage's declared worst
    # case does not rise; ADR-104 rule 7 and
    # `tests/ci/test_lefthook_declared_budget.py` both refuse a cap that does.
    - name: repo-health
      timeout: 10s
      run: uv run --frozen python scripts/validation/check_repo_health.py

    - name: repair-packed-refs
      timeout: 20s
      run: uv run --frozen python scripts/maintenance/repair_packed_refs.py

    - name: branch-policy
      timeout: 2m
      run: uv run --frozen python scripts/validation/git_hook_policy.py branch

    - name: branch-context-policy
      timeout: 2m
      run: uv run --frozen python scripts/validation/git_hook_policy.py branch-context

    # Issue #5123: a commit landing while a push for this branch name is
    # still running its pre-push suite (6-15 minutes), in this worktree or
    # any other checkout of the same branch on this machine, can corrupt any
    # test whose fixture reads live git state. Reuses the existing per-branch
    # push-lock file (push-lock.md) rather than a second scheme; blocks only
    # when that lock is currently held. Bypass: SKIP_PUSH_LOCK_COMMIT_GUARD=1.
    # 30s -> 20s pays for repo-health's 10s above, so the pre-commit declared
    # worst case is unchanged. This job's own bound is one subprocess under a
    # `timeout=10` plus a non-blocking flock probe, and it measured 0.087s here,
    # so 20s is still twice its internal ceiling.
    - name: push-lock-commit-guard
      timeout: 20s
      run: uv run --frozen python scripts/validation/check_push_lock_before_commit.py

    - group:
        piped: true
        jobs:
          - name: markdown-autofix
            timeout: 5m
            run: uv run --frozen python scripts/validation/pre_pr.py --markdown-lint-only -- {staged_files}
            glob: "**/*.md"
            stage_fixed: true
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: markdown-check
            timeout: 5m
            run: uv run --frozen python scripts/validation/pre_pr.py --markdown-lint-only -- {staged_files}
            env:
              SKIP_AUTOFIX: "1"
            glob: "**/*.md"
            skip:
              - merge

    - group:
        parallel: true
        jobs:
          - name: root-hygiene-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py root-hygiene {staged_files}
            skip:
              - merge

          - name: session-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py session {staged_files}
            glob: ".agents/**"
            skip:
              - merge

          - name: staged-dash-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py staged-dashes {staged_files}
            glob: "**/*.md"
            exclude:
              - "node_modules/**"
              - ".venv/**"
              - ".serena/cache/**"
              - "tests/hooks/fixtures/**"
            skip:
              - merge

          - name: action-pin-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py staged-action-pins {staged_files}
            glob:
              - ".github/workflows/*.{yml,yaml}"
              - ".github/actions/**/*.{yml,yaml}"

          # Issue #4600: .gitignore names root litter one filename at a time,
          # so agent-authored scratch matches no entry.
          - name: root-scratch-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py root-scratch {staged_files}
            skip:
              - merge

          # Issue #3671: nothing stopped a conflict marker reaching a commit.
          - name: conflict-marker-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py staged-conflict-markers {staged_files}
            exclude:
              - "tests/hooks/fixtures/**"

          - name: python-autofix
            timeout: 5m
            run: uv run --frozen --extra dev ruff check --fix --exit-zero -- {staged_files}
            glob: "**/*.py"
            stage_fixed: true
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: python-check
            timeout: 5m
            run: uv run --frozen --extra dev ruff check --exit-zero -- {staged_files}
            glob: "**/*.py"

          - name: workflow-validation
            timeout: 5m
            run: uv run --frozen python scripts/validate_workflows.py {staged_files}
            glob:
              - ".github/workflows/*.{yml,yaml}"
              - ".github/actions/**/*.{yml,yaml}"

          - name: actionlint
            timeout: 5m
            # Issue #2374: shellcheck's `info` and `style` tiers (SC2086
            # quoting advice, SC2129 grouped redirects) are advisory here, and
            # the workflow tree carries them on baseline. Raise the floor to
            # `warning` so this hook enforces the same policy as
            # `scripts/validation/checks_tooling.py:validate_workflow_yaml` and
            # `scripts/validation/run_workflow_local_test.py`, which already
            # do. Without it this hook blocks any commit touching one of the
            # six workflow files that carry baseline advisory findings.
            run: >-
              SHELLCHECK_OPTS="${SHELLCHECK_OPTS:+$SHELLCHECK_OPTS }--severity=warning"
              actionlint {staged_files}
            glob: ".github/workflows/**/*.{yml,yaml}"
            skip:
              - run: >-
                  test "$SKIP_ACTIONLINT" = "1" ||
                  ! command -v actionlint >/dev/null 2>&1

          - name: yaml-advisory
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py yamllint {staged_files}
            glob: "**/*.{yml,yaml}"

          - name: skillforge
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py skillforge {staged_files}
            glob: "**/SKILL.md"
            exclude:
              - "evals/**"
              # The generated command mirrors under src/copilot-cli/skills/ are
              # skipped by _skip_skillforge_path in git_hook_policy.py, which
              # derives them from .claude/commands/. Do not enumerate them here:
              # a second copy of that list is what drifts.

          - name: skill-size
            timeout: 5m
            run: uv run --frozen python scripts/validation/skill_size.py --staged-only --ci
            glob: "**/SKILL.md"

          - name: colocated-skill-tests
            timeout: 1m
            run: uv run --frozen python scripts/validation/check_colocated_skill_tests.py --staged-only
            glob: "{.claude/skills,src/copilot-cli/skills,src/claude/skills}/**/tests/**test*.py"

          - name: command-size
            timeout: 5m
            run: uv run --frozen python scripts/validation/command_size.py --changed-files {staged_files} --ci
            glob: ".claude/commands/*.md"

          - name: planning-advisory
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py planning
            glob: ".agents/planning/**/*.md"

          - name: infrastructure-advisory
            timeout: 60s
            run: >-
              uv run --frozen python
              .claude/skills/security-detection/detect_infrastructure.py
              --files {staged_files}
            glob: "**/*"

          - name: adr-review-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py adr-review {staged_files}
            glob:
              - ".agents/architecture/ADR-*.md"
            skip:
              - merge

          - name: taste-advisory
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py taste {staged_files}
            glob: "**/*.{py,ps1,psm1,sh,bash,yml,yaml,md,json}"
            skip:
              - merge

          - name: security-suppressions-staged
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-staged
            glob:
              - "**/*.py"
              - "**/*.pyi"
              - "**/*.pyw"
              - "**/*.js"
              - "**/*.ts"
              - "**/*.ps1"
              - "**/*.psm1"
              - "**/*.yaml"
              - "**/*.yml"
              - "**/*.ipynb"

          - name: subprocess-encoding
            timeout: 2m
            run: uv run --frozen python scripts/validation/check_subprocess_encoding.py
            glob: "**/*.py"
            skip:
              - merge

    - group:
        piped: true
        jobs:
          - name: generate-mcp-config
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py generate-mcp
            glob: ".mcp.json"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: stage-mcp-config
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py stage-generated mcp
            glob: ".mcp.json"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

    - group:
        piped: true
        jobs:
          - name: generate-agents
            timeout: 10m
            run: uv run --frozen python scripts/validation/git_hook_policy.py generate-agents
            glob:
              - "templates/agents/*.shared.md"
              - "templates/platforms/**"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: generate-agent-catalog
            timeout: 10m
            run: uv run --frozen python build/generate_agent_catalog.py
            glob:
              - "templates/agents/*.shared.md"
              - "templates/platforms/**"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: stage-generated-agents
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py stage-generated agents
            glob:
              - "templates/agents/*.shared.md"
              - "templates/platforms/**"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

    - group:
        piped: true
        jobs:
          - name: memory-token-update
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py memory-token-update
            glob: ".serena/memories/**/*.md"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: stage-memory-index
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py stage-generated memory-index
            glob: ".serena/memories/**/*.md"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

    - group:
        parallel: true
        jobs:
          - name: memory-size
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py memory-size
            glob: ".serena/memories/**/*.md"
            skip:
              - merge

          - name: memory-index
            timeout: 5m
            run: uv run --frozen python scripts/validation/memory_index.py --path .serena/memories --ci --orphan-policy ratchet
            glob: ".serena/memories/**/*.md"

          - name: memory-token-counts
            timeout: 5m
            run: uv run --frozen python scripts/update_memory_index_tokens.py --check
            glob: ".serena/memories/**/*.md"

          - name: memory-tier
            timeout: 5m
            run: uv run --frozen python scripts/validate_memory_tier.py --path .serena/memories
            glob: ".serena/memories/**/*.md"

    - group:
        piped: true
        jobs:
          - name: memory-cross-reference
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py memory-cross-reference {staged_files}
            glob: ".serena/memories/**/*.md"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

          - name: stage-memory-cross-references
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py stage-generated memory
            glob: ".serena/memories/**/*.md"
            skip:
              - merge
              - run: test "$SKIP_AUTOFIX" = "1"

    - name: memory-skill-format
      timeout: 5m
      run: uv run --frozen python scripts/validate_skill_format.py --staged-only --ci
      glob: ".serena/memories/**/*.md"

    - name: memory-sync-advisory
      timeout: 5m
      run: uv run --frozen python scripts/validation/git_hook_policy.py memory-sync
      glob: ".serena/memories/**/*.md"
      skip:
        - merge

    - name: extract-session-episodes
      timeout: 10m
      run: uv run --frozen python scripts/validation/git_hook_policy.py extract-episodes {staged_files}
      glob: ".agents/sessions/*.json"
      skip:
        - merge
        - run: test "$SKIP_AUTOFIX" = "1"

    - name: commit-file-count
      timeout: 2m
      run: uv run --frozen python scripts/validation/git_hook_policy.py atomic-commit
      skip:
        - merge

    - name: github-bash-policy
      timeout: 2m
      run: uv run --frozen python scripts/validation/git_hook_policy.py github-bash {staged_files}
      glob: ".github/scripts/**"

    - name: scope-policy
      timeout: 5m
      run: uv run --frozen python scripts/detect_scope_explosion.py

# Issue #5066: pre-push is staged so cheap gates fail before the expensive
# ones start. The hook is `piped: true`, so a failing job or group skips
# everything after it (verified empirically on lefthook 2.1.10: a failing job
# inside a `parallel: true` group makes later top-level jobs report
# "(skip) broken pipe"). Stage order:
#   1. Singleton guards (repo-health, repair-packed-refs, mutation-safety,
#      push-ref-staleness).
#   2. Fast stage, stdin half: the piped group of cheap ref-payload policies.
#   3. Fast stage, parallel half: ratchets and policy gates that each finish
#      in seconds (measured 0.1s-17s standalone on 2026-08-15).
#   4. security-scan (semgrep): expensive stdin consumer. Kept serial as a
#      top-level job because `.claude/rules/ci-scripts.md` MUST-21 forbids
#      `use_stdin: true` inside a `parallel: true` group; the top level of a
#      piped hook delivers the same serialized stdin a piped group does.
#   5. Expensive stage: python-tests, mypy, workflow-local-run,
#      build-all-check, the e2e smokes, pre-pr-validation, plus the advisory
#      reporters that were already scheduled alongside them.
# Only ordering changed; every job body is identical to the pre-#5066 config.
pre-push:
  piped: true
  jobs:
    # Issue #4698: measured twice in one session, a push wrote core.bare=true
    # into the shared .git/config and broke the main checkout plus three of
    # five linked worktrees. The pre-push hook can therefore corrupt the
    # repository it is validating, so this runs before every job whose failure
    # the corruption would otherwise be blamed for.
    # Same 10s as pre-commit, and for the same reason: the cap tracks the
    # script's GIT_BUDGET_SECONDS = 7 shared deadline plus interpreter headroom,
    # not the stage it runs in. The script reports first whatever the machine is
    # doing, so a slow run yields exit 3 naming the git call that ran out rather
    # than a lefthook kill with no diagnosis. This job is a leading serial
    # singleton, ahead of the parallel group, so the loaded-machine contention
    # ci-scripts.md MUST-16 measures on a group member does not apply to it.
    - name: repo-health
      timeout: 10s
      run: uv run --frozen python scripts/validation/check_repo_health.py

    # 1m -> 50s pays for repo-health's 10s above, so the pre-push declared worst
    # case is unchanged. This job's single git call runs under a 15s watchdog, so
    # 50s is still more than three times its internal ceiling.
    - name: repair-packed-refs
      timeout: 50s
      run: uv run --frozen python scripts/maintenance/repair_packed_refs.py

    - name: mutation-safety
      timeout: 30s
      run: uv run --frozen python -m scripts.testing.mutation_workspace check

    # Issue #4634: this job was declared twice, and the copy that ran first
    # passed `{remote}`. Lefthook substitutes positional hook arguments only
    # (`{0}` for all of them, `{1}`..`{n}` for one), so `{remote}` reached the
    # script verbatim, `git ls-remote "{remote}"` resolved nothing, and the
    # check reported success on every push. Git hands pre-push the remote name
    # (or URL) as the first argument, so `{1}` is the supported spelling; the
    # commit-message-policy job above uses the same `"{1}"` form. If a token
    # ever reaches the script unexpanded again, it exits 2 rather than guessing
    # a remote, so the misconfiguration fails the push instead of passing it.
    # Keep this job ahead of the long-running groups: aborting here is the
    # whole point, since the jobs below take 6-15 minutes before git would
    # report the rejection.
    # The 1m timeout is the deleted copy's, which is the safer of the two: the
    # script allows `git ls-remote` 10s per pushed ref, so a push of several
    # refs on a slow link could exceed the 30s this copy carried.
    - name: push-ref-staleness
      timeout: 60s
      run: uv run --frozen python scripts/validation/push_ref_staleness.py "{1}"
      use_stdin: true

    # Fast stage, stdin half (issue #5066). Cheap policies that read the
    # ref-update payload stay in one piped group per ci-scripts.md MUST-21.
    - group:
        piped: true
        jobs:
          - name: push-ref-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py pre-push
            use_stdin: true

          - name: security-suppression-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py security-suppressions-push
            use_stdin: true

          - name: placeholder-identity
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py placeholder-identity
            use_stdin: true

          # Reads the ref-update payload (issue #5128) to derive the real
          # push range independently of lefthook's own {push_files}
          # substitution, which resolves empty on a branch's first push and
          # silently defeats the documentation-only bypass. Stays in this
          # piped group, not the parallel one below, per ci-scripts.md
          # MUST-21: a stdin consumer in a parallel group races the shared
          # stream under Lefthook 2.1.10.
          - name: retrospective-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py retrospective
            use_stdin: true

    # Fast stage, parallel half (issue #5066). Blocking gates that finish in
    # seconds. A failure here skips semgrep and the expensive stage below, so
    # a ratchet or policy miss costs seconds, not a full pytest run.
    - group:
        parallel: true
        jobs:
          - name: count-ratchets
            timeout: 90s
            run: uv run --frozen python scripts/validation/checks_ratchet.py

          - name: python-unreachable-statements
            timeout: 90s
            run: uv run --frozen python scripts/validation/check_unreachable_code.py .

          - name: path-normalization
            timeout: 90s
            run: >-
              uv run --frozen python
              build/scripts/validate_path_normalization.py
              --path . --fail-on-violation

          - name: planning-artifacts
            timeout: 90s
            run: >-
              uv run --frozen python
              build/scripts/validate_planning_artifacts.py
              --path . --fail-on-error

          - name: branch-scope
            timeout: 90s
            run: uv run --frozen python scripts/detect_scope_explosion.py --base-branch origin/main

          - name: branch-context-policy
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py branch-context

          - name: review-axis-drift
            timeout: 90s
            run: uv run --frozen python build/scripts/generate_pr_quality_prompts.py --dry-run

          # Issue #5086: the branch-wide dash scan used to run only inside
          # pre-pr-validation, in the expensive stage, so a one-character
          # violation of universal.md MUST NOT 4 was reported after every
          # fast gate and most of the expensive ones had already run. Same
          # implementation as before (checks_dash.validate_dash_prohibition,
          # reached through git_hook_policy so this process bounds itself in a
          # container); pre_pr.py defers its Em/en-dash gate to this job.
          # No glob, on purpose: issue #5317 established that a deferral
          # target must run on every push, because a glob-skipped lefthook job
          # is indistinguishable from a passed one.
          # Measured on this checkout: 1.1s on a branch with no changed
          # markdown, and 4.94s for the widest scan available here (0.45s to
          # list plus 4.49s to read 1187 markdown files across a 400-commit
          # range, an order of magnitude more than a branch carries). Both are
          # standalone numbers, not in-push ones, so the cap is not sized from
          # them: ci-scripts.md MUST-16 wants a loaded-machine measurement and
          # this job has none yet. 2m is the smallest cap that clears the
          # per-child headroom rule in tests/test_lefthook_integration.py,
          # which credits every git_hook_policy subcommand with
          # DEFAULT_SUBPROCESS_TIMEOUT_SECONDS (90s) and wants 30s of outer
          # margin over it. Funding: none needed. This group is parallel, so
          # its declared worst case is the group maximum, which
          # branch-context-policy already holds at 2m; the pre-push declared
          # total is 3450s before and after.
          - name: dash-prohibition
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py branch-dashes

    # Expensive stdin consumer (issue #5066). Serial on purpose: MUST-21
    # forbids `use_stdin: true` under `parallel: true`, and the piped top
    # level delivers the same full payload here as a piped group would
    # (verified on lefthook 2.1.10). Runs only after the fast stage passes.
    - name: security-scan
      timeout: 15m
      run: uv run --frozen --extra dev python scripts/validation/git_hook_policy.py semgrep-push
      use_stdin: true

    # Expensive stage (issue #5066). Nothing here starts until every gate
    # above has passed. The two e2e jobs keep their pre-#5066
    # `use_stdin: true`-inside-a-parallel-group shape; see
    # tests/ci/test_lefthook_prepush_fast_fail.py for the documented
    # exception.
    - group:
        parallel: true
        jobs:
          - name: pre-pr-validation
            timeout: 4m
            run: uv run --frozen python scripts/validation/pre_pr.py
            env:
              SKIP_AUTOFIX: "1"
              # The five deferral targets are unconditional fast-stage jobs.
              # Because the hook is piped, this job starts only after they pass.
              # Direct pre_pr.py and CI calls leave this unset and run all gates.
              AI_AGENTS_PRE_PR_FAST_STAGE_RAN: "1"
              # This job's own timeout (above) in seconds, so the
              # generated-staleness gate can clamp its deadline to the
              # process's remaining share; a test pins the two values.
              PRE_PR_OUTER_CAP_SECONDS: "240"

          - name: worktree-gc-report
            timeout: 2m
            run: uv run --frozen python scripts/maintenance/gc_worktrees.py || echo "worktree-gc-report exited non-zero; ignored because this job is advisory (issue 4257)"

          # Runs the import-graph subset for the push when the graph can map
          # every changed file, and a whole-suite collection smoke when it
          # cannot. It does not execute the whole suite: that duplicates the
          # `pytest.yml` partition matrix CI runs on the same commit, and on a
          # container checkout it was 475s of a 679s push, long enough that a
          # container restart killed the push before it reached the remote gate
          # the local copy was imitating. The 15m cap is the ceiling for the
          # opt-in `AI_AGENTS_PYTEST_FULL_SUITE_LOCALLY=1` path, whose inner
          # aggregate budget is 780s on a workstation; the default path is
          # bounded by the inner 300s collection budget, not by this. Both
          # figures are workstation ones: inside a managed container
          # `run_pytest` clamps whichever aggregate applies to 150s before it
          # starts a child, so neither number is what bounds a container push.
          # See ADR-104.
          - name: python-tests
            timeout: 15m
            run: uv run --frozen python scripts/validation/git_hook_policy.py pytest
            env:
              AI_AGENTS_PYTEST_WORKER_CAP: "4"

          # Issue #4494: a test_*.py inside testpaths that defines no test
          # collects nothing, is counted in no failure, and reads as a passing
          # suite forever. Scheduled here rather than in the fast stage because
          # its cost is one pytest collection over testpaths (13s standalone,
          # 28,893 items), which is the same work python-tests beside it does;
          # the fast stage is for gates that finish in seconds. The 4m cap is
          # the per-job container ceiling, sized for a loaded machine rather
          # than the standalone number (ci-scripts.md MUST-16).
          #
          # Copilot review round 8 (PR #5344): no `glob` here on purpose. This
          # is a whole-tree check, not a diff-scoped one, and `.claude/rules/
          # ci-scripts.md`'s "Path filters gate the diff, never the tree"
          # section's "whole tree MUST run" rule applies to local pre-push the
          # same way it applies to the CI job this mirrors
          # (`zero-collection-guard` in `.github/workflows/pytest.yml`). A
          # non-Python push (`uv.lock`, `.python-version`) changes the pytest
          # environment this script measures, so filtering it out here would
          # let a lock-only push skip the one local check that would catch a
          # regression the environment change introduced.
          - name: zero-collection-tests
            timeout: 4m
            run: uv run --frozen python scripts/validation/check_zero_collection_tests.py

          - name: python-lint-advisory
            timeout: 2m
            run: uv run --frozen --extra dev ruff check --exit-zero -- {push_files}
            glob: "**/*.py"

          - name: python-type-check
            timeout: 2m
            run: uv run --frozen --extra dev python scripts/validation/git_hook_policy.py mypy {push_files}
            glob: "**/*.py"
            exclude:
              - ".claude/lib/**"
              - ".claude/hooks/**"
              - ".claude/skills/**"
              - "src/copilot-cli/lib/**"
              - "src/copilot-cli/hooks/**"
              - "src/copilot-cli/skills/**"
              - "tests/skills/**"
              - "docs/**"
              - "evals/**"

          - name: infrastructure-advisory
            timeout: 60s
            run: uv run --frozen python .claude/skills/security-detection/detect_infrastructure.py --files {push_files}
            glob: "**/*"

          # Kept at main's 30m. Cut to 10m earlier on this branch and put
          # back in review (PR #5319): rule 7 sizes a cap from a measured
          # worst case and this job has no such measurement. A push carrying
          # a workflow change does fire it, but in a container it reports
          # DEGRADED in 0.42s because actionlint is not installed there, so
          # the firing path a container can measure is not the path the cap
          # protects. On a workstation with actionlint present the job runs
          # `act`, and a 10m cap could kill a legitimate run to buy a number
          # in a declared-budget table. The container exposure this branch is
          # about is closed by the subprocess clamp, not by this cap.
          - name: workflow-local-run
            timeout: 30m
            run: uv run --frozen python scripts/validation/git_hook_policy.py workflow-local {push_files}
            glob: ".github/workflows/**/*.{yml,yaml}"

          - name: additions-advisory
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py additions

          - name: hook-anchoring-e2e
            timeout: 20m
            run: uv run --frozen python scripts/validation/git_hook_policy.py cli-hook-e2e
            use_stdin: true
            glob:
              - "build/scripts/generate_hooks.py"
              - "src/copilot-cli/hooks/**"
              - ".claude/hooks/**"
              - ".claude/settings.json"
              - "scripts/validation/validate_hook_anchoring.py"
              - "tests/e2e/test_cli_hook_e2e.py"
              - "tests/e2e/copilot_hook_probe.py"

          - name: plugin-load-e2e
            timeout: 20m
            run: uv run --frozen python scripts/validation/git_hook_policy.py cli-plugin-e2e
            use_stdin: true
            glob:
              - ".claude/.claude-plugin/plugin.json"
              - ".claude/commands/**"
              - ".claude/skills/**"
              - "src/copilot-cli/.claude-plugin/plugin.json"
              - "src/copilot-cli/skills/**"
              - "build/scripts/generate_commands.py"
              - "build/scripts/generate_skills.py"
              - "templates/platforms/copilot-cli.yaml"
              - "tests/e2e/test_plugin_load_smoke.py"
              - "tests/e2e/copilot_hook_probe.py"
              - ".github/workflows/nightly-cli-smoke.yml"

          # Issue #4492 pattern: on the first push of a new branch lefthook's
          # {push_files} fallback includes upstream-only files, which fed every
          # tracked observation file to this job; without a reachable Forgetful
          # service each file burns a 10s MCP timeout and the corpus overruns
          # the 5m cap. The handler derives the real push range from stdin.
          - name: observation-sync-advisory
            timeout: 5m
            run: uv run --frozen python scripts/validation/git_hook_policy.py observations-push
            use_stdin: true
            glob: ".serena/memories/**/*-observations.md"

          - name: bot-cascade-advisory
            timeout: 2m
            run: uv run --frozen python scripts/validation/git_hook_policy.py bot-cascade
