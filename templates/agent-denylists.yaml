# Deny lists for Claude read-only agents (ADR-107, "Read-only agents inherit tools").
#
# A read-only Claude agent omits `tools:` (it inherits every session tool, so MCP
# servers nobody can enumerate stay reachable) and lists in `disallowedTools:` only
# what breaks the #5356 invariant: no shell and no local file mutation. A template
# writes `- $deny:<name>` as one list item. build/scripts/agent_templates.py
# expands it through build/scripts/agent_capabilities.py into one entry per tool per
# prefix variant. An unknown name fails the build. Remote write tools (GitHub,
# DeepWiki, unknown servers) are not listed: they follow the user's permission rules.
#
# Why a sibling file and not templates/toolsets.yaml: toolsets.yaml is read by a
# line-based parser in build/generate_agents_common.py (read_toolset_definitions)
# that only understands named lists of Copilot and VS Code tools. A deny table with
# prefix variants is a different schema and a different consumer.
#
# Every listed entry is printed in the agent's file and in the parent agent listing
# each session, and the per-fixture instruction-byte ceilings cap that growth. Add a
# prefix variant (plugin `mcp__plugin_<plugin>_<server>__<tool>`, claude.ai connector
# `mcp__claude_ai_<Server>__<tool>`) only when a real install needs it and the
# ceilings still hold.

# Placeholders: {server} is the key under `servers`; {claude_ai} expands once per
# name in that server's `claude_ai` list. The trailing `__<tool>` is appended.
prefix_variants:
  - "mcp__{server}"

# Every server in .mcp.json needs an entry: a deny list names it with `server:`, or
# the entry carries `remote_only` with the reason it has no local execution or file
# mutation to deny. tests/build_scripts/test_agent_denylists.py enforces this.
servers:
  serena: {}
  deepwiki:
    remote_only: "DeepWiki is a hosted service. It runs no local command and writes no local file."

denylists:
  # Shell and local editors. Denying Bash keeps the #5356 control (commit
  # 5c8b89781a): with no shell, git config injection and --output file writes are
  # unreachable rather than forbidden.
  builtin-shell-edit:
    tools: [Bash, Edit, MultiEdit, NotebookEdit]

  # Split out because `security` held Write on origin/main (it writes its reports)
  # and keeps it. An agent never loses a capability it held before.
  builtin-write:
    tools: [Write]

  # Serena tools that run a command or change a local file or symbol. Memory tools
  # (write_memory, edit_memory, delete_memory, rename_memory) are not listed: they
  # write .serena/memories/, and `security` held write_memory and edit_memory on
  # origin/main. write_memory through safe_delete_symbol were verified against the
  # tool list of a live Serena session (2026-10-17); execute_shell_command,
  # create_text_file, replace_regex, replace_lines, delete_lines and insert_at_line
  # come from the security review of this change.
  serena-local:
    server: serena
    tools:
      - execute_shell_command
      - create_text_file
      - replace_regex
      - replace_lines
      - delete_lines
      - insert_at_line
      - replace_content
      - replace_in_files
      - replace_symbol_body
      - insert_after_symbol
      - insert_before_symbol
      - rename_symbol
      - safe_delete_symbol
