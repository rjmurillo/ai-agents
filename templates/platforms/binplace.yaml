# Binplace manifest (ADR-109, DESIGN-025 "Binplace manifest schema").
schemaVersion: "1.0"
# Each row maps a template class to its plugin tree and its install tree.
# The build renders templates into plugin_tree, then binplace copies
# plugin_tree into install_tree byte for byte. A row with plugin_tree null
# has no plugin stage. assert_no_claude_writes derives its .claude/
# allowlist from the rows whose install_tree starts with .claude/.
rows:
  - class: agents
    source: templates/agents
    plugin_tree: src/claude/agents
    install_tree: .claude/agents
  - class: skills
    source: templates/skills
    plugin_tree: src/claude/skills
    install_tree: .claude/skills
    compile: skill_templates
  - class: rules
    source: templates/rules
    plugin_tree: src/claude/rules
    install_tree: .claude/rules
  - class: hooks
    # ADR-109 B4: the 13 executables, dispatch_groups.json, and
    # PreToolUse/markdownlint-safe-config.yaml (15 of the 16 hooks-class
    # files; hooks.json is the hooks-json row below).
    source: templates/hooks
    plugin_tree: src/claude/hooks
    install_tree: .claude/hooks
  - class: hooks-github
    # No independent source: the Copilot plugin tree is rendered from the
    # same templates/hooks/ tree as the `hooks` row above, one hop further
    # downstream (build/scripts/generate_hooks.py mirrors src/claude/hooks
    # into src/copilot-cli/hooks). This row's job is only the second
    # binplace hop, src/copilot-cli/hooks -> .github/hooks/*.json, so
    # `source` names the same canonical origin rather than a distinct one
    # (DESIGN-025's excerpt omits `source` for this row; binplace_manifest.py
    # requires a non-empty value, so this row names templates/hooks).
    source: templates/hooks
    plugin_tree: src/copilot-cli/hooks
    install_tree: .github/hooks
  - class: hooks-json
    # hooks.json renders to src/claude/hooks.json (plugin root, ADR-109
    # section 2: "agents/, skills/, rules/, hooks/ plus hooks.json"), not
    # under src/claude/hooks/; this row's plugin_tree carries that
    # file-level path, and binplace_manifest.py's file-mode branch (not
    # its directory-walk) copies it to .claude/hooks/hooks.json.
    source: templates/hooks/hooks.json
    plugin_tree: src/claude/hooks.json
    install_tree: .claude/hooks/hooks.json
    compile: hook_templates
  - class: settings
    # No plugin stage (ADR-109 section 3): .claude/settings.json is
    # repo-local dogfood configuration that ships in no plugin, so
    # hook_templates.py renders it straight from settings.tmpl to
    # install_tree with no src/claude/ hop.
    source: templates/hooks/settings.tmpl
    plugin_tree: null
    install_tree: .claude/settings.json
    compile: hook_templates
  - class: prompts
    # The twelve pr-quality-gate-*.md prompts (REQ-008-01); the other 21
    # .github/prompts/ files are unmanifested and hand-maintained (REQ-026
    # Deferred), so this row's source is the review skill's references
    # directory, not .github/prompts/ itself.
    source: .claude/skills/review/references
    plugin_tree: null
    install_tree: .github/prompts
    compile: generate_pr_quality_prompts
