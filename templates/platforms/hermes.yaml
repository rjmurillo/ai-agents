schemaVersion: "1.0"
provider: "hermes"
# ADR-115 Decision 6: Hermes refuses a plugin over 400 files or 10 MB, so the
# shipped skills go out as several portable Agent Plugins v1 packs. Each pack
# carries its own copy of lib/. build/scripts/hermes_packs.py renders the tree
# and fails the build when this table and the skills on disk disagree.
artifacts:
  skills:
    mode: "hermes-packs"
    sourceDir: "src/claude/skills"
    outputDir: "src/hermes"
    # Budget under the Hermes cap of 400 files, counting lib/ and plugin.json.
    # 381 made room for skillforge's judging module (_conformance_judging.py).
    # 395 adds room for technical-writing's 29 files in the delivery pack
    # (ADR-115 Decision 6).
    # 396 adds room for code-qualities-assessment's references/csharp-parser.md
    # (issue #7406).
    # 397 adds room for references/typescript-parser.md (issue #7435).
    # 398 adds references/python-parser.md (issue #7436).
    # 399 adds references/powershell-parser.md (issue #7437), leaving 1 under the cap.
    packMaxFiles: 399
    # hermes-agent commit whose plugin_guard and install limits this table was
    # measured against. The guard test and the smoke test install this commit.
    hermesCommit: "63d0b94120027d487c9a5235b9ec64b696af1b26"
    # The portable validator needs `metadata` to be a flat string map, and
    # `allowed-tools` to be a string. Every shipped skill nests `metadata`, and 8
    # skills write `allowed-tools` as a list, which Hermes skips at load time
    # (measured at the pinned commit). Hermes only validates `allowed-tools` and
    # never enforces it, so the key goes. The model keys have no Hermes meaning.
    frontmatterDrop:
      - allowed-tools
      - metadata
      - model
      - model-rationale
    # A skill appears in exactly one pack or under `excluded`. A new skill
    # fails the build until it is added here, so a new skill never moves an old
    # one. Moving a shipped skill to another pack changes what its users must
    # install, so it needs an owner decision recorded in ADR-115 Decision 6 and
    # takes every skill its path references connect (the quality pack split
    # delivery when delivery reached 404 files, and the authoring pack moved
    # six skill-authoring skills out of knowledge).
    # The 2026-11-25 move of pipeline-validator and windows-image-updater from
    # delivery to azure-devops is proposed. It awaits the owner ruling on issue
    # #7591 and is not yet recorded in ADR-115.
    packs:
      delivery:
        description: "Project Toolkit skills for GitHub pull request work, planning, build, test, and review gates."
        skills:
          [agent-harness-reference, ai-agents-external-claims, analyze, api-doc-authoring,
           benchmark-models, build, code-qualities-assessment,
           doc-accuracy, dx-review, execution-plans, git-advanced-workflows,
           github, github-url-intercept, maintainer-review, merge-resolver,
           modernize, orphan-ref-validator, plan,
           pr-autofix, pr-babysit, pr-comment-responder, pr-review,
           push-pr, quality-grades, research, reviewer-findings,
           steering-matcher, sync, takeover, taste-lints, test,
           validate-pr-description, validation-authority]
      quality:
        description: "Project Toolkit skills for security and reliability engineering, code and documentation standards, metrics, and independent model review."
        skills:
          [chaos-experiment, codeql-scan, destructive-change-safety, fix-markdown-fences,
           golden-principles, llm-council, metrics, observability, security-review,
           slo-designer, sol-loop, style-enforcement, technical-writing, threat-modeling]
      knowledge:
        description: "Project Toolkit skills for memory, context, decisions, requirements, strategy, and documentation."
        skills:
          [adr-generator, analysis-provenance, autoplan, avoiding-manufactured-work,
           business-strategy, buy-vs-build-framework, checkpoint, chestertons-fence,
           codebase-documenter, context-gather, context-hub-setup,
           curating-memories, cynefin-classifier, decision-critic, decision-question, domain-design,
           evidence-provenance, memory, memory-consolidate, memory-documentary, memory-enhancement, negotiation,
           panning-for-gold, pre-mortem, programming-advisor, prompt-engineer,
           reflect, requirements-interview, retrospective,
           software-engineering-library, spec, using-serena-symbols, work-operating-model,
           world-model-diagnostic]
      authoring:
        description: "Project Toolkit skills for creating, measuring, and tuning skills, context placement, and agent prose."
        skills:
          [context-optimizer, prose-self-check, skill-bootstrap, skillforge, skillify, skillopt]
      azure-devops:
        description: "Project Toolkit skills for Azure DevOps pipeline validation and OneBranch pipeline image updates."
        skills: [pipeline-validator, windows-image-updater]
    # Hermes runs plugin_guard on every install and blocks a dangerous verdict.
    # Exclusion is transitive: a skill that refers to an excluded skill is
    # excluded too, because its reference would point at nothing.
    excluded:
      skill-doctor: "The bundled renderer asset exceeds Hermes' 1 MiB per-file limit."
      adr-review: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      cva-analysis: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      memory-maintenance: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      memory-search: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      planner: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      security-scan: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      stuck-detection: "plugin_guard returns dangerous for this skill (ADR-115 Decision 6)."
      memory-gate: "Refers to excluded skill(s): memory-search."
      memory-reflexion: "Refers to excluded skill(s): memory-maintenance and memory-search."
      review: "Refers to excluded skill(s): security-scan."
      pr-quality: "Refers to excluded skill(s): review."
      security-detection: "Refers to excluded skill(s): review."
      spec-generator: "Refers to excluded skill(s): review."
      ship: "Refers to excluded skill(s): review."
    # A file of a packed skill that no pack carries. The key is
    # `<skill>/<path inside the skill>`. A key that matches no file fails the build.
    excludedFiles:
      pr-comment-responder/references/rule-lossless-queue-reads.md: "Folded path rule kept out of Hermes pack budget (PR #7541)."
      build/references/rule-code-quality.md: "Folded path rule; references observability in the quality pack."
      build/references/rule-powershell.md: "Folded path rule kept out of Hermes pack budget (PR #7541)."
      build/references/rule-csharp.md: "Folded path rule kept out of Hermes pack budget (PR #7541)."
      push-pr/references/rule-push-lock.md: "Folded path rule kept out of Hermes pack budget (PR #7563)."
      test/references/rule-testing.md: "Folded path rule kept out of Hermes pack budget (PR #7563)."
      retrospective/scripts/copilot_journal.py: "Needs the skill-doctor parser, which Hermes does not ship, so --journal always reports unavailable there."
