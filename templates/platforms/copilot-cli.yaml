schemaVersion: "1.0"
provider: "copilot-cli"
artifacts:
  agents:
    sourceDir: ".claude/agents"
    outputDir: "src/copilot-cli/agents"
    sourceSuffix: ".md"
    outputSuffix: ".agent.md"
    excludeFilenames: ["AGENTS.md", "CLAUDE.md"]
  skills:
    sourceDir: ".claude/skills"
    outputDir: "src/copilot-cli/skills"
    mode: "directory-copy"
    # merge-resolver is hard-wired to this repo's layout (gh, .agents/sessions,
    # .serena, session-protocol scripts) and does not generalize to other repos.
    # It stays in .claude/skills for ai-agents' own use but is omitted from the
    # publicly-shipping copilot-cli toolkit (issue #2026).
    excludeFilenames: ["AGENTS.md", "CLAUDE.md", "merge-resolver"]
  commands:
    sourceDir: ".claude/commands"
    outputDir: "src/copilot-cli/skills"
    resourceOutputDir: "src/copilot-cli/commands"
    resourceSuffixes: [".yaml"]
    transform: "command-to-skill"
    appendFrontmatter:
      user-invocable: true
  rules:
    sourceDir: ".claude/rules"
    # Dual-target: ships rules to the canonical Copilot instructions
    # tree AND to the project-toolkit plugin tree so vendor installs
    # via marketplace pick them up alongside agents, skills, and hooks.
    outputDirs:
      - ".github/instructions"
      - "src/copilot-cli/instructions"
    # issue #2892: `.github/instructions` lives in this repo alongside
    # `.claude/`, so keep `.claude/**`-scoped globs here; the in-repo Copilot
    # agent edits `.claude/` sources and must auto-load those rules. The
    # distributed `src/copilot-cli/instructions` tree (installed where
    # `.claude/` does not exist) is intentionally omitted, so it keeps
    # filtering internal-only globs to avoid dead references.
    keepInternalGlobsFor:
      - ".github/instructions"
    sourceSuffix: ".md"
    outputSuffix: ".instructions.md"
    frontmatterRemap:
      paths: applyTo
    frontmatterDrop:
      - alwaysApply
      - priority
  lib:
    sourceDir: ".claude/lib"
    outputDir: "src/copilot-cli/lib"
  hooks:
    settingsSource: ".claude/hooks/hooks.json"
    scriptSource: ".claude/hooks"
    outputConfig: "src/copilot-cli/hooks/hooks.json"
    outputScripts: "src/copilot-cli/hooks"
    # ADR-068 / #2295 / #2342: consolidate safely mergeable events. Keep
    # Stop-family and unclassified events direct. SessionStart and PreCompact
    # dispatchers capture and discard both output channels internally.
    dispatcher: true
    eventRemap:
      PreToolUse: PreToolUse
      PostToolUse: PostToolUse
      Stop: Stop
      SubagentStop: SubagentStop
      PermissionRequest: PermissionRequest
      SessionStart: SessionStart
      SessionEnd: SessionEnd
      UserPromptSubmit: UserPromptSubmit
      PostToolUseFailure: PostToolUseFailure
      PreCompact: PreCompact
    eventDrop: []
    matcherPolicy: "inline-script-shim"
    versionField: 1
auditPolicy:
  pathBlocklist:
    - "^/home/"
    - "^/Users/"
    - "^/root/"
    - "@[a-f0-9]{40}\\b"
    - "GITHUB_TOKEN"
    - "SECRET"
  output:
    file: "build/audit/GENERATION-AUDIT.md"
    stdoutFormat: "json"
# Legacy keys: still load-bearing. Consumed by build/generate_agents.py
# (grep `platform.get("legacy")` and `legacy.get(`) for outputDir,
# fileExtension, toolsFrom, handoffSyntax, memoryPrefix, frontmatter, and
# the model_tiers map. Remove this block only after generate_agents.py is
# migrated to read those values from the `artifacts.agents` stanza directly.
legacy:
  # Issue #2052: Copilot CLI plugin loader discovers agents under
  # `agents/` only. Files at the plugin root are silently dropped.
  outputDir: "src/copilot-cli/agents"
  fileExtension: ".agent.md"
  frontmatter:
    includeNameField: true
  # ADR-080 rule 5 / issue #5313: no default `model:` is injected here.
  # generate_agents_common.py resolves a manifest-backed KEEP_PIN entry
  # first (any tier, ADR-080 rule 2), then falls back to the `haiku` entry
  # below (the sole cost exception ADR-080 rule 3 recognizes) when no
  # manifest entry justifies a versioned pin; every other agent inherits
  # the harness default rather than carrying an unjustified versioned pin
  # that breaks on the next model retirement (the retired claude-opus-4.5
  # that motivated this issue). The opus/sonnet entries stay so
  # check_model_pins.py's load_tier_map() can still validate a source unit's
  # bare-alias cost rationale (ADR-080 rule 3).
  model_tiers:
    opus: "claude-opus-4.6"
    sonnet: "claude-sonnet-4.6"
    haiku: "claude-haiku-4.5"
  handoffSyntax: "/agent"
  toolSyntax: "path"
  memoryPrefix: "serena/"
