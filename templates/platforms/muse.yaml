schemaVersion: "1.0"
provider: "muse"
artifacts:
  skills:
    # Muse (Meta's personal agent) reads skills as plain directories
    # holding a SKILL.md whose frontmatter it consumes is name and
    # description only, so this tree renders the shipped Claude skills
    # with a keep-list instead of a drop-list (frontmatterKeep precedent:
    # templates/platforms/cursor.yaml, ADR-115 Decision 2). Muse has no
    # plugin manifest and no install cap, so the tree is flat: skills/
    # plus the shared lib/ the skill scripts resolve against, mirroring
    # the src/claude layout. The Hermes pack exclusions do not apply
    # here: every one is a Hermes plugin_guard verdict (ADR-115
    # Decision 6), and Muse has no equivalent guard, so this tree ships
    # the same skill set as src/codex (ADR-115 Decision 2).
    sourceDir: "src/claude/skills"
    outputDir: "src/muse/skills"
    mode: "directory-copy"
    excludeFilenames: ["AGENTS.md", "CLAUDE.md"]
    frontmatterKeep:
      - name
      - description
