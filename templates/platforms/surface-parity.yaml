# taste-lint: ignore file-size, one row per shipped surface; check_surface_parity.py reads one flat registry, and each host tree adds rows.
# Surface parity manifest (issue #5637).
#
# One row per shipped surface: where it lives, which source it answers to, which
# generator keeps it fresh, and which gate validates it. The reader is
# build/scripts/check_surface_parity.py; the relation vocabulary is in its
# module docstring. build_all.py --check runs the same checks, so CI and a local
# run report one result.
#
# Not a platform config: it carries no `provider:` key, so build_all.py,
# generate_agents.py, and validate_templates_schema.py skip it.
#
# Rules the checker enforces:
#   * Every file under a root belongs to one surface. The most specific path
#     wins; at equal depth the row with `include` wins.
#   * Every path named by binplace.yaml, a platform artifacts stanza, or
#     build_all.OWNED_PREFIXES has a row. Deleting a row fails the gate.
#   * `independent` rows are authored in place and are never compared.
#   * `generated` freshness belongs to the generator; the owner column names the gate.
schemaVersion: "1.0"
roots:
  - src
  - .claude
  - .github
surfaces:
  # ---- Agents -------------------------------------------------------------
  - id: agents-claude-plugin
    path: src/claude/agents
    relation: generated
    authority: templates/agents
    generator: build/scripts/agent_templates.py
    owner: build_all.py --check
  - id: agents-claude-install
    path: .claude/agents
    relation: binplaced
    authority: src/claude/agents
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check; check_agent_content_parity.py
  - id: agents-copilot-cli
    path: src/copilot-cli/agents
    relation: translated
    authority: templates/agents
    generator: build/generate_agents.py
    owner: build_all.py --check; agent-drift-detection.yml
  - id: agents-vscode
    path: src/vs-code-agents
    relation: translated
    authority: templates/agents
    generator: build/generate_agents.py
    include: ["*.agent.md"]
    owner: build_all.py --check; agent-drift-detection.yml
  - id: agents-cursor
    path: src/cursor/agents
    relation: translated
    authority: src/claude/agents
    generator: build/scripts/agent_tree_copy.py
    owner: build_all.py --check
    reason: Frontmatter keeps only name and description, plus readonly for agents whose tools are all read-only. The body is copied unchanged.
  - id: vscode-copilot-instructions
    path: src/vs-code-agents
    relation: independent
    include: ["copilot-instructions.md"]
    reason: Authored in place; no generator writes it.
  - id: agents-github
    path: .github/agents
    relation: binplaced
    authority: src/copilot-cli/agents
    generator: build/scripts/binplace_manifest.py
    include: ["*.agent.md"]
    owner: build_all.py --check; agent-drift-detection.yml
  - id: github-agents-prompt
    path: .github/agents
    relation: independent
    include: ["pr-comment-responder.prompt.md"]
    reason: Authored in place; the generator emits only *.agent.md.
  - id: github-agents-security-references
    path: .github/agents/security/references
    relation: mirrored
    authority: src/claude/security/references
    owner: build/scripts/check_surface_parity.py
    reason: Hand-maintained byte copy; no generator writes it.
  - id: agent-catalog
    path: docs/agent-catalog.md
    relation: generated
    authority: templates/agents
    generator: build/generate_agent_catalog.py
    owner: build_all.py --check

