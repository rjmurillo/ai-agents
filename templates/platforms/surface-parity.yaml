    path: src/copilot-cli/skills
    relation: translated
    authority: src/claude/skills
    generator: build/scripts/generate_skills.py
    authority_exclude: [merge-resolver]
    owner: build_all.py --check
    reason: Frontmatter keys model and model-rationale drop; argument, agent, skill, and tool syntax is rewritten. merge-resolver is excluded (issue #2026).
  - id: skills-cursor
    path: src/cursor/skills
    relation: translated
    authority: src/claude/skills
    generator: build/scripts/generate_skills.py
    owner: build_all.py --check
    reason: SKILL.md frontmatter keeps only name, description, paths, disable-model-invocation, icon, color, and metadata. The body and every support file are copied unchanged.
  - id: skills-review-sidecar-codex
    path: src/codex/skills/review/scripts/validate_review_marker.py
    relation: generated
    authority: scripts/validation/validate_review_marker.py
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
  - id: skills-codex-install
    path: .agents/skills
    relation: binplaced
    authority: src/codex/skills
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
