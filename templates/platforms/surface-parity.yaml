    path: src/copilot-cli/lib
    relation: translated
    authority: .claude/lib
    include: ["*.py"]
    divergent: [paths.py]
    owner: build/scripts/check_surface_parity.py
    reason: Hand-maintained copies of the .claude/lib top-level modules. paths.py differs on purpose; its consumer-side root is .agents, not .project-toolkit.

  # ---- Hermes packs (ADR-115 Decision 6) ----------------------------------
  - id: skills-hermes-packs
    path: src/hermes
    relation: generated
    authority: src/claude/skills
    generator: build/scripts/hermes_packs.py
    owner: build_all.py --check
    reason: Skills split across packs under the Hermes install cap; SKILL.md drops metadata, allowed-tools, and the model keys. Each pack also carries a byte-identical copy of the shared lib packages (lib_render.render_lib_files), its plugin.json, and the README index; one generator owns the whole tree, so no second row covers lib/.

