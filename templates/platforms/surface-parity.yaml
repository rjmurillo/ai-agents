# Surface parity manifest (issue #5637).
#
# One row per shipped surface: where it lives, which source it answers to, which
# generator keeps it fresh, and which gate validates it. The reader is
# build/scripts/check_surface_parity.py; the relation vocabulary is in its
# module docstring. build_all.py --check runs the same checks, so CI and a local
# run report one result.
#
# Not a platform config: it carries no `provider:` key, so build_all.py,
# generate_agents.py, and validate_templates_schema.py skip it.
#
# Rules the checker enforces:
#   * Every file under a root belongs to one surface. The most specific path
#     wins; at equal depth the row with `include` wins.
#   * Every path named by binplace.yaml, a platform artifacts stanza, or
#     build_all.OWNED_PREFIXES has a row. Deleting a row fails the gate.
#   * `independent` rows are authored in place and are never compared.
#   * `generated` freshness belongs to the generator; the owner column names the gate.
schemaVersion: "1.0"
roots:
  - src
  - .claude
  - .github
surfaces:
  # ---- Agents -------------------------------------------------------------
  - id: agents-claude-plugin
    path: src/claude/agents
    relation: generated
    authority: templates/agents
    generator: build/scripts/agent_templates.py
    owner: build_all.py --check
  - id: agents-claude-install
    path: .claude/agents
    relation: binplaced
    authority: src/claude/agents
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check; check_agent_content_parity.py
  - id: agents-copilot-cli
    path: src/copilot-cli/agents
    relation: translated
    authority: templates/agents
    generator: build/generate_agents.py
    owner: build_all.py --check; agent-drift-detection.yml
  - id: agents-vscode
    path: src/vs-code-agents
    relation: translated
    authority: templates/agents
    generator: build/generate_agents.py
    include: ["*.agent.md"]
    owner: build_all.py --check; agent-drift-detection.yml
  - id: vscode-copilot-instructions
    path: src/vs-code-agents
    relation: independent
    include: ["copilot-instructions.md"]
    reason: Authored in place; no generator writes it.
  - id: agents-github
    path: .github/agents
    relation: translated
    authority: templates/agents
    generator: build/generate_agents.py
    include: ["*.agent.md"]
    owner: build_all.py --check; agent-drift-detection.yml
  - id: github-agents-prompt
    path: .github/agents
    relation: independent
    include: ["pr-comment-responder.prompt.md"]
    reason: Authored in place; the generator emits only *.agent.md.
  - id: github-agents-security-references
    path: .github/agents/security/references
    relation: mirrored
    authority: src/claude/security/references
    owner: build/scripts/check_surface_parity.py
    reason: Hand-maintained byte copy; no generator writes it.
  - id: agent-catalog
    path: docs/agent-catalog.md
    relation: generated
    authority: templates/agents
    generator: build/generate_agent_catalog.py
    owner: build_all.py --check

  # ---- Rules and instructions ---------------------------------------------
  - id: rules-claude-plugin
    path: src/claude/rules
    relation: generated
    authority: templates/rules
    generator: build/scripts/rule_templates.py
    owner: build_all.py --check
  - id: rules-claude-install
    path: .claude/rules
    relation: binplaced
    authority: src/claude/rules
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: instructions-copilot-cli
    path: src/copilot-cli/instructions
    relation: translated
    authority: src/claude/rules
    generator: build/scripts/generate_rules.py
    owner: build_all.py --check
    reason: paths frontmatter becomes applyTo; alwaysApply and priority are dropped.
  - id: instructions-github
    path: .github/instructions
    relation: translated
    authority: src/claude/rules
    generator: build/scripts/generate_rules.py
    owner: build_all.py --check
    reason: paths frontmatter becomes applyTo; alwaysApply and priority are dropped.

  # ---- Hooks and settings -------------------------------------------------
  - id: hooks-claude-plugin
    path: src/claude/hooks
    relation: generated
    authority: templates/hooks
    generator: build/scripts/hook_templates.py
    owner: build_all.py --check
  - id: hooks-json-claude-plugin
    path: src/claude/hooks.json
    relation: generated
    authority: templates/hooks/hooks.json
    generator: build/scripts/hook_templates.py
    owner: build_all.py --check
  - id: hooks-claude-install
    path: .claude/hooks
    relation: binplaced
    authority: src/claude/hooks
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: hooks-claude-docs
    path: .claude/hooks
    relation: independent
    include: ["**/AGENTS.md", "**/CLAUDE.md", "**/README.md"]
    reason: Per-directory guides authored in place.
  - id: hooks-json-claude-install
    path: .claude/hooks/hooks.json
    relation: binplaced
    authority: src/claude/hooks.json
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: settings-claude
    path: .claude/settings.json
    relation: generated
    authority: templates/hooks/settings.tmpl
    generator: build/scripts/hook_templates.py
    owner: build_all.py --check
  - id: hooks-copilot-plugin
    path: src/copilot-cli/hooks
    relation: translated
    authority: src/claude/hooks
    generator: build/scripts/generate_hooks.py
    owner: build_all.py --check
    reason: Event names are remapped and matchers become inline script shims.
  - id: hooks-github-install
    path: .github/hooks
    relation: binplaced
    authority: src/copilot-cli/hooks
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: hooks-github-memory-recall
    path: .github/hooks
    relation: independent
    include: ["memory-recall.json"]
    reason: Authored in place; binplace leaves it alone.

  # ---- Skills -------------------------------------------------------------
  - id: skills-claude-plugin-skillmd
    path: src/claude/skills
    relation: generated
    authority: templates/skills
    generator: build/scripts/skill_templates.py
    include: ["*/SKILL.md"]
    owner: build_all.py --check
  - id: skills-claude-plugin-support
    path: src/claude/skills
    relation: mirrored
    authority: .claude/skills
    generator: build/scripts/generate_skills.py
    exclude: ["*/SKILL.md"]
    owner: build_all.py --check
    reason: Support files mirror from .claude/skills/<name>/ into the plugin tree.
  - id: skills-claude-install-skillmd
    path: .claude/skills
    relation: binplaced
    authority: src/claude/skills
    generator: build/scripts/binplace_manifest.py
    include: ["*/SKILL.md"]
    owner: build_all.py --check
    reason: A skill with distribution repo-local renders straight here with no plugin hop.
  - id: skills-claude-install-support
    path: .claude/skills
    relation: independent
    exclude: ["*/SKILL.md"]
    reason: Canonical source of skill scripts, references, and tests; mirrored into both plugin trees.
  - id: skills-review-sidecar-plugin
    path: src/claude/skills/review/scripts/validate_review_marker.py
    relation: generated
    authority: scripts/validation/validate_review_marker.py
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
  - id: skills-review-sidecar-install
    path: .claude/skills/review/scripts/validate_review_marker.py
    relation: binplaced
    authority: src/claude/skills/review/scripts/validate_review_marker.py
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: skills-review-sidecar-copilot
    path: src/copilot-cli/skills/review/scripts/validate_review_marker.py
    relation: generated
    authority: scripts/validation/validate_review_marker.py
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
  - id: skills-copilot-cli
    path: src/copilot-cli/skills
    relation: translated
    authority: .claude/skills
    generator: build/scripts/generate_skills.py
    authority_exclude: [merge-resolver]
    owner: build_all.py --check
    reason: Frontmatter keys model and model-rationale drop; argument, agent, skill, and tool syntax is rewritten. merge-resolver is excluded (issue #2026).

  # ---- Lib packages -------------------------------------------------------
  - id: lib-hook-utilities-claude-plugin
    path: src/claude/lib/hook_utilities
    relation: translated
    authority: scripts/hook_utilities
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-github-core-claude-plugin
    path: src/claude/lib/github_core
    relation: translated
    authority: scripts/github_core
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-ai-review-common-claude-plugin
    path: src/claude/lib/ai_review_common
    relation: translated
    authority: scripts/ai_review_common
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-bootstrap-claude-plugin
    path: src/claude/lib/bootstrap.py
    relation: translated
    authority: scripts/hook_utilities/bootstrap.py
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-hook-utilities-copilot-plugin
    path: src/copilot-cli/lib/hook_utilities
    relation: translated
    authority: scripts/hook_utilities
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-github-core-copilot-plugin
    path: src/copilot-cli/lib/github_core
    relation: translated
    authority: scripts/github_core
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-ai-review-common-copilot-plugin
    path: src/copilot-cli/lib/ai_review_common
    relation: translated
    authority: scripts/ai_review_common
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-bootstrap-copilot-plugin
    path: src/copilot-cli/lib/bootstrap.py
    relation: translated
    authority: scripts/hook_utilities/bootstrap.py
    generator: build/scripts/lib_mirror.py
    owner: build_all.py --check
    reason: Absolute imports are rewritten to relative imports.
  - id: lib-hook-utilities-claude-install
    path: .claude/lib/hook_utilities
    relation: binplaced
    authority: src/claude/lib/hook_utilities
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: lib-github-core-claude-install
    path: .claude/lib/github_core
    relation: binplaced
    authority: src/claude/lib/github_core
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: lib-ai-review-common-claude-install
    path: .claude/lib/ai_review_common
    relation: binplaced
    authority: src/claude/lib/ai_review_common
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: lib-bootstrap-claude-install
    path: .claude/lib/bootstrap.py
    relation: binplaced
    authority: src/claude/lib/bootstrap.py
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
  - id: lib-claude-modules
    path: .claude/lib
    relation: independent
    include: ["*.py"]
    reason: Top-level modules have no scripts/ source and are edited here.
  - id: lib-copilot-modules
    path: src/copilot-cli/lib
    relation: translated
    authority: .claude/lib
    include: ["*.py"]
    divergent: [paths.py]
    owner: build/scripts/check_surface_parity.py
    reason: Hand-maintained copies of the .claude/lib top-level modules. paths.py differs on purpose; its consumer-side root is .agents, not .project-toolkit.
  - id: lib-hook-utilities-guide
    path: .claude/lib/hook_utilities
    relation: independent
    include: ["CLAUDE.md"]
    reason: Per-package guide authored in place.
  - id: lib-github-core-guide
    path: .claude/lib/github_core
    relation: independent
    include: ["CLAUDE.md"]
    reason: Per-package guide authored in place.

  # ---- Hermes packs (ADR-115 Decision 6) ----------------------------------
  - id: skills-hermes-packs
    path: src/hermes
    relation: generated
    authority: src/claude/skills
    generator: build/scripts/hermes_packs.py
    owner: build_all.py --check
    reason: Skills split across packs under the Hermes install cap; SKILL.md drops metadata and the model keys. The README index and each plugin.json are rendered with them.
  - id: lib-hermes-packs
    path: src/hermes
    relation: translated
    authority: src/claude/lib
    generator: build/scripts/hermes_packs.py
    include: ["*/lib/**"]
    owner: build_all.py --check
    reason: One byte-identical copy of the shared lib packages per pack, rendered by lib_mirror.render_lib_files.

  # ---- Prompts ------------------------------------------------------------
  - id: prompts-pr-quality-gate
    path: .github/prompts
    relation: generated
    authority: .claude/skills/review/references
    generator: build/scripts/generate_pr_quality_prompts.py
    include: ["pr-quality-gate-*.md"]
    owner: build_all.py --check; run_drift_check_ci.py
  - id: prompts-authored
    path: .github/prompts
    relation: independent
    reason: Authored in place; only the pr-quality-gate-*.md files are generated.

  # ---- Generated notices and indexes --------------------------------------
  - id: third-party-notices-claude
    path: .claude/THIRD-PARTY-NOTICES.TXT
    relation: generated
    authority: scripts/generate_third_party_notices.py
    generator: scripts/generate_third_party_notices.py
    owner: scripts/generate_third_party_notices.py --check
  - id: third-party-notices-copilot
    path: src/copilot-cli/THIRD-PARTY-NOTICES.TXT
    relation: generated
    authority: scripts/generate_third_party_notices.py
    generator: scripts/generate_third_party_notices.py
    owner: scripts/generate_third_party_notices.py --check
  - id: adr-index
    path: .project-toolkit/architecture/README.md
    relation: generated
    authority: .project-toolkit/architecture
    generator: build/scripts/generate_adr_index.py
    owner: build_all.py --check

  # ---- Authored in place --------------------------------------------------
  - id: src-guides
    path: src
    relation: independent
    include: ["AGENTS.md", "CLAUDE.md", "STYLE-GUIDE.md"]
    reason: Repo-level guides for the shipped trees.
  - id: src-claude-authored
    path: src/claude
    relation: independent
    include: ["AGENTS.md", "claude-instructions.template.md", "security/**", ".claude-plugin/**"]
    reason: Plugin guide, install template, security references, and plugin manifest are authored in place.
  - id: src-copilot-cli-authored
    path: src/copilot-cli
    relation: independent
    include: ["docs/**", ".claude-plugin/**"]
    reason: Plugin documentation and plugin manifest are authored in place.
  - id: claude-guides
    path: .claude
    relation: independent
    include: ["AGENTS.md", "CLAUDE.md", ".gitignore"]
    reason: Guides and ignore rules for the install tree.
  - id: github-top-level
    path: .github
    relation: independent
    include:
      - AGENTS.md
      - CLAUDE.md
      - CODEOWNERS
      - FUNDING.yml
      - PULL_REQUEST_TEMPLATE.md
      - actionlint.yaml
      - bot-authors.yml
      - copilot-code-review.md
      - copilot-instructions.md
      - dependabot.yml
      - labeler.yml
    reason: Repository configuration authored in place.
  - id: github-workflows
    path: .github/workflows
    relation: independent
    reason: Workflow files are authored in place.
  - id: github-scripts
    path: .github/scripts
    relation: independent
    reason: CI helper scripts are authored in place.
  - id: github-actions
    path: .github/actions
    relation: independent
    reason: Composite actions are authored in place.
  - id: github-codeql
    path: .github/codeql
    relation: independent
    reason: CodeQL configuration is authored in place.
  - id: github-copilot
    path: .github/copilot
    relation: independent
    reason: Copilot settings are authored in place.
  - id: github-issue-template
    path: .github/ISSUE_TEMPLATE
    relation: independent
    reason: Issue forms are authored in place.
  - id: github-plugin
    path: .github/plugin
    relation: independent
    reason: Marketplace manifest is authored in place.
