  # ---- Skills -------------------------------------------------------------
  - id: skills-claude-plugin-skillmd
    path: src/claude/skills
    relation: generated
    authority: templates/skills
    generator: build/scripts/skill_templates.py
    include: ["*/SKILL.md"]
    owner: build_all.py --check
  - id: skills-claude-plugin-support
    path: src/claude/skills
    relation: independent
    exclude: ["*/SKILL.md"]
    reason: Canonical, hand-maintained support files (ADR-119). .claude/skills/<name> links here, so there is no second copy to mirror.
  - id: skills-claude-install-skillmd
    path: .claude/skills
    relation: binplaced
    authority: src/claude/skills
    generator: build/scripts/binplace_manifest.py
    include: ["*/SKILL.md"]
    extras: allow
    owner: build_all.py --check
    reason: A shipped skill is a relative symlink to the plugin directory (ADR-119). A skill with distribution repo-local renders straight here with no plugin hop.
  - id: skills-claude-install-support
    path: .claude/skills
    relation: independent
    exclude: ["*/SKILL.md"]
    reason: Support files of a repo-local skill, authored in place. A shipped skill's are reached through its symlink into the plugin tree.
  - id: skills-review-sidecar-plugin
    path: src/claude/skills/review/scripts/validate_review_marker.py
