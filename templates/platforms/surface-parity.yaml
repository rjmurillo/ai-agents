    owner: build_all.py --check
    reason: Repo-only rules (scope internal end to end) render here as real files and ship in no plugin tree (ADR-119 decision 13).
  - id: instructions-copilot-cli
    path: src/copilot-cli/instructions
    relation: translated
    authority: src/claude/rules
    generator: build/scripts/generate_rules.py
    owner: build_all.py --check
    reason: paths frontmatter becomes applyTo; alwaysApply and priority are dropped.
  - id: rules-cursor
    path: src/cursor/rules
    relation: translated
    authority: src/claude/rules
    generator: build/scripts/generate_rules.py
    owner: build_all.py --check
    reason: Rules become .mdc files. paths of ** becomes alwaysApply true; other paths become a comma-separated globs string. priority is dropped. Internal-only globs are filtered.
  - id: instructions-github
    path: .github/instructions
    relation: binplaced
    authority: src/copilot-cli/instructions
    generator: build/scripts/binplace_manifest.py
    owner: build_all.py --check
    reason: Each shipped instruction links into the shipped tree (ADR-119).
  - id: instructions-github-repo-only
    path: .github/instructions
    relation: translated
    authority: .claude/rules
    generator: build/scripts/generate_rules.py
    include: ["adr-records.instructions.md", "governance.instructions.md", "push-lock.instructions.md", "secret-redaction.instructions.md", "session-logs.instructions.md", "tool-use-hook-bar.instructions.md"]
    owner: build_all.py --check
    reason: Repo-only rules (scope internal end to end) render here as real files; paths becomes applyTo.

