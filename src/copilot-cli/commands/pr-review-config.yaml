# PR Review Configuration
# Structured data extracted from pr-review skill prompt.
# Referenced by .claude/commands/pr-review.md and .github/prompts/pr-review.prompt.md

scripts:
  claude_code:
    get_pr_context: "python3 .claude/skills/github/scripts/pr/get_pr_context.py --pull-request {number}"
    test_pr_merged: "python3 .claude/skills/github/scripts/pr/test_pr_merged.py --pull-request {number}"
    get_review_threads: "python3 .claude/skills/github/scripts/pr/get_pr_review_threads.py --pull-request {number}"
    get_unresolved_threads: "python3 .claude/skills/github/scripts/pr/get_unresolved_review_threads.py --pull-request {number}"
    cluster_threads: "python3 .claude/skills/pr-comment-responder/scripts/cluster_threads.py --pull-request {number}"
    # Settling gate. The one-shot get_unresolved_threads snapshot can read
    # unresolved_count == 0 in the window between an agent resolving the last
    # thread and the next bot (Copilot, Devin) scan landing 30-120s later. That
    # window is exactly the PR #1965 "0 unresolved" lie. wait_for_unresolved_zero
    # requires THREE consecutive complete-and-zero readings 180s apart before it
    # exits 0, so a momentarily-true zero between bot scans does not pass. Run it
    # before the completion gate when the PR has live bot reviewers. No copilot
    # (PowerShell) equivalent exists; this settling step is Claude-only.
    wait_for_settled_zero: "python3 .claude/skills/github/scripts/pr/wait_for_unresolved_zero.py --pull-request {number}"
    get_unaddressed_comments: "python3 .claude/skills/github/scripts/pr/get_unaddressed_comments.py --pull-request {number}"
    get_pr_checks: "python3 .claude/skills/github/scripts/pr/get_pr_checks.py --pull-request {number}"
    add_thread_reply: "python3 .claude/skills/github/scripts/pr/add_pr_review_thread_reply.py --pull-request {number} --thread-id {thread_id} --body {body}"
    add_thread_reply_resolve: "python3 .claude/skills/github/scripts/pr/add_pr_review_thread_reply.py --pull-request {number} --thread-id {thread_id} --body {body} --resolve"
    resolve_thread: "python3 .claude/skills/github/scripts/pr/resolve_pr_review_thread.py --expected-pull-request {number} --thread-id {thread_id}"
    check_transport: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/utils/check_github_transport.py" --output-format json'
  copilot:
    # Every command here names a shipped Python script, anchored on the plugin
    # root. The previous entries named PowerShell files (Get-PRContext.ps1 and
    # eight siblings) that exist in neither this repository nor the standalone
    # plugin, under bare `.claude/...` paths that do not resolve in a vendored
    # install either. Nothing selected this map until the pr-review workflow
    # stopped hardcoding `scripts.claude_code`, so the breakage was dormant
    # rather than absent; selecting it then made Step 1 fail before review
    # (Copilot review on PR #5509).
    #
    # `python3` rather than a resolved launcher, matching every other entry in
    # this file. Only `check_transport` resolves the interpreter, because it is
    # the blocking Step 0 and a failure there stops the workflow instead of one
    # step of it. Refs #5521.
    get_pr_context: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/get_pr_context.py" --pull-request {number}'
    test_pr_merged: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/test_pr_merged.py" --pull-request {number}'
    get_review_threads: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/get_pr_review_threads.py" --pull-request {number}'
    get_unresolved_threads: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/get_unresolved_review_threads.py" --pull-request {number}'
    cluster_threads: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/pr-comment-responder/scripts/cluster_threads.py" --pull-request {number}'
    get_unaddressed_comments: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/get_unaddressed_comments.py" --pull-request {number}'
    get_pr_checks: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/get_pr_checks.py" --pull-request {number}'
    wait_for_settled_zero: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/wait_for_unresolved_zero.py" --pull-request {number}'
    add_thread_reply: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/add_pr_review_thread_reply.py" --pull-request {number} --thread-id {thread_id} --body {body}'
    add_thread_reply_resolve: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/add_pr_review_thread_reply.py" --pull-request {number} --thread-id {thread_id} --body {body} --resolve'
    resolve_thread: 'python3 "${COPILOT_PLUGIN_ROOT:-${CLAUDE_PLUGIN_ROOT:-.claude}}/skills/github/scripts/pr/resolve_pr_review_thread.py" --expected-pull-request {number} --thread-id {thread_id}'
    # transport_preflight resolves command_key against the harness map, so the
    # Copilot map needs its own entry or Step 0 cannot dispatch at all. The
    # POSIX ${VAR:-default} form used in the claude_code map does not expand in
    # PowerShell, which is what this map targets, so a Windows install would
    # fail before the preflight ran (Copilot review on PR #5509).
    #
    # The -Command payload is single-quoted, not double-quoted. A double-quoted
    # payload is expanded by the POSIX parent shell before pwsh is executed:
    # `$root` and `$env:` are unset there, so pwsh receives
    # `= if (:COPILOT_PLUGIN_ROOT) { ... } ...` and fails on a parse error
    # rather than on anything about the transport. Measured under bash 5 by
    # printing the expanded argument (Copilot review on PR #5509).
    #
    # The interpreter is resolved rather than hardcoded to python3. A Windows
    # Copilot host may expose only python.exe or the py launcher
    # (REQ-003-multi-tool-artifact-build.md:442), and the repo's own PowerShell
    # hook launchers use `py -3` for that reason (same file, lines 150 and 326;
    # ADR-068:302). This is the blocking Step 0, so a missing python3 stops the
    # workflow before it can pick a transport. python3 is tried first because
    # pwsh also runs on Linux and macOS, where py does not exist.
    check_transport: "pwsh -NoProfile -Command '$root = if ($env:COPILOT_PLUGIN_ROOT) { $env:COPILOT_PLUGIN_ROOT } elseif ($env:CLAUDE_PLUGIN_ROOT) { $env:CLAUDE_PLUGIN_ROOT } else { \".claude\" }; $exe, $pre = if (Get-Command python3 -EA SilentlyContinue) { \"python3\", @() } elseif (Get-Command py -EA SilentlyContinue) { \"py\", @(\"-3\") } else { \"python\", @() }; & $exe @pre (Join-Path $root \"skills/github/scripts/utils/check_github_transport.py\") --output-format json'"

# Transport preflight. Run check_transport once, before Step 1, and branch on
# Data.Transport.
#
# Every script above reaches GitHub through gh. An agent sandbox that proxies
# egress leaves gh installed and GH_TOKEN set while refusing GitHub for the
# whole session, so each script fails with HTTP 403 and none of those failures
# says anything about the PR. Discovering that per call costs one failed round
# trip per operation and invites a retry of a condition that has no reset.
transport_preflight:
  # BEFORE reading command_key below, run verify_trust. Every command in
  # this file is PR-controlled when /pr-review runs after `gh pr checkout`,
  # and the completion gate's trusted-ref verification covers
  # completion_criteria only, which runs at the END. Without this step the
  # first thing the workflow executes is a command a PR author can rewrite
  # (issue #5520, CWE-829).
  verify_trust: "uv run python .claude/skills/github/scripts/pr/run_completion_gate.py --config .claude/commands/pr-review-config.yaml --pull-request {number} --verify-config-only --json"
  verify_trust_exits:
    - exit_code: 0
      meaning: "Config and the files its scripts-map commands name match the trusted ref. Proceed to check_transport. Read unverifiable_command_tokens: a token listed there reaches its target through shell evaluation, so its file was not compared."
    - exit_code: 2
      meaning: "The config or a named script diverges from the trusted ref. STOP. Do not run any command from this file. Surface the diff to the human and stop; do not pass --approve-untrusted-config on your own initiative."
    - exit_code: 3
      meaning: "Verification is impossible (no work tree, trusted ref missing). STOP. --approve-untrusted-config does not apply; there is nothing a human could have inspected."
  command_key: "check_transport"
  blocking: true
  verdicts:
    - transport: "gh"
      action: "Run this workflow as written. This is CI and a normal developer machine."
    - transport: "gh_unusable"
      action: "Run it through the GitHub MCP operations. Script-to-operation map and per-harness tool spelling: the github skill's references/transport-routing.md"
  non_transport_exits:
    - exit_code: 3
      meaning: "Quota window or transport wobble. Not a transport change; stop and retry later."
    - exit_code: 4
      meaning: "Credential fault the operator can fix. Stop and report; do not route around it."
  mcp_mode_constraints:
    - "cluster_threads, wait_for_settled_zero, and the completion gate are local logic over fetched data. Fetch threads with pull_request_read method get_review_comments, run the same procedure by hand, and record in the verdict that it was derived rather than scripted."
    - "resolve_review_thread resolves one thread per call. There is no --all equivalent, so resolve explicitly and count what you resolved."
    - "A transport failure is an unknown, never a verdict. Never emit a PASS or a '0 unresolved' result from a call that failed; report the PR as unreviewed with the transport as the reason."
    - "Step 3 (--parallel) shells out to `gh pr view` for head.ref. That call fails in gh_unusable mode like every other, so read head.ref from pull_request_read method get instead and pass it to the same `git worktree add`. Git itself needs no GitHub access, so only the lookup changes."

check_failure_actions:
  - check_type: "Session validation"
    action: "Hand-fix against .agents/schemas/session-log.schema.json and re-run scripts/validate_session_json.py"
  - check_type: "AI reviewer (infra)"
    action: "May be transient; note and continue"
  - check_type: "AI reviewer (code quality)"
    action: "Address findings or acknowledge"
  - check_type: "Tests (Pester/pytest)"
    action: "Run locally, fix failures"
  - check_type: "Markdown lint"
    action: "Run npx markdownlint-cli2 --fix"
  - check_type: "PR title validation"
    action: "Update title to conventional commit format"

error_recovery:
  - scenario: "PR not found"
    action: "Log warning, skip PR, continue"
  - scenario: "Branch conflict"
    action: "Log error, skip PR, continue"
  - scenario: "Agent timeout"
    action: "Log partial status, force cleanup"
  - scenario: "Push rejection"
    action: "Detect concurrent updates (fetch and compare remote). If no concurrent changes, retry with --force-with-lease; otherwise, log rejection and require manual resolution."
  - scenario: "Merge conflict"
    action: "Log conflict, skip cleanup, report for manual resolution"

# Completion criteria are dispatchable.
#
# Each criterion runs an external command. The command's stdout JSON is
# the source of truth; the criterion passes only when its `pass_when`
# expression evaluates true against that JSON. A criterion fails closed
# (passed=false) on any of:
#   - command failed to run (FileNotFoundError, timeout)
#   - command exited non-zero (any non-zero status, regardless of stdout)
#   - command stdout is not a JSON object
#   - pass_when evaluating false
# `fail_open: true` flips the dispatch-error cases (command/timeout,
# non-zero exit, non-JSON stdout) to pass. It does NOT flip the
# pass_when-false case, and a *broken* pass_when expression (DSL syntax
# error or pass_when_python lambda exception) always fails closed; that
# is a config bug, not a verifier outage.
#
# This replaces the prior narrative criteria (e.g. "0 unresolved threads")
# whose verdict was claimed by the agent. The agent now dispatches and
# reports; the verifier's output IS the verdict.
#
# pass_when DSL (handled by run_completion_gate.py):
#   * dotted path access:    stdout-json.field, stdout-json.nested.field
#   * literals:              integers, true, false, null, "double-quoted"
#   * comparison operators:  ==, !=
#   * boolean composition:   AND, OR (left-to-right; no parens)
#
# Fields:
#   name           Human-readable criterion title.
#   verification   Currently only "command" is supported.
#   command        Shell command template; {pr} is substituted with the PR number.
#   pass_when      DSL expression evaluated against the parsed stdout JSON.
#   pass_when_python  (Optional) Python lambda escape hatch when DSL is too narrow.
#   fail_open      (Optional, default false) Treat dispatch errors as a pass.
completion_criteria:
  # NOTE: Security threads (CWE, OWASP, CVE) are EXEMPT from the "all resolved"
  # requirement per failure_handling policy. When this criterion fails due to
  # unresolved security threads, agents MUST verify: (1) each security thread
  # has a tracking issue logged, (2) the underlying vulnerability is not yet
  # fixed. Security threads with tracking issues are allowed to remain open;
  # the agent may proceed if ONLY security threads are unresolved.
  - name: "All review threads resolved (security threads exempt with tracking)"
    verification: "command"
    command: "python3 .claude/skills/github/scripts/pr/get_unresolved_review_threads.py --pull-request {pr}"
    pass_when: "stdout-json.unresolved_count == 0 AND stdout-json.fetched_pages_complete == true"
    fail_open: false
  - name: "No suppressed Copilot review findings"
    verification: "command"
    command: "python3 .claude/skills/github/scripts/pr/check_suppressed_review_findings.py --pull-request {pr}"
    pass_when: "stdout-json.active_suppressed_count == 0 AND stdout-json.unknown_suppressed_count == 0 AND stdout-json.fetched_pages_complete == true"
    fail_open: false
  - name: "Resolved thread commit references are reachable"
    verification: "command"
    command: "python3 .claude/skills/github/scripts/pr/check_review_thread_resolution_shas.py --pull-request {pr}"
    pass_when: "stdout-json.unreachable_count == 0 AND stdout-json.invalid_count == 0 AND stdout-json.ambiguous_count == 0 AND stdout-json.fetched_pages_complete == true"
    fail_open: false
  - name: "PR is ready to merge (CI green, no conflicts)"
    verification: "command"
    command: "python3 .claude/skills/github/scripts/pr/test_pr_merge_ready.py --pull-request {pr} --dispositions-file .agents/pr-checks/dispositions.json"
    # pr-autofix readiness is a four-condition gate: GitHub says the PR can
    # merge, required checks pass, review threads are resolved, and the merge
    # state is CLEAN, HAS_HOOKS, or UNSTABLE. Keep these fields explicit here so
    # a future upstream CanMerge regression cannot make this gate fail open.
    #
    # The state tuple must stay equal to _SUPPORTED_MERGE_STATES in
    # test_pr_merge_ready.py, which is the allowlist that decides which states
    # reach tier T1. A state accepted there and rejected here reaches the
    # merge tier and then fails this mandatory gate with nothing left to fix.
    # HAS_HOOKS was in that shape until issue #4899's review round; GitHub
    # defines it as "Mergeable with passing commit status and pre-receive
    # hooks", so pr-autofix.md routes it down the CLEAN merge path.
    # TestSupportedStatesClearTheCompletionGate in
    # tests/test_test_pr_merge_ready.py drives a real producer verdict through
    # this real predicate and fails when the two sets drift apart.
    #
    # fetched_pages_complete is a separate data-integrity guard: a truncated
    # GraphQL page can hide a failing required check, so the gate fails closed
    # on partial fetches per the PR #1887 retrospective.
    pass_when_python: "lambda d: d.get('CanMerge') is True and d.get('CIPassing') is True and d.get('fetched_pages_complete') is True and d.get('UnresolvedThreads') == 0 and d.get('MergeStateStatus') in ('CLEAN', 'HAS_HOOKS', 'UNSTABLE') and d.get('UndisposedNonRequiredFailures', ['x']) == []"
    fail_open: false
  - name: "PR is not already merged"
    verification: "command"
    command: "python3 .claude/skills/github/scripts/pr/test_pr_merged.py --pull-request {pr}"
    pass_when: "stdout-json.merged == false"
    fail_open: false

failure_handling:
  - type: "Session validation fails"
    action: "Hand-fix against .agents/schemas/session-log.schema.json and re-run scripts/validate_session_json.py"
  - type: "AI reviewer fails (infra)"
    action: "Note as infrastructure issue; may be transient"
  - type: "AI reviewer fails (code quality)"
    action: "Address findings or document acknowledgment"
  - type: "Security finding (CWE, OWASP, CVE)"
    action: "BLOCKING. Fix the underlying code vulnerability before resolving the thread. Do NOT resolve security threads without a code fix. Log a tracking issue. Security threads with tracking issues are exempt from completion_criteria thread-resolution requirements. Ref: .claude/rules/security.md (canonical security file rule), AGENTS.md NEVER list."
  - type: "Merge conflicts"
    action: "Resolve conflicts or merge base branch"
  - type: "Behind base branch"
    action: "Merge base or rebase as appropriate"

worktree_constraints:
  - "ALL changes MUST be contained within the assigned worktree"
  - "Agents MUST set working directory to their worktree before file operations"
  - "All file paths MUST be relative to worktree root"
  - "Git commands MUST be executed from within the worktree directory"
  - "Before cleanup, verify no files were written outside worktrees"

related_memories:
  - name: "pr-review-007-merge-state-verification"
    purpose: "GraphQL source of truth for merge state"
  - name: "pr-review-004-thread-resolution-single"
    purpose: "Single thread resolution via GraphQL"
  - name: "pr-review-005-thread-resolution-batch"
    purpose: "Batch thread resolution efficiency"
  - name: "pr-review-008-session-state-continuity"
    purpose: "Session context for multi-round reviews"
  - name: "ai-quality-gate-failure-categorization"
    purpose: "Infrastructure vs code quality failures"

thread_resolution:
  note: "Replying to a review comment does NOT automatically resolve the thread. Thread resolution requires a separate GraphQL mutation."
  batch_graphql_template: |
    mutation {
      t1: resolveReviewThread(input: {threadId: "THREAD_ID_1"}) { thread { id isResolved } }
      t2: resolveReviewThread(input: {threadId: "THREAD_ID_2"}) { thread { id isResolved } }
    }

invocation_limits:
  all_open_max_prs: 5
  all_open_overflow_action: "Report the PR numbers of the remaining open PRs and instruct the user to process them by specifying those numbers explicitly in a new command (re-running with all-open will re-process the same first N PRs)"
  # The completion gate is no longer retried in a loop. A failing
  # criterion produces the same wrong answer when looped, by definition;
  # the workflow halts and surfaces the failing command's output instead.
  # These fields are retained for backward compatibility with the schema
  # validator but are not consulted by the new dispatchable gate.
  completion_gate_max_retries: 0
  completion_gate_overflow_action: "Halt and surface failing criterion output; do not loop"

output_constraints:
  per_pr_max_response_tokens: 4096
  # Only "table" is supported today. To add another value, update pr-review.md Step 6 in the same change.
  summary_format: "table"
  summary_format_allowed_values: ["table"]
  summary_required_columns: ["PR", "Branch", "Comments", "Acknowledged", "Implemented", "Commit", "Status"]

dry_run:
  description: "Preview planned actions without executing any GitHub mutations"
  behavior:
    - "Parse and validate PR numbers (same as normal)"
    - "Gather PR context, comments, and check status (read-only API calls)"
    - "Analyze what actions would be taken"
    - "Output planned actions as JSON to stdout"
  constraints:
    - "No comments are posted"
    - "No reactions are added"
    - "No labels are applied"
    - "No threads are resolved"
    - "No commits are made"
    - "No git push operations"
    - "Exit after outputting JSON, do not proceed to execution"
  output_schema:
    root_keys:
      - "dry_run: true"
      - "timestamp: ISO 8601"
      - "prs: array of per-PR planned action objects"
      - "summary: totals for prs, comments, replies, threads"
    per_pr_keys:
      - "number, branch, state, mergeable"
      - "planned_actions: comments_to_post, reactions_to_add, labels_to_apply, status_updates"
      - "unaddressed_comments: id, author, body, domain, priority"
      - "failing_checks: name, conclusion, suggested_action"
