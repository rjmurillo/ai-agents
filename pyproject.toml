# Module boundaries, enforced by `lint-imports` (import-linter) in the pre-push
# `import-boundaries` job and the pytest workflow. Each contract states a rule
# the repository already documents; tests/test_import_linter_contracts.py ties
# the module lists to their sources and pins the ignore count.
[tool.importlinter]
root_packages = ["scripts", "memory_enhancement", "tests"]
# Third-party packages join the graph so a forbidden contract can name them.
include_external_packages = true

# build/scripts/lib_mirror.py ships these four packages into every plugin lib
# tree (ADR-109 B5). Its IMPORT_CONVERSIONS rewrite turns any
# `from scripts.<pkg> import` into `from . import`, so an import of a sibling
# package would resolve inside the importing package in the shipped copy.
# shipped-lib-self-contained below also forbids every `scripts.*` import, so it
# breaks on a sibling import too. This contract stays for its message: it names
# the broken rule as "do not import each other", where the broader one reports
# a generic repository import.
[[tool.importlinter.contracts]]
id = "shipped-lib-independence"
name = "Shipped lib packages do not import each other"
type = "independence"
modules = [
    "scripts.hook_utilities",
    "scripts.github_core",
    "scripts.ai_review_common",
    "scripts.failure_classifier",
]

# lib_mirror.py copies these four packages plus one sidecar file,
# scripts/validation/validate_review_marker.py (ADR-109 B5). No contract covers
# the sidecar. The rest of scripts/, memory_enhancement/, and tests/ never ship,
# so an import of them would dangle in every plugin install.
# plugin-self-containment.md MUST 1 states the same boundary for shipped files.
[[tool.importlinter.contracts]]
id = "shipped-lib-self-contained"
name = "Shipped lib packages import nothing else from the repository"
type = "forbidden"
source_modules = [
    "scripts.hook_utilities",
    "scripts.github_core",
    "scripts.ai_review_common",
    "scripts.failure_classifier",
]
forbidden_modules = ["scripts.*", "memory_enhancement", "tests"]

# plugin-self-containment.md MUST 4: a plugin-root script runs under bare
# `python3` and must be stdlib-only at import time, and its closure includes
# the shipped lib. This contract covers the import name of each [project]
# dependency. tests/test_import_linter_contracts.py covers every other
# non-stdlib import with a grimp scan that honors the same ignores.
# The ignores are existing debt. They may only shrink: delete an entry in the
# change that removes its import, and lint-imports fails on an entry that no
# longer matches an import.
# An ignore removes one edge, not the modules that import the ignored module.
# tests/test_import_linter_source_scans.py pins the set of modules that fail
# without PyYAML, now empty, and checks it against a real import with yaml blocked.
[[tool.importlinter.contracts]]
id = "shipped-lib-no-runtime-dependencies"
name = "Shipped lib packages do not import the project's third-party dependencies"
type = "forbidden"
source_modules = [
    "scripts.hook_utilities",
    "scripts.github_core",
    "scripts.ai_review_common",
    "scripts.failure_classifier",
]
forbidden_modules = ["anthropic", "jsonschema", "markdown_it", "frontmatter", "yaml", "tiktoken"]
ignore_imports = [
    # Guarded by `except ImportError`, so the module still loads without
    # PyYAML. import-linter cannot see the guard.
    "scripts.github_core.bot_config -> yaml",
]

# [tool.setuptools.packages.find] ships scripts* and memory_enhancement*, never
# tests, so an installed package that imported tests would fail at import.
# grimp walks only directories that hold an __init__.py, so this contract does
# not see scripts/ci, scripts/eval, and five other directories without one.
# tests/test_import_linter_source_scans.py scans every file for the same import.
[[tool.importlinter.contracts]]
id = "production-does-not-import-tests"
name = "Production code does not import tests"
type = "forbidden"
source_modules = ["scripts", "memory_enhancement"]
forbidden_modules = ["tests"]

# Mirror of [project.optional-dependencies].dev above. Both tables must list the
# same dev tools: `uv pip install -e ".[dev]"` reads only the extra, while a plain
# `uv sync` installs this group by default and ignores extras (issue #3111). Keep
# the two in sync; tests/test_pyproject_dev_deps_parity.py fails when they drift.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.10.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "semgrep==1.183.0",
    "lefthook==2.2.2",
    "packaging>=24.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.2.0",
    "pytest-split>=0.11.0",
    "chevron==0.14.0",
    "import-linter>=2.15",
]

# Seconds a validator suite's tests may sum to in one JUnit report, enforced by
# `scripts/testing/slow_test_budget.py --budget pyproject.toml`. Each entry is a
# hotspot issue #5382 optimized, so each needs a floor under it.
#
# The first two budgets are roughly four times the sum this branch measures
# locally (31.57s and 8.96s, serial, no coverage). The multiplier absorbs a
# slower or loaded runner, per `.claude/rules/ci-scripts.md` item 16: a
# standalone wall clock does not predict the same work under contention. What
# survives that headroom is the regression each fix prevents: a suite that goes
# back to rediscovering the whole repository per test, or to re-sorting the
# surface manifest once per file, and lands several times over.
#
# The portability budget is set against the CI report, which runs with
# coverage, not against the local serial sum. In CI the suite sums 25.12s (run
# 39203671065) and 28.93s (run 39207062181) over 303 cases of the main module,
# so 40s leaves about 1.4x to 1.6x headroom. The slowest test, the real-tree
# scan, takes 25.30s of that sum in CI; a revert of the strip-once cache runs it
# about 3x slower, so the suite lands above 60s and fails the 40s budget by
# 1.5x or more. The fixed code fails only on a runner about 1.4x slower than
# the two CI runs above.
#
# The surface parity budget is set against the CI report, which runs with
# coverage, not against the local serial sum. In CI the suite summed 60.3s on
# main before the sort-once change (run 39161326676, 2026-10-18) and 32.7s with
# it (run 39161002142). Locally without coverage the same sums are 49.6s and
# 12.5s. A 25s budget failed the fixed code in CI. At 45s the fixed code has
# about 1.4x headroom and a revert fails by about 1.3x.
#
# One sample on a shared runner swings about 3x (issue #6757: the portability
# module summed 14.9s to 47.2s on identical code). CI therefore warns on a pull
# request and fails on main only when the same module is over budget on two main
# runs in a row (scripts/ci/consecutive_breach.py). The limits below are not
# raised for that noise.
[tool.slow-test-budget]
"tests/test_validate_session_json.py" = 120.0
"tests/test_guard_diff.py" = 35.0
"tests/validation/test_check_skill_md_portability.py" = 40.0
"tests/build_scripts/test_surface_parity_repo.py" = 45.0
