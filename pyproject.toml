[project]
name = "ai-agents"
version = "0.1.0"
description = "AI agent orchestration framework"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}

dependencies = [
    "anthropic==2.4.0",
    "jsonschema>=4.25.1",
    "markdown-it-py>=4.2.0",
    "python-frontmatter==1.3.0",
    "PyYAML==6.0.3",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.10.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "semgrep==1.183.0",
    "lefthook==2.2.2",
    "packaging>=24.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "pytest-testmon>=2.2.0",
    "pytest-split>=0.11.0",
    "chevron==0.14.0",
    "import-linter>=2.15",
]
eval = [
    # OpenAI + GitHub Models providers (scripts/eval/_providers.py).
    # anthropic is already a core dependency; the default eval needs no extra.
    "openai>=2.45.0",
]

[tool.uv]
# Semgrep pins vulnerable optional MCP server dependencies; both command paths
# work with the fixed releases and reviewed exact overrides below.
exclude-newer = "7 days"
override-dependencies = [
    # certifi skips the cooldown below for PYSEC-2026-4320, so pin it exactly.
    # A later `uv lock` must not take an unreviewed CA bundle release.
    "certifi==2026.10.19",
    "click==8.3.3",
    "cryptography==50.0.0",
    # filelock 4.1.1 has six CVE-2026-1129xx findings fixed in 4.2.1.
    "filelock==4.2.1",
    "mcp==1.30.0",
    # semgrep 1.181.0 pins opentelemetry-api<1.38. 1.45.1 fixes
    # CVE-2026-114603. The whole family moves together because each package
    # pins the exact api release.
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-common==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-threading==0.66b1",
    "opentelemetry-proto==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-semantic-conventions==0.66b1",
    "opentelemetry-util-http==0.66b1",
    # semgrep 1.178.0 still pins pyjwt~=2.13.0. 2.15.0 fixes the 2.13.0 CVEs
    # pip-audit reports and GHSA-42vr-xj54-vc7v (issue #6028).
    "pyjwt[crypto]==2.15.0",
    # setuptools 84.0.0 has GHSA-xmj3-9gf7-h52w, fixed in 84.1.0.
    "setuptools==84.1.0",
]

[tool.uv.exclude-newer-package]
anthropic = false
# PYSEC-2026-4320 affects certifi 2026.7.22 and is fixed in 2026.10.19. The
# 7-day cooldown holds the fix, so opt this package out like cryptography.
certifi = false
click = false
# CVE-2026-69247 affects cryptography 49.0.0 and is fixed in 50.0.0. The
# 7-day cooldown held the vulnerable release, so opt this package out to make
# security fixes reachable immediately.
cryptography = false
# filelock 4.2.1 fixes six CVE-2026-1129xx findings the cooldown holds back.
filelock = false
lefthook = false
mcp = false
semgrep = false
# setuptools 84.1.0 fixes GHSA-xmj3-9gf7-h52w.
setuptools = false

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "scripts.mcp_cli*", "scripts.hook_utilities*", "scripts.test_result_helpers*", "scripts.pr_maintenance*", "scripts.github_core*", "scripts.ai_review_common*", "scripts.failure_classifier*", "scripts.validation*", "memory_enhancement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib --timeout=120"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "safe_push_transport: Safe-push tests that touch a non-local transport and are excluded from pre-push.",
    "security: Security-focused tests",
    "smoke: Real-CLI smoke tests (need auth/credits or an installed CLI; run on pull requests by plugin-cli-smoke.yml). The smoke gate asserts these were not skipped (issue #2231 item 4).",
    "claude: Real-CLI tests that need the claude CLI and its credential. The CLI smoke selects those that also carry the smoke marker on the claude matrix leg; the live security review e2e does not.",
    "copilot: Real-CLI tests that need the copilot CLI and its credential. The CLI smoke selects them on the copilot matrix leg.",
    "codex: Real-CLI tests that need the codex CLI and no credential. The CLI smoke selects them on the codex job.",
    "grok: Real-CLI tests that need the grok CLI and no credential. No CI leg selects them yet; they run locally under RUN_CLI_E2E=1.",
    "hermes: Real-CLI tests that need the hermes CLI at the pinned commit and no credential. Run them with RUN_CLI_E2E=1.",
    "pi: Real-CLI tests that need the pi CLI and no credential. The CLI smoke selects them on the pi job.",
    "cursor: Real-CLI tests that need the cursor-agent CLI and a Cursor login for the host leg. No CI leg selects them; they run locally under RUN_CLI_E2E=1.",
    "windows_path: Tests that exercise Windows path handling and must run on a Windows runner.",
]

[tool.coverage.run]
# ADR-119: shipped skills run from src/claude through .claude links, and coverage
# records the real path, so the plugin tree must be a source.
source = [".claude", "src/claude", "scripts", "scripts/memory_enhancement"]
omit = ["**/tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", ".git"]
skips = []

[tool.ruff]
# Match the hook-execution portability floor enforced by
# scripts/validation/validate_python_syntax.py (_SUPPORT_FLOOR). target-version
# governs the syntax ruff may EMIT (formatter) and push toward (pyupgrade), so
# it must track the OLDEST interpreter tracked files must parse on (3.10), not
# the higher requires-python dev/install contract. Setting this to py314 made
# `ruff format` rewrite portable `except (A, B):` into PEP 758 `except A, B:`,
# which the 3.10 floor gate rejects. See issue #3126.
target-version = "py310"
line-length = 100
# No top-level force-exclude: it would also apply to `ruff check` and skip
# explicitly passed files silently. The lefthook format hook and the python
# rule's format command pass `--force-exclude` on the command line instead
# (issue #6506).

[tool.ruff.format]
# test_git_hook_policy_causal_restore.py uses intentionally-split string
# literals (e.g. "# no" "qa") as test fixtures to avoid triggering the
# security-suppressions-staged hook during development. Ruff's formatter
# merges implicit string concatenations, which would neutralise those
# fixtures. Exclude the file so the anti-detection pattern is preserved.
#
# The vulnerable_samples tree is an answer key graded by external scanners.
# Reformatting it trips the semgrep pre-push gate. See the per-file-ignores
# rationale for the same path below.
exclude = [
    "tests/validation/test_git_hook_policy_causal_restore.py",
    ".project-toolkit/security/benchmarks/vulnerable_samples/**",
]

[tool.ruff.lint]
# ARG is deliberately absent. scripts/validation/check_unused_arguments.py runs
# `ruff check --select ARG` on its own against a shrink-only baseline, because
# selecting ARG here would turn every existing unused argument red in the other
# ruff gates.
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "RUF100", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Eval scripts contain embedded prompt text that exceeds 100 chars by design
"scripts/eval/eval-agents.py" = ["E501"]
"scripts/eval/eval-knowledge-integration.py" = ["E501"]
# Deliberately vulnerable detection benchmarks. Their `# noqa: S...` comments
# document which bandit-family finding each sample is meant to trigger for the
# external scanners that grade them. Those rule families are not in this
# project's ruff select list, so RUF100 reads every one as dead. Removing them
# would strip the benchmark's own answer key.
#
# I001 and E501 are waived for the same reason, one step removed. This tree is
# an answer key graded by external scanners, not ordinary source, and editing it
# to satisfy a style linter has a cost the linter cannot see: the files carry
# intentional `shell=True` payloads, so any commit that touches one puts it in
# the changed set that the `security-scan` pre-push job feeds to semgrep, which
# then blocks the push on three CWE-78 findings the corpus exists to contain.
# Reformatting an answer key to trip a security gate is the wrong trade. A
# `.semgrepignore` would not help either: git_hook_policy.py's pre-push scan
# invokes semgrep with --x-ignore-semgrepignore-files, so that file is
# deliberately ignored and cannot scope this gate.
".project-toolkit/security/benchmarks/vulnerable_samples/**/*.py" = ["RUF100", "I001", "E501"]
# sys.path manipulation required before imports for plugin-context path resolution
".claude/skills/github/scripts/**/*.py" = ["E402"]
"src/claude/skills/github/scripts/**/*.py" = ["E402"]
"src/cursor/skills/github/scripts/**/*.py" = ["E402"]
"src/codex/skills/github/scripts/**/*.py" = ["E402"]
"src/muse/skills/github/scripts/**/*.py" = ["E402"]
# Validation runners use sys.path.insert() before importing sibling modules
"scripts/validation/pre_pr.py" = ["E402", "F401"]
"scripts/validation/pre_pr_sequence.py" = ["E402"]
# Test files use sys.path.insert() before importing modules under test
"tests/hooks/**/*.py" = ["E402"]
"tests/skills/**/*.py" = ["E402"]
"tests/validation/**/*.py" = ["E402"]
# ANN suppression for test files (annotations not required in tests)
"tests/**/*.py" = ["ANN"]
"**/tests/**/*.py" = ["ANN"]
# REQ-048 TASK-006: byte copies of .claude/lib dispatcher modules (surface-parity row
# lib-claude-dispatch-copies). The authority files carry the C901 baseline entries.
"src/claude/lib/*hook_dispatch*.py" = ["C90"]
# ANN suppression for pre-existing code (to be fixed incrementally)
".claude/skills/**/*.py" = ["ANN", "E501"]
".claude/hooks/**/*.py" = ["ANN"]
# ADR-119: src/claude/skills/ is the real directory each shipped .claude/skills/<name>
# links to, so it carries the same pre-existing violations and gets the same waiver.
"src/claude/skills/**/*.py" = ["ANN", "E501"]
# ADR-115: src/cursor/skills/ copies the same support files byte for byte
# (generate_skills.py, artifacts.skills in templates/platforms/cursor.yaml), so it
# carries the same pre-existing violations and gets the same waiver. C90 is
# waived too: the src/claude/skills/ copy carries the C901 baseline entries.
"src/cursor/skills/**/*.py" = ["ANN", "E501", "C90"]
# ADR-115: src/codex/skills/ is the same non-SKILL.md content again.
"src/codex/skills/**/*.py" = ["ANN", "E501", "C90"]
# src/muse/skills/ is the same non-SKILL.md content again, rendered with
# frontmatterKeep (templates/platforms/muse.yaml), so it takes the same C90 waiver.
"src/muse/skills/**/*.py" = ["ANN", "E501", "C90"]
# Copilot CLI mirror trees are generated wholesale from the .claude sources by
# build/scripts/build_all.py (the canonical sources above are the linted copy).
# The generator inlines hooks into wrapper functions, which trips N-series and
# import-order rules that do not apply to generated code, so the whole selected
# rule set is exempt for these trees. Without this, regenerating a single mirror
# surfaces the tree's pre-existing generator-induced violations (~1200) the
# moment the file enters a changed-set.
"src/copilot-cli/hooks/**/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "RUF100", "C90"]
"src/copilot-cli/skills/**/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "RUF100", "C90"]
# Hermes packs (ADR-115) hold byte copies of the .claude skill scripts and the
# rendered lib, so the linted sources above are the copy that matters.
"src/hermes/**/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "ANN", "RUF100", "C90"]
"packages/**/*.py" = ["ANN", "E501"]
# The skillbook schema checker validates values of arbitrary JSON type;
# `Any` is the honest annotation for an instance the checker will narrow.
"scripts/validation/validate_skillbook.py" = ["ANN401"]
# The slow-test recorder wraps `subprocess.Popen.__init__`, `Path.glob`, and
# `os.walk`, forwarding every argument untouched. `Any` is the honest annotation
# for a pass-through wrapper: a narrower one would reject calls the wrapped
# callable accepts, and the wrapper reads none of those arguments.
"scripts/testing/slow_test_report.py" = ["ANN401"]
# Eval and exploration scripts may have long lines and missing annotations
"docs/eval/scripts/**/*.py" = ["ANN", "E501"]
"evals/**/*.py" = ["ANN", "E501"]
"scripts/incoherence.py" = ["ANN", "E501"]
"scripts/openclaw_bridge.py" = ["E501"]
# Intentional noqa: E402 for sys.path-gated import; suppressing RUF100 so the
# marker is not auto-removed and the file stays unchanged from main (avoids a
# semgrep false-positive on the JWT test fixture in a scan of changed files).
"tests/test_redact_secrets.py" = ["RUF100"]

# C901 baseline. These files held a function over max-complexity when C90
# landed (2026-11-01, 217 functions in 189 files). The generated copies waived
# above (src/copilot-cli, src/hermes, src/cursor/skills, src/codex/skills,
# src/muse/skills) are not listed, which leaves 81 files. This table holds
# only the baseline, which may only shrink: split the function, then delete the file's line.
# tests/test_strict_baselines.py fails when a listed file no longer exists or
# no longer has a C901 violation.
[tool.ruff.lint.extend-per-file-ignores]
".claude/lib/claude_hook_dispatch.py" = ["C901"]
".claude/lib/hook_dispatch.py" = ["C901"]
".codeql/scripts/invoke_codeql_scan.py" = ["C901"]
".codeql/scripts/test_codeql_config.py" = ["C901"]
"build/generate_agents.py" = ["C901"]
"build/scripts/build_all.py" = ["C901"]
