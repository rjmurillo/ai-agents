[project]
name = "ai-agents"
version = "0.1.0"
description = "AI agent orchestration framework"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}

dependencies = [
    "anthropic==0.120.0",
    "jsonschema>=4.25.1",
    "markdown-it-py>=4.2.0",
    "python-frontmatter==1.3.0",
    "PyYAML==6.0.3",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.10.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "semgrep==1.171.0",
    "lefthook==2.1.10",
]
eval = [
    # OpenAI + GitHub Models providers (scripts/eval/_providers.py).
    # anthropic is already a core dependency; the default eval needs no extra.
    "openai>=1.40",
]

[tool.uv]
# Semgrep 1.170.0 pins vulnerable versions of these optional MCP server
# dependencies. The scan and MCP command paths both work with the fixed releases.
exclude-newer = "7 days"
override-dependencies = [
    "click==8.3.3",
    "mcp==1.28.1",
]

[tool.uv.exclude-newer-package]
anthropic = false
click = false
lefthook = false
mcp = false
semgrep = false

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "scripts.mcp_cli*", "scripts.memory_sync*", "scripts.hook_utilities*", "scripts.test_result_helpers*", "scripts.pr_maintenance*", "scripts.github_core*", "scripts.ai_review_common*", "scripts.validation*", "scripts.workflow*", "memory_enhancement*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security-focused tests",
    "smoke: Real-CLI smoke tests (need auth/credits; nightly only). The smoke gate asserts these were not skipped (issue #2231 item 4).",
]

[tool.coverage.run]
source = [".claude", "scripts", "scripts/memory_sync", "scripts/memory_enhancement"]
omit = ["**/tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = [".venv", "tests", ".git"]
skips = []

[tool.ruff]
# Match the hook-execution portability floor enforced by
# scripts/validation/validate_python_syntax.py (_SUPPORT_FLOOR). target-version
# governs the syntax ruff may EMIT (formatter) and push toward (pyupgrade), so
# it must track the OLDEST interpreter tracked files must parse on (3.10), not
# the higher requires-python dev/install contract. Setting this to py314 made
# `ruff format` rewrite portable `except (A, B):` into PEP 758 `except A, B:`,
# which the 3.10 floor gate rejects. See issue #3126.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Eval scripts contain embedded prompt text that exceeds 100 chars by design
"scripts/eval/eval-agents.py" = ["E501"]
"scripts/eval/eval-knowledge-integration.py" = ["E501"]
# sys.path manipulation required before imports for plugin-context path resolution
".claude/skills/github/scripts/**/*.py" = ["E402"]
# Test files use sys.path.insert() before importing modules under test
"tests/hooks/**/*.py" = ["E402"]
"tests/skills/**/*.py" = ["E402"]
# ANN suppression for test files (annotations not required in tests)
"tests/**/*.py" = ["ANN"]
"**/tests/**/*.py" = ["ANN"]
# ANN suppression for pre-existing code (to be fixed incrementally)
".claude/skills/**/*.py" = ["ANN"]
".claude/hooks/**/*.py" = ["ANN"]
# Copilot CLI mirror trees are generated wholesale from the .claude sources by
# build/scripts/build_all.py (the canonical sources above are the linted copy).
# The generator inlines hooks into wrapper functions, which trips N-series and
# import-order rules that do not apply to generated code, so the whole selected
# rule set is exempt for these trees. Without this, regenerating a single mirror
# surfaces the tree's pre-existing generator-induced violations (~1200) the
# moment the file enters a changed-set.
"src/copilot-cli/hooks/**/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
"src/copilot-cli/skills/**/*.py" = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
"packages/**/*.py" = ["ANN"]
# The skillbook schema checker validates values of arbitrary JSON type;
# `Any` is the honest annotation for an instance the checker will narrow.
"scripts/validation/validate_skillbook.py" = ["ANN401"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_any_generics = true

# Per-module overrides: suppress disallow_any_generics for pre-existing code
[[tool.mypy.overrides]]
module = "scripts.github_core.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
module = [
    "scripts.validate_skill_installation",
    "scripts.validate_skill_output",
    "scripts.validate_quality_gate_output",
    "scripts.measure_context_retrieval_metrics",
    "scripts.analyze_pr_failure",
    "scripts.pr_branch_mapping",
    "scripts.utils.markdown_parser",
    "scripts.validation.hook_contracts",
    "scripts.forgetful.import_forgetful_memories",
]
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "semantic_hooks.*"
disallow_any_generics = false

[[tool.mypy.overrides]]
# Pre-existing: mock.patch.object(csl.subprocess, ...) triggers spurious
# "None not callable [misc]" when complete_session_log is type-checked
# alongside the test file. The module name has no dotted prefix because
# tests/skills/session-end/ is not a valid Python package (hyphenated).
module = "test_rework_warning"
disable_error_code = ["misc"]

[[tool.mypy.overrides]]
# Pre-existing type debt (arg-type at serena_integration.py:246,
# return-value at :326) unrelated to the atomic-write hardening. The
# scripts.memory_sync modules import this module, so a whole-file mypy
# run on those files surfaces its errors. Scoped here rather than
# suppressed in-file so the debt stays visible and tracked separately.
module = [
    "memory_enhancement.serena_integration",
    "scripts.memory_enhancement.serena_integration",
]
disable_error_code = ["arg-type", "return-value"]

[[tool.mypy.overrides]]
# Pre-existing try/except ImportError fallback pattern (from .path_utils / from
# path_utils) reads as a redefinition under standalone mypy; used across
# scripts/quality_gate/*. Not a real redefinition.
module = [
    "scripts.quality_gate.load_review_results",
    "scripts.quality_gate.check_infrastructure_failures",
]
disable_error_code = ["no-redef"]

[[tool.mypy.overrides]]
# Pre-existing type debt surfaced by the pre-push per-file mypy gate (#2876).
# This test dynamically loads the eval scripts via importlib (their filenames
# are hyphenated, e.g. eval-agent-vs-baseline.py, so they cannot be imported
# as normal modules). Every symbol re-exported from those runtime-loaded
# modules resolves to Any, so annotations that reference them (RunRecord and
# friends) read as valid-type/no-any-return, and bare dict/list annotations
# read as type-arg. Scoped here so the debt stays visible and tracked (#2876)
# rather than suppressed inline. test_form_factor_eval uses the identical
# runtime-load pattern for the same eval scripts, so it shares this scope.
module = [
    "tests.evals.test_eval_agent_vs_baseline",
    "tests.evals.test_form_factor_eval",
]
disable_error_code = ["type-arg", "valid-type", "no-any-return"]

[[tool.mypy.overrides]]
# Pre-existing type debt surfaced by the pre-push per-file mypy gate (#2876).
# The session-episode extractor (.claude canonical + src/copilot-cli mirror,
# both resolving to module memory.scripts.extract_session_episode) annotates
# event records as bare dict/list in 32 spots that predate the causal-link fix
# (#3245). disallow_any_generics flags every one under the per-file gate, so
# touching the file at all trips an unrelated pre-existing gate. Scoped here so
# the debt stays visible and tracked rather than mass-annotated inside the bug
# fix or suppressed inline; new code in the file is typed properly
# (list[dict[str, Any]]).
module = "memory.scripts.extract_session_episode"
disallow_any_generics = false

[[tool.mypy.overrides]]
# Test code gets relaxed generic-type strictness, matching the existing ruff
# ANN waiver for tests/**/*.py ([tool.ruff.lint.per-file-ignores] above). The
# pre-push per-file mypy gate (#2876) surfaces disallow_any_generics/type-arg
# and warn_return_any/no-any-return on any touched test file: bare dict/list
# annotations and json.load() returning Any. These are the lowest-value type
# checks (they demand annotation ceremony without catching test bugs), and the
# ruff waiver already establishes that tests prioritize behavior coverage over
# annotation rigor. Relaxing both here brings mypy into line with that policy so
# editing a test file no longer trips an unrelated pre-existing type gate (#3017).
module = "tests.*"
disallow_any_generics = false
warn_return_any = false

# Mirror of [project.optional-dependencies].dev above. Both tables must list the
# same dev tools: `uv pip install -e ".[dev]"` reads only the extra, while a plain
# `uv sync` installs this group by default and ignores extras (issue #3111). Keep
# the two in sync; tests/test_pyproject_dev_deps_parity.py fails when they drift.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "bandit[sarif]>=1.9.4",
    "pip-audit>=2.10.0",
    "ruff>=0.15.16",
    "mypy>=2.1.0",
    "semgrep==1.171.0",
    "lefthook==2.1.10",
]
